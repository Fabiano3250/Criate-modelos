<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Criate Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#F4F2EC">
<style>
/* Criate Academy · design 2026
   Papel quente, tinta preta e as 3 cores da marca usadas com moderação.
   Títulos em Bricolage Grotesque, texto em Instrument Sans, código em JetBrains Mono. */
:root{color-scheme:light;
  --bg:#F4F2EC;--card:#FFFFFF;--card2:#ECE9E1;--line:#E2DED3;--line2:#D3CEC1;
  --ink:#17171B;--ink2:#3A3A42;--mut:#6E6C74;
  --red:#E63946;--yel:#FFC21A;--blu:#1F6FEB;--ok:#12824A;--okbg:#E4F3EA;--bad:#D62F3C;--badbg:#FBE7E8;
  --pri:#17171B;--onpri:#FFFFFF;--xp:#C98A00;
  --r:18px;--r2:24px;--sh:0 1px 0 rgba(23,23,27,.04),0 10px 30px -18px rgba(23,23,27,.28);
  --fd:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--fb:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;--fm:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --mola:cubic-bezier(.22,1.2,.36,1);--suave:cubic-bezier(.2,.8,.2,1)}
html.escuro{color-scheme:dark;
  --bg:#111113;--card:#1A1A1D;--card2:#242428;--line:#2C2C31;--line2:#3A3A40;
  --ink:#F2F1EC;--ink2:#CFCDC6;--mut:#9A98A0;--okbg:#10291C;--badbg:#2C1416;
  --pri:#F2F1EC;--onpri:#17171B;--xp:#FFC21A;--sh:0 1px 0 rgba(0,0,0,.2),0 14px 34px -20px rgba(0,0,0,.7)}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--fb);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
code,.code{font-family:var(--fm);font-size:.92em}
h1,h2,h3{font-family:var(--fd);letter-spacing:-.02em;margin:0;font-weight:700}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--blu);outline-offset:2px;border-radius:8px}
::selection{background:rgba(31,111,235,.2)}

/* ---------- topo ---------- */
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.top .in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 20px;min-height:60px}
.logo{display:flex;align-items:center;gap:8px;font:700 19px/1 var(--fd);letter-spacing:-.03em;flex:none;white-space:nowrap}
.logo b{font-weight:500;color:var(--mut)}
.nav-d{display:none;gap:2px;margin-left:18px}
.nav-d>*{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:12px;font-weight:600;font-size:15px;color:var(--mut);text-decoration:none;transition:background .2s,color .2s}
.nav-d>*:hover{background:var(--card2);color:var(--ink)}
.nav-d>.on{color:var(--ink);background:var(--card)}
.st{margin-left:auto;display:flex;align-items:center;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 11px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14.5px;font-variant-numeric:tabular-nums}
.pill.streak svg{color:var(--red)}.pill.xpp svg{color:var(--xp)}
.pill.zero.streak svg{color:var(--mut)}
.lvl{height:34px;padding:0 12px;border-radius:99px;background:var(--pri);color:var(--onpri);font:700 13.5px var(--fd);letter-spacing:.01em}
.ib{width:34px;height:34px;border-radius:99px;display:grid;place-items:center;color:var(--mut);border:1px solid transparent}
.ib:hover{background:var(--card2);color:var(--ink)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font:700 11px/1 var(--fb);font-style:normal}

/* barra de baixo (celular) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:9;display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabbar>*{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;border-radius:14px;font-size:11.5px;font-weight:600;color:var(--mut);text-decoration:none}
.tabbar svg.i{width:22px;height:22px}
.tabbar>.on{color:var(--ink)}
.tabbar>.on::before{content:"";position:absolute;top:-7px;width:22px;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}
.tabbar .badge{position:absolute;top:2px;left:calc(50% + 6px)}

/* ---------- estrutura ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:8px 20px 120px}
.col{max-width:680px;margin:0 auto}
.eyebrow{font:600 12px/1 var(--fb);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.voltar{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-weight:600;font-size:15px;padding:16px 0 4px}
.voltar:hover{color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--sh)}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 12px}
.sec-t h2{font-size:19px}
.sec-t button,.sec-t a{font-weight:600;font-size:14px;color:var(--mut);text-decoration:none}
.sec-t button:hover{color:var(--ink)}

/* ---------- início ---------- */
.hello{padding:26px 0 18px}
.hello h1{font-size:clamp(30px,6vw,44px);line-height:1.04;font-weight:700;letter-spacing:-.035em}
.hello p{margin:10px 0 0;color:var(--mut);font-size:16.5px}
.grid-h{display:grid;gap:18px}
.goal{padding:16px 18px;border-radius:var(--r);background:var(--card);border:1px solid var(--line)}
.goal .row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;font-size:15px}
.goal .row b{font:700 15px var(--fd);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width 1s var(--suave)}
.goal.feita .bar>i{background:var(--ok)}
.cont{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:20px;border-radius:var(--r2);background:var(--pri);color:var(--onpri);transition:transform .25s var(--mola)}
.cont:active{transform:scale(.985)}
.cont .mono{background:color-mix(in srgb,var(--onpri) 12%,transparent);color:var(--onpri)}
.cont small{display:block;font:600 12px var(--fb);letter-spacing:.1em;text-transform:uppercase;opacity:.65}
.cont b{display:block;font:700 21px/1.2 var(--fd);letter-spacing:-.02em;margin-top:3px}
.cont .go{margin-left:auto;width:44px;height:44px;border-radius:99px;display:grid;place-items:center;background:var(--onpri);color:var(--pri);flex:none;transition:transform .3s var(--mola)}
.cont:hover .go{transform:translateX(3px)}
.cont .dots{position:absolute;right:-18px;top:-22px;opacity:.16;width:120px;height:120px;pointer-events:none}
.mono{width:52px;height:52px;flex:none;border-radius:16px;display:grid;place-items:center;font:700 17px/1 var(--fm);letter-spacing:-.04em;background:color-mix(in srgb,var(--c,#17171B) 12%,var(--card));color:var(--c,#17171B)}
html.escuro .mono{background:color-mix(in srgb,var(--c,#fff) 18%,var(--card));color:color-mix(in srgb,var(--c,#fff) 70%,#fff)}
.mono svg.i{width:24px;height:24px}
.cats{display:grid;gap:12px}
.catc{position:relative;display:flex;flex-direction:column;gap:14px;text-align:left;padding:20px;border-radius:var(--r2);background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);transition:transform .25s var(--mola),border-color .2s;overflow:hidden}
.catc:hover{border-color:var(--line2);transform:translateY(-2px)}
.catc:active{transform:scale(.985)}
.catc::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.catc .hd{display:flex;align-items:center;gap:14px}
.h3{display:block;font-family:var(--fd);font-weight:700;letter-spacing:-.02em;line-height:1.2}
.catc .h3{font-size:21px}
.catc .p{display:block;margin:3px 0 0;color:var(--mut);font-size:14.5px}
.catc .ft{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--mut);font-weight:600}
.catc .ft .bar{display:block;flex:1;margin:0;height:6px}
.catc .ft .bar>i{background:var(--c)}
.catc .novo{display:inline-block;vertical-align:middle;margin-left:6px;transform:translateY(-2px);font:700 10.5px var(--fb);letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:99px;background:var(--c);color:#fff}

/* nível */
.lvlc{padding:20px}
.lvlc .hd{display:flex;align-items:center;gap:14px}
.lvlc .num{width:56px;height:56px;border-radius:18px;background:var(--pri);color:var(--onpri);display:grid;place-items:center;font:700 24px/1 var(--fd);flex:none;position:relative}
.lvlc .num small{position:absolute;top:7px;font:600 8.5px var(--fb);letter-spacing:.12em;opacity:.6}
.lvlc .num span{margin-top:8px}
.lvlc h3{font-size:20px}
.lvlc p{margin:2px 0 0;color:var(--mut);font-size:14px}
.lvlc .bar{height:8px;margin-top:16px}
.lvlc .bar>i{background:linear-gradient(90deg,var(--red),var(--yel) 50%,var(--blu))}
.lvlc .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-top:8px;font-variant-numeric:tabular-nums}

/* hall da fama */
.hall{padding:20px}
.hall ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.hall li{display:flex;align-items:center;gap:12px;padding:8px 0}
.hall li+li{border-top:1px solid var(--line)}
.pos{width:26px;font:700 15px var(--fd);color:var(--mut);text-align:center;flex:none;font-variant-numeric:tabular-nums}
.av{width:38px;height:38px;border-radius:99px;display:grid;place-items:center;font:700 15px var(--fd);flex:none;color:#fff;background:var(--c,#17171B);text-transform:uppercase}
.av.g{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--yel)}
.nm{flex:1;display:grid;line-height:1.25}
.nm b{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{color:var(--mut);font-size:12.5px}
.pts{font:700 15px var(--fd);font-variant-numeric:tabular-nums;white-space:nowrap}
.pts small{font:600 12px var(--fb);color:var(--mut);margin-left:3px}
.vazio{color:var(--mut);font-size:14px;margin:6px 0 0}

/* medalhas */
.meds{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:14px 10px}
.med{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.med .m{position:relative;width:62px;height:62px;display:grid;place-items:center;color:#fff}
.med .m svg.hex{position:absolute;inset:0;width:100%;height:100%}
.med .m svg.hex path{fill:var(--c);stroke:color-mix(in srgb,var(--c) 70%,#000);stroke-width:2}
.med .m svg.i{position:relative;width:24px;height:24px;stroke-width:2.2}
.med b{font-size:12.5px;line-height:1.25;font-weight:700}
.med small{display:block;font-size:11.5px;color:var(--mut);font-weight:500;line-height:1.3}
.med.off .m{color:var(--mut)}
.med.off .m svg.hex path{fill:var(--card2);stroke:var(--line2);stroke-dasharray:4 4}
.med.off b{color:var(--mut)}
.meds.mini{grid-template-columns:repeat(4,1fr)}
.meds.mini small{display:none}

/* ---------- categoria / curso ---------- */
.cat-h{display:flex;gap:16px;align-items:center;margin:10px 0 22px}
.cat-h .mono{width:64px;height:64px;border-radius:20px}
.cat-h h1{font-size:clamp(28px,5vw,38px);letter-spacing:-.035em}
.cat-h p{margin:2px 0 0;color:var(--mut)}
.cgrid{display:grid;gap:12px;margin-top:18px}
.ccard{display:flex;gap:16px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:18px;box-shadow:var(--sh);transition:transform .25s var(--mola),border-color .2s}
.ccard:hover{border-color:var(--line2)}
.ccard:active{transform:scale(.985)}
.ccard .h3{font-size:19px}
.ccard .p{display:block;margin:2px 0 10px;color:var(--mut);font-size:14.5px}
.ccard .bar{display:block;height:6px;margin:0}.ccard .bar>i{background:var(--c)}
.ccard .meta{display:block;font-size:13px;color:var(--mut);font-weight:600;margin-top:8px}
.ccard.lock{opacity:.6}
.ccard .seta{color:var(--mut);margin-left:auto}
.cinfo{margin:14px 0 0;padding:16px 18px;border-radius:var(--r);background:var(--card2);font-size:15px;color:var(--ink2)}
.cinfo b{color:var(--ink)}
.ch{display:flex;gap:16px;align-items:center;margin-top:10px}
.ch h1{font-size:clamp(28px,5vw,36px);letter-spacing:-.035em}
.ch .sub2{color:var(--mut);font-weight:600;font-size:14.5px}
.ch .mono{width:64px;height:64px;border-radius:20px;font-size:20px}
.cert{margin:18px 0;padding:18px 20px;border-radius:var(--r);background:var(--pri);color:var(--onpri);display:flex;gap:14px;align-items:center}
.cert b{display:block;font:700 18px var(--fd)}
.cert span{opacity:.7;font-size:14px}

/* trilha */
.unit{margin:30px 0 6px;padding:16px 20px;border-radius:var(--r);background:var(--c,#17171B);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px}
.unit small{display:block;font:600 11.5px var(--fb);letter-spacing:.12em;text-transform:uppercase;opacity:.78}
.unit h2{font-size:20px;margin-top:2px;color:#fff}
.unit .uc{font:700 14px var(--fd);opacity:.9;font-variant-numeric:tabular-nums;white-space:nowrap}
.unit.lock{background:var(--card2);color:var(--mut)}
.unit.lock h2{color:var(--mut)}
.path{display:flex;flex-direction:column;align-items:center;gap:10px;padding:48px 0 8px}
.node{position:relative;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--fd);background:var(--card);border:2px dashed var(--line2);color:var(--mut);transition:transform .3s var(--mola)}
.node:active{transform:scale(.92)}
.node.open{border:0;background:var(--pri);color:var(--onpri);box-shadow:0 0 0 6px color-mix(in srgb,var(--pri) 12%,transparent);animation:respira 2.6s ease-in-out infinite}
@keyframes respira{50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--pri) 6%,transparent)}}
.node.done{border:0;background:var(--cc,#17171B);color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.16)}
.node svg.lk{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.node .chk{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.node .lbl{position:absolute;top:100%;margin-top:10px;white-space:nowrap;font:600 13.5px var(--fb);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 11px}
.node:not(.open):not(.done) .lbl{color:var(--mut)}
.node .lbl i{font-style:normal;color:var(--mut);font-weight:500}
.node.open::after{content:"Começar";position:absolute;bottom:100%;margin-bottom:12px;background:var(--yel);color:#17171B;font:700 12.5px var(--fb);padding:5px 11px;border-radius:10px;animation:bob 1.8s ease-in-out infinite;white-space:nowrap}
.node.open::before{content:"";position:absolute;bottom:100%;margin-bottom:6px;border:6px solid transparent;border-top-color:var(--yel);border-bottom:0;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.node .redo{position:absolute;top:-2px;right:-2px;width:24px;height:24px;border-radius:50%;background:var(--card);color:var(--ink);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.node .redo svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.n0,.n4{left:0}.n1,.n3{left:52px}.n2{left:78px}.n5,.n7{left:-52px}.n6{left:-78px}
@media(min-width:700px){.n1,.n3{left:70px}.n2{left:110px}.n5,.n7{left:-70px}.n6{left:-110px}}
.spacer{height:34px}
.pnode{display:flex;gap:14px;align-items:center;width:100%;max-width:460px;margin:16px auto 10px;padding:16px;border-radius:var(--r);border:1.5px dashed var(--line2);background:transparent;color:var(--mut);text-align:left}
.pnode .pi{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--card2);flex:none}
.pnode .pi svg.i{width:22px;height:22px}
.pnode small{display:block;font:600 11px var(--fb);letter-spacing:.1em;text-transform:uppercase}
.pnode b{display:block;font:700 16.5px var(--fd);color:var(--ink);margin:2px 0}
.pnode em{display:block;font-style:normal;font-size:13.5px}
.pnode.open{border:1.5px solid var(--ink);background:var(--card);box-shadow:var(--sh)}
.pnode.open .pi{background:var(--yel);color:#17171B}
.pnode.done{border:1.5px solid var(--cc);background:var(--card)}
.pnode.done .pi{background:var(--cc);color:#fff}
.node.recem{animation:conquista .8s var(--mola) .45s both!important}
@keyframes conquista{0%{transform:scale(.6)}45%{transform:scale(1.14)}100%{transform:scale(1)}}
.node .brilho{position:absolute;inset:0;border-radius:50%;border:3px solid var(--cc);animation:onda 1s ease-out 1s 2 both;pointer-events:none}
@keyframes onda{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(2.1)}}

/* ---------- ranking ---------- */
.rk-h{padding:22px 0 16px}
.rk-h h1{font-size:clamp(30px,6vw,42px);letter-spacing:-.035em}
.rk-h p{margin:8px 0 0;color:var(--mut)}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:var(--card2);margin-bottom:16px}
.seg button{padding:8px 18px;border-radius:10px;font-weight:600;font-size:14.5px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.podio{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:10px;margin:8px 0 18px}
.pd{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.pd .av{width:52px;height:52px;font-size:19px}
.pd:nth-child(2) .av{width:64px;height:64px;font-size:23px}
.pd b{font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd .bl{width:100%;border-radius:14px 14px 6px 6px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font:700 22px var(--fd);padding:10px 0}
.pd .bl small{display:block;font:600 12px var(--fb);color:var(--mut)}
.pd:nth-child(1) .bl{height:76px}.pd:nth-child(2) .bl{height:100px;background:var(--pri);color:var(--onpri);border-color:var(--pri)}.pd:nth-child(2) .bl small{color:inherit;opacity:.65}.pd:nth-child(3) .bl{height:62px}
.rk{padding:8px 18px}
.rk li.eu{margin:0 -10px;padding:8px 10px;border-radius:14px;background:color-mix(in srgb,var(--yel) 16%,var(--card));border-top-color:transparent}
.rk li.eu+li{border-top-color:transparent}
.rk-nota{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:14px 16px;border-radius:var(--r);background:var(--card2);color:var(--ink2);font-size:14px}
.rk-nota svg.i{margin-top:2px;color:var(--mut)}

/* ---------- perfil ---------- */
.pf{display:flex;align-items:center;gap:16px;padding:26px 0 20px}
.pf .av{width:72px;height:72px;font-size:28px}
.pf h1{font-size:clamp(28px,5vw,36px);letter-spacing:-.03em}
.pf p{margin:2px 0 0;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{padding:16px;border-radius:var(--r);background:var(--card);border:1px solid var(--line)}
.stat b{display:block;font:700 26px/1.1 var(--fd);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat small{color:var(--mut);font-size:13px;font-weight:600}
.btn2{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:600}
.btn2:hover{border-color:var(--line2)}

/* ---------- lição ---------- */
.lesson{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.lhead{max-width:720px;width:100%;margin:0 auto;display:flex;align-items:center;gap:14px;padding:14px 20px}
.lhead .bar{flex:1;margin:0;height:10px}
.lhead .bar>i{background:var(--ok)}
.x{width:38px;height:38px;border-radius:99px;display:grid;place-items:center;color:var(--mut)}
.x:hover{background:var(--card2);color:var(--ink)}
.hearts{display:inline-flex;align-items:center;gap:5px;font:700 16px var(--fd);color:var(--red);white-space:nowrap;font-variant-numeric:tabular-nums}
.hearts svg.i{fill:var(--red);stroke:var(--red)}
.lbody{flex:1;overflow:auto}
.lbody .in{max-width:720px;margin:0 auto;padding:10px 20px 36px}
.q{font:700 clamp(22px,4.4vw,28px)/1.2 var(--fd);letter-spacing:-.025em;margin:8px 0 16px}
.tag{display:inline-block;font:600 12px var(--fb);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}
.txt{color:var(--ink2);font-size:17px;line-height:1.65}
.txt b{color:var(--ink)}
.txt code,.opt code,.ana code,.erro code,.tip code,.ptx code{background:var(--card2);border-radius:6px;padding:1px 6px}
.codebox{background:#17171B;color:#EDEBE4;border-radius:16px;padding:16px 18px;font:14.5px/1.75 var(--fm);white-space:pre-wrap;overflow-wrap:anywhere;margin:14px 0}
html.escuro .codebox{background:#0B0B0D;border:1px solid var(--line)}
.codebox .t{color:#8AB6FF}.codebox .a{color:#FFC94D}.codebox .s{color:#86DFA8}
.blank{display:inline-block;min-width:54px;border-bottom:2px solid #8AB6FF;text-align:center;padding:0 6px;margin:0 2px;color:#8AB6FF;font-weight:700;cursor:pointer}
.blank.fill{border-bottom-color:var(--yel);color:var(--yel)}
.opts{display:grid;gap:10px;margin-top:8px}
.opt{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:15px 18px;font-weight:600;font-size:16px;transition:transform .2s var(--mola),border-color .15s,background .15s}
.opt:hover{border-color:var(--line2)}
.opt:active{transform:scale(.985)}
.opt.sel{border-color:var(--ink);background:var(--card);box-shadow:inset 0 0 0 1px var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:9px 13px;font:600 14.5px var(--fm);transition:transform .2s var(--mola)}
.chip:active{transform:scale(.95)}
.chip.used{opacity:.25;pointer-events:none}
.ans{min-height:64px;border:1.5px dashed var(--line2);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;margin:8px 0}
textarea.ed{width:100%;min-height:160px;background:#17171B;color:#EDEBE4;border:0;border-radius:16px;padding:16px;font:14.5px/1.65 var(--fm);resize:vertical;tab-size:2}
textarea.ed:focus{outline:none;box-shadow:0 0 0 3px rgba(31,111,235,.35)}
.pv{margin-top:12px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#fff}
.pv b{display:block;background:var(--card2);color:var(--mut);font:600 12px var(--fb);letter-spacing:.08em;text-transform:uppercase;padding:8px 14px}
.pv iframe{width:100%;height:180px;border:0;display:block;background:#fff}
.pv .pvi{min-height:90px}
.reset{color:var(--mut);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:10px 0 0}
.ana,.erro,.tip{margin:14px 0;padding:14px 16px;border-radius:14px;font-size:15.5px;line-height:1.55;border-left:3px solid}
.ana{background:color-mix(in srgb,var(--blu) 7%,var(--card));border-color:var(--blu);color:var(--ink2)}
.erro{background:color-mix(in srgb,var(--red) 7%,var(--card));border-color:var(--red);color:var(--ink2)}
.tip{background:color-mix(in srgb,var(--yel) 14%,var(--card));border-color:var(--yel);color:var(--ink2)}
.ana>b:first-child,.erro>b:first-child,.tip>b:first-child{display:block;font:600 11.5px var(--fb);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);margin-bottom:4px}
.objs{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:8px;counter-reset:o}
.objs li{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 16px;font-weight:600;counter-increment:o}
.objs li::before{content:counter(o);width:26px;height:26px;flex:none;border-radius:8px;background:var(--card2);display:grid;place-items:center;font:700 13px var(--fd)}
.prof{display:flex;gap:12px;align-items:flex-start;margin-top:18px;color:var(--mut);font-size:14.5px;line-height:1.5}
.prof svg.i{margin-top:2px}
.lfoot{border-top:1px solid var(--line);padding:16px 20px calc(16px + env(safe-area-inset-bottom));background:var(--card)}
.lfoot .in{max-width:720px;margin:0 auto}
.big{width:100%;border-radius:16px;padding:16px;font:700 17px var(--fd);letter-spacing:.01em;background:var(--pri);color:var(--onpri);transition:transform .2s var(--mola),opacity .2s}
.big:active:not(:disabled){transform:scale(.985)}
.big:disabled{background:var(--card2);color:var(--mut)}
@media(min-width:700px){.lfoot .in{display:flex;justify-content:flex-end}.lfoot .big{width:auto;min-width:220px;padding:15px 28px}.lfoot.fb .in{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:28px;align-items:center}.lfoot.fb .fbt,.lfoot.fb .fbx{grid-column:1}.lfoot.fb .big{grid-column:2;grid-row:1/span 3}}
.fb.ok{background:var(--okbg);border-top-color:transparent}.fb.bad{background:var(--badbg);border-top-color:transparent}
.fbt{font:700 21px var(--fd);margin-bottom:2px;display:flex;align-items:center;gap:8px}
.ok .fbt{color:var(--ok)}.bad .fbt{color:var(--bad)}
.fbx{font-size:15px;color:var(--ink2);margin-bottom:12px}
@media(min-width:700px){.fbx{margin-bottom:0}.fbx .codebox{max-width:520px}}
.fbx .codebox{margin:6px 0}
.ok .big{background:var(--ok);color:#fff}
.bad .big{background:var(--bad);color:#fff}
.end{text-align:center;padding-top:22px}
.end h2{font-size:30px;margin:10px 0 6px}
.res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:24px 0}
.res.r2{grid-template-columns:repeat(2,minmax(0,1fr))}
.res div{border-radius:var(--r);padding:16px 6px 14px;background:var(--card);border:1px solid var(--line);animation:sobe .55s var(--mola) both}
.res div:nth-child(1){animation-delay:.7s}.res div:nth-child(2){animation-delay:.8s}.res div:nth-child(3){animation-delay:.9s}
.res .r-ic{display:flex;justify-content:center;margin-bottom:4px;color:var(--mut)}
.res b{display:block;font:700 28px var(--fd);font-variant-numeric:tabular-nums}
.res small{color:var(--mut);font-size:13px;font-weight:600}
.novidade{display:flex;align-items:center;gap:12px;text-align:left;margin:0 0 12px;padding:14px 16px;border-radius:var(--r);background:var(--pri);color:var(--onpri);animation:sobe .55s var(--mola) 1s both}
.novidade .m{width:44px;height:44px}
.novidade b{display:block;font:700 16px var(--fd)}
.novidade small{opacity:.7;font-size:13.5px}
.selo{position:relative;width:140px;height:140px;margin:6px auto 4px;display:grid;place-items:center}
.selo svg{width:124px;height:124px}
.selo .s-ring{fill:none;stroke:color-mix(in srgb,var(--cc) 25%,transparent);stroke-width:5;stroke-dasharray:340;animation:desenha .8s var(--suave) both;--len:340}
.selo .s-fill{fill:var(--cc);transform-origin:60px 60px;animation:brota .6s var(--mola) .25s both}
.selo .s-chk{fill:none;stroke:#fff;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:70;animation:desenha .45s ease-out .75s both;--len:70}
.selo .s-halo{display:none}
.selo .sp{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;border-radius:2px;background:var(--cc);opacity:0;animation:faisca .9s ease-out .7s both;transform:rotate(var(--a))}
.selo .sp:nth-of-type(even){background:var(--yel)}
.selo .s-ic{position:absolute;right:6px;bottom:8px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--yel);color:#17171B;animation:brota .5s var(--mola) 1.1s both;box-shadow:0 0 0 4px var(--bg)}
@keyframes faisca{0%{opacity:0;transform:rotate(var(--a)) translateY(-30px) scale(.4)}30%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) translateY(-84px) scale(1)}}
@keyframes desenha{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes brota{0%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.06)}100%{transform:scale(1)}}
.confete{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confete i{position:absolute;top:-12px;width:8px;height:13px;border-radius:2px;animation:cai linear forwards}
@keyframes cai{to{top:105%;transform:rotate(720deg) translateX(40px)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* teste prático */
.pmis{margin:16px 0;display:grid;gap:8px}.pmis>b{font:700 16px var(--fd)}
.pstep{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card)}
.pstep.ok{border-color:var(--ok);background:var(--okbg)}.pstep.no{border-color:var(--bad)}
.prow{display:flex;gap:12px;align-items:flex-start}
.pico{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:700 13px var(--fd);background:var(--card2)}
.pstep.ok .pico{background:var(--ok);color:#fff}.pstep.no .pico{background:var(--bad);color:#fff}
.ptx{flex:1;font-size:15px;line-height:1.5}
.pajuda{flex:none;border-radius:10px;padding:6px 10px;background:var(--card2);font-size:13px;font-weight:600}
.paj{margin-top:10px;font-size:14.5px;line-height:1.55}
textarea.ped{min-height:240px}.ppv iframe{height:260px}
.pfb{margin-top:12px}.psol{margin:16px 0 6px;font-size:14.5px}.psol summary{font-weight:600;cursor:pointer;padding:6px 0}
/* conversa */
.zap{display:flex;flex-direction:column;gap:8px;margin:14px 0;padding:14px;border-radius:16px;background:#EDE7DE}
html.escuro .zap{background:#1A2420}
.zb{max-width:88%;padding:8px 12px 9px;border-radius:12px;font-size:15px;line-height:1.45;color:#111;box-shadow:0 1px 1px rgba(0,0,0,.06);white-space:pre-wrap}
.zb small{display:block;font-size:11.5px;font-weight:700;opacity:.55;margin-bottom:2px}
.zb.cli{background:#fff;align-self:flex-start;border-top-left-radius:4px}
.zb.eu{background:#D9FDD3;align-self:flex-end;border-top-right-radius:4px}
html.escuro .zb.cli{background:#202c33;color:#e9edef}html.escuro .zb.eu{background:#005c4b;color:#e9edef}
.msgEd{width:100%;min-height:140px;margin-top:12px;font:16px/1.55 var(--fb);padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
.msgEd:focus{outline:none;border-color:var(--ink)}
.small2{font-size:13.5px;color:var(--mut);margin-top:8px}
.chkL{margin-top:14px;display:grid;gap:8px;font-size:15px}
.chkL label{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);cursor:pointer}
.chkL input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--ok)}

/* avisos */
@keyframes nao{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.nao{animation:nao .4s ease-in-out}
#dicaLock{position:fixed;left:50%;bottom:96px;transform:translate(-50%,14px);opacity:0;pointer-events:none;z-index:60;background:var(--pri);color:var(--onpri);font-weight:600;font-size:14px;padding:11px 18px;border-radius:14px;transition:opacity .25s,transform .35s var(--mola);box-shadow:0 14px 34px -12px rgba(0,0,0,.45);max-width:calc(100vw - 32px);text-align:center}
#dicaLock.show{opacity:1;transform:translate(-50%,0)}

/* movimento */
@keyframes sobe{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes vemDir{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes vemEsq{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes overlay{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes rodape{from{transform:translateY(100%)}to{transform:none}}
.tr-f .anim,.tr-f .unit,.tr-f .pnode{animation:sobe .55s var(--suave) both;animation-delay:calc(var(--i,0)*45ms)}
.tr-b .anim,.tr-b .unit,.tr-b .pnode{animation:vemEsq .45s var(--suave) both;animation-delay:calc(var(--i,0)*35ms)}
.tr-f .node:not(.open),.tr-b .node:not(.open){animation:brota .5s var(--mola) both;animation-delay:calc(var(--i,0)*40ms)}
.lesson:not([hidden]){animation:overlay .35s var(--suave)}
.ex-in{animation:vemDir .4s var(--suave)}
.lfoot.fb{animation:rodape .3s var(--mola)}
.end h2{animation:sobe .5s var(--suave) .5s both}.end .txt{animation:sobe .5s var(--suave) .6s both}

}

  {t:'mc',q:'O que está errado em <h1>Promoção<h1> ?',o:['Nada, está certo','Falta a barra no fechamento: </h1>','O texto deveria estar fora','h1 não existe'],a:1,w:'O segundo <h1> deveria ser </h1>. Sem a barra, o navegador entende que abriu outro título.'},
  {t:'fill',q:'Complete pra fechar o título:',code:'<h1>Bem-vindo</___>',o:['/h1','h1','p','h2'],a:['h1'],w:'A barra já está ali. Falta só o nome da tag: </h1>.'},
  {t:'type',q:'Sua vez! Escreva um título <h1> com o texto Olá',start:'',hint:'<h1>Olá</h1>',check:d=>{const h=d.querySelector('h1');return !!h&&/ol[aá]/i.test(h.textContent)},w:'<h1>Olá</h1>'}
 ]},
 {n:'Títulos',i:'🔠',obj:['Usar os 6 níveis de título','Entender a hierarquia da página','Escolher o título pela importância'],ex:[
  {t:'info',q:'Seis níveis de título',ana:'Pense no sumário de um livro: o nome do livro, depois os capítulos, depois as partes de cada capítulo. Os títulos do HTML seguem essa mesma ordem de importância.',b:'Existem 6 tags de título:\n• <code>&lt;h1&gt;</code>: o mais importante (o nome do livro)\n• <code>&lt;h2&gt;</code>: as seções (os capítulos)\n• <code>&lt;h3&gt;</code>: partes de uma seção\n• ... até <code>&lt;h6&gt;</code>, o menos importante\n\nO "h" vem de <i>heading</i>, que é "título" em inglês.',code:'<h1>Clínica Sorriso</h1>\n<h2>Tratamentos</h2>\n<h3>Clareamento</h3>\n<h3>Implante</h3>',show:true,tip:'Use só UM h1 por página. O Google usa ele pra entender o assunto principal do site.'},
  {t:'mc',q:'Qual é o título MAIS importante?',o:['<h6>','<h3>','<h1>','<title>'],a:2,w:'O h1 é o mais importante e geralmente o maior.'},
  {t:'mc',q:'Quantos níveis de título existem no HTML?',o:['3','6','10','Infinitos'],a:1,w:'São 6: do h1 ao h6.'},
  {t:'info',q:'Importância, não tamanho',b:'Um erro muito comum: escolher <code>h3</code> só porque ele é "menor e mais bonitinho".\n\nO número do h diz a <b>importância</b>. O <b>tamanho</b> você ajusta depois, com CSS.\n\nRegra prática: desça um nível de cada vez. Depois de um h2 vem h3, não h5.',erro:'Pular níveis (h1 → h4) ou usar h1 várias vezes. Isso confunde o Google e leitores de tela.'},
  {t:'mc',q:'Num site de clínica, qual faz mais sentido?',o:['Nome da clínica em h1, "Tratamentos" em h2','Tudo em h1','Nome em h4 porque fica menor','Tratamentos em h1 e nome em h2'],a:0,w:'O nome da clínica é o assunto principal (h1). As seções vêm em h2.'},
  {t:'build',q:'Monte um subtítulo:',o:['<h2>','Serviços','</h2>','<h7>'],a:['<h2>','Serviços','</h2>'],w:'<h2>Serviços</h2>. Não existe h7!'},
  {t:'type',q:'Monte a hierarquia: um <h1>, um <h2> embaixo e um <h3> embaixo do h2',start:'<h1>Minha clínica</h1>\n',hint:'<h2>Tratamentos</h2>\n<h3>Clareamento</h3>',check:d=>!!d.querySelector('h1')&&!!d.querySelector('h2')&&!!d.querySelector('h3'),w:'<h1>Minha clínica</h1>\n<h2>Tratamentos</h2>\n<h3>Clareamento</h3>'}
 ]},
 {n:'Textos e quebras de linha',i:'📝',obj:['Criar parágrafos','Entender por que o Enter não pula linha','Usar <br> do jeito certo','Destacar palavras'],ex:[
  {t:'info',q:'Parágrafos com <p>',b:'Textos ficam dentro de <code>&lt;p&gt;</code> (de <i>paragraph</i>).\n\nCada <code>&lt;p&gt;</code> é um parágrafo separado, e o navegador coloca um espaço automático entre um e outro.',code:'<p>Primeiro parágrafo.</p>\n<p>Segundo parágrafo.</p>',show:true},
  {t:'info',q:'O mistério do Enter',ana:'Pense no HTML como alguém que só ouve as tags. Os espaços e Enters que você dá no código, pra ele, são só "respiro" pra você ler melhor. Ele ignora.',b:'Olhe este código: o texto está em 3 linhas no código, com vários Enters.\n\nMas veja o resultado: aparece <b>tudo numa linha só</b>!\n\nIsso acontece porque o HTML <b>junta todos os espaços e quebras em um único espaço</b>. Pra quebrar a linha de verdade, você precisa de uma tag.',code:'<p>Rua das Flores, 100\n\nCentro\n\nTangará - SC</p>',show:true},
  {t:'mc',q:'Você deu 3 Enters no meio de um texto no código. O que acontece na página?',o:['Aparecem 3 linhas em branco','Nada: vira um espaço só','O texto some','Dá erro'],a:1,w:'O HTML ignora quebras do código. Vários Enters ou espaços viram um espaço só.'},
  {t:'info',q:'A tag <br>: quebra de linha',b:'Pra pular de linha <b>dentro do mesmo parágrafo</b>, use <code>&lt;br&gt;</code> (de <i>break</i>, quebrar).\n\nDetalhes importantes:\n• Ela <b>não tem fechamento</b>. Não existe <code>&lt;/br&gt;</code>.\n• Ela vai exatamente onde você quer que a linha quebre.\n• Você pode escrever <code>&lt;br&gt;</code> ou <code>&lt;br /&gt;</code>, os dois funcionam.',code:'<p>Rua das Flores, 100<br>\nCentro<br>\nTangará - SC</p>',show:true,tip:'Agora sim: cada <br> pulou uma linha. Compare com o exemplo anterior, sem <br>.'},
  {t:'info',q:'Quando usar <br> e quando usar <p>?',b:'<b>Use &lt;br&gt;</b> quando as linhas fazem parte da MESMA informação:\n• endereço (rua / bairro / cidade)\n• horário (Seg a Sex / Sábado)\n• versos de poema ou letra\n\n<b>Use outro &lt;p&gt;</b> quando é um assunto novo, outro parágrafo.',code:'<p>Seg a Sex: 8h às 18h<br>\nSábado: 8h às 12h</p>\n<p>Atendemos com hora marcada.</p>',show:true,erro:'Usar vários <br><br><br> só pra dar espaço entre blocos. Pra espaço, o certo é usar outro <p> (ou CSS, que você vai aprender).'},
  {t:'mc',q:'Qual destas está ERRADA?',o:['Linha 1<br>Linha 2','Linha 1<br />Linha 2','Linha 1</br>Linha 2','<p>Oi<br>tchau</p>'],a:2,w:'Não existe </br>. A br não tem fechamento: só <br> ou <br />.'},
  {t:'mc',q:'Você quer mostrar o endereço da clínica em 3 linhas. O melhor é:',o:['3 parágrafos <p> separados','1 parágrafo com <br> entre as linhas','Dar Enter no código','Usar <h1> em cada linha'],a:1,w:'É a mesma informação (o endereço), então fica num <p> só, com <br> separando as linhas.'},
  {t:'fill',q:'Quebre a linha entre o nome e o telefone:',code:'<p>Dra. Ana<___>(49) 99999-0000</p>',o:['br','/br','p','hr'],a:['br'],w:'<br> sozinho, sem fechamento, bem onde a linha deve quebrar.'},
  {t:'build',q:'Monte o horário em 2 linhas:',o:['<p>','Seg a Sex','<br>','Sábado','</p>','</br>'],a:['<p>','Seg a Sex','<br>','Sábado','</p>'],w:'O </br> não existe. Fica: <p>Seg a Sex<br>Sábado</p>.'},
  {t:'type',q:'Escreva um parágrafo com um endereço em 3 linhas usando <br>',start:'<p>\n\n</p>',hint:'<p>Rua A, 10<br>Centro<br>Tangará - SC</p>',check:d=>{const p=d.querySelector('p');return !!p&&p.querySelectorAll('br').length>=2},w:'<p>Rua A, 10<br>Centro<br>Tangará - SC</p>'},
  {t:'info',q:'Destacando palavras',b:'Dentro do texto você pode destacar palavras:\n• <code>&lt;strong&gt;</code> marca algo <b>importante</b> (aparece em negrito)\n• <code>&lt;em&gt;</code> dá <i>ênfase</i> (aparece em itálico)\n\nElas ficam <b>dentro</b> do <code>&lt;p&gt;</code>, em volta só da palavra que você quer destacar.',code:'<p>Avaliação <strong>grátis</strong> e <em>sem compromisso</em>!</p>',show:true},
  {t:'mc',q:'Qual tag deixa um texto em negrito?',o:['<b-text>','<strong>','<em>','<big>'],a:1,w:'<strong> marca algo importante e aparece em negrito.'},
  {t:'fill',q:'Deixe a palavra em itálico:',code:'<p>Eu <___>adoro</em> programar</p>',o:['em','strong','p','i/'],a:['em'],w:'<em> abre, </em> fecha.'},
  {t:'type',q:'Escreva um parágrafo com uma palavra em <strong> e uma quebra de linha <br>',start:'',hint:'<p>Consulta <strong>grátis</strong><br>Agende já</p>',check:d=>!!d.querySelector('p strong')&&!!d.querySelector('p br'),w:'<p>Consulta <strong>grátis</strong><br>Agende já</p>'}
 ]},
 {n:'Listas',i:'📋',obj:['Criar listas com marcadores','Criar listas numeradas','Saber quando usar cada uma'],ex:[
  {t:'info',q:'Listas com marcadores',ana:'Uma lista de compras: a ordem não importa, você só quer ver os itens. Isso é uma lista com bolinhas.',b:'Uma lista tem duas partes:\n• <code>&lt;ul&gt;</code> (<i>unordered list</i>): a "caixa" da lista, com bolinhas\n• <code>&lt;li&gt;</code> (<i>list item</i>): cada item, sempre DENTRO da ul',code:'<ul>\n  <li>Limpeza</li>\n  <li>Clareamento</li>\n  <li>Implante</li>\n</ul>',show:true,tip:'Menus de sites quase sempre são listas ul por baixo, só que estilizadas com CSS.'},
  {t:'info',q:'Listas numeradas',ana:'Uma receita de bolo: a ordem importa (primeiro mistura, depois assa). Isso é uma lista numerada.',b:'Troque <code>ul</code> por <code>&lt;ol&gt;</code> (<i>ordered list</i>) e os itens viram 1, 2, 3... sozinhos. Você não precisa digitar os números.',code:'<ol>\n  <li>Chame no WhatsApp</li>\n  <li>Agende a avaliação</li>\n  <li>Comece o tratamento</li>\n</ol>',show:true,erro:'Colocar <li> solto, sem a <ul> ou <ol> em volta. O item até aparece, mas fica fora de uma lista de verdade.'},
  {t:'mc',q:'Qual tag cria uma lista NUMERADA?',o:['<ul>','<li>','<ol>','<list>'],a:2,w:'ol = ordered list (lista ordenada).'},
  {t:'mc',q:'"Como funciona a primeira consulta" em 3 passos. Qual lista usar?',o:['<ul>, porque é mais bonita','<ol>, porque a ordem importa','Nenhuma, usar 3 <h1>','<li> sozinho'],a:1,w:'Passos têm ordem: 1, 2, 3. Então ol.'},
  {t:'build',q:'Monte uma lista com um item:',o:['<ul>','<li>','Pizza','</li>','</ul>'],a:['<ul>','<li>','Pizza','</li>','</ul>'],w:'A ul abre por fora, o li fica dentro.'},
  {t:'fill',q:'Complete o item da lista:',code:'<ul>\n  <___>Café</li>\n</ul>',o:['li','ul','ol','p'],a:['li'],w:'Cada item é um <li>.'},
  {t:'type',q:'Crie uma lista NUMERADA com 3 passos',start:'<ol>\n  \n</ol>',hint:'Coloque 3 <li> dentro da ol',check:d=>d.querySelectorAll('ol li').length>=3,w:'<ol>\n  <li>Um</li>\n  <li>Dois</li>\n  <li>Três</li>\n</ol>'}
 ]}
]},
{u:'Unidade 2',t:'Links, imagens e estrutura',l:[
 {n:'Links',i:'🔗',obj:['Criar links','Entender atributos','Fazer links de WhatsApp, telefone e e-mail'],ex:[
  {t:'info',q:'A anatomia de um link',ana:'Um link é como uma placa de rua: tem o texto que as pessoas leem ("Centro →") e o destino real pra onde ela leva.',b:'Links usam a tag <code>&lt;a&gt;</code>. Repare nas partes:\n• <code>href="..."</code>: o <b>destino</b> (pra onde leva)\n• o texto entre as tags: o que a pessoa <b>vê e clica</b>\n\nO <code>href</code> é um <b>atributo</b>: uma configuração extra que fica DENTRO da tag de abertura, no formato <code>nome="valor"</code>.',code:'<a href="https://google.com">Ir pro Google</a>',show:true},
  {t:'mc',q:'Onde fica o endereço do link?',o:['No texto entre as tags','No atributo href','No atributo src','Na tag </a>'],a:1,w:'href = endereço pra onde o link leva.'},
  {t:'info',q:'Links que todo site de clínica tem',b:'O <code>href</code> não precisa ser um site. Ele pode abrir apps:\n• <b>WhatsApp:</b> <code>https://wa.me/5549999990000</code> (55 + DDD + número, só números)\n• <b>Ligar:</b> <code>tel:+5549999990000</code>\n• <b>E-mail:</b> <code>mailto:contato@clinica.com</code>\n• <b>Parte da página:</b> <code>#contato</code> (rola até o elemento com <code>id="contato"</code>)',code:'<a href="https://wa.me/5549999990000">Chamar no WhatsApp</a>\n<a href="tel:+5549999990000">Ligar</a>',show:true,erro:'Esquecer o https:// em links de outros sites. Sem ele, o navegador procura uma página com esse nome DENTRO do seu site e dá erro.'},
  {t:'fill',q:'Complete o link do WhatsApp:',code:'<a ___="https://wa.me/5548999999999">WhatsApp</a>',o:['href','src','link','alt'],a:['href'],w:'Links usam href.'},
  {t:'info',q:'Abrir em nova aba',b:'Coloque <code>target="_blank"</code> pro link abrir numa aba nova. Assim a pessoa não sai do seu site.\n\nUse em links pra OUTROS sites (Instagram, Google Maps). Em links do próprio site, não precisa.',code:'<a href="https://instagram.com" target="_blank">Instagram</a>'},
  {t:'mc',q:'O que target="_blank" faz?',o:['Deixa o link em branco','Abre em nova aba','Esconde o link','Deixa o link azul'],a:1,w:'Abre o link numa aba nova.'},
  {t:'mc',q:'Qual link LIGA pro número quando tocado no celular?',o:['<a href="49999990000">','<a href="tel:+5549999990000">','<a call="49999990000">','<a href="wa:49999990000">'],a:1,w:'tel: + número. No celular, abre o discador.'},
  {t:'type',q:'Crie um link de WhatsApp pro número 5549999990000 com o texto Agendar',start:'',hint:'<a href="https://wa.me/5549999990000">Agendar</a>',check:d=>{const a=d.querySelector('a[href]');return !!a&&/wa\.me\/5549999990000/.test(a.getAttribute('href'))&&/agendar/i.test(a.textContent)},w:'<a href="https://wa.me/5549999990000">Agendar</a>'}
 ]},
 {n:'Imagens',i:'🖼️',obj:['Inserir imagens','Usar src e alt','Entender caminhos de arquivo'],ex:[
  {t:'info',q:'Colocando imagens',b:'A tag <code>&lt;img&gt;</code> mostra uma imagem. Ela usa dois atributos:\n• <code>src</code> (<i>source</i>, origem): QUAL arquivo mostrar\n• <code>alt</code> (alternativo): uma descrição da imagem\n\n<b>Detalhe:</b> img não tem tag de fechamento, igual à br!',code:'<img src="foto.jpg" alt="Foto da equipe">'},
  {t:'info',q:'O caminho do arquivo',ana:'O src é como um endereço de entrega. Se você erra a rua, o entregador não acha a casa: a imagem não aparece.',b:'O src depende de ONDE a imagem está em relação ao seu HTML:\n• mesma pasta: <code>src="foto.jpg"</code>\n• dentro de uma pasta img: <code>src="img/foto.jpg"</code>\n• na internet: <code>src="https://site.com/foto.jpg"</code>\n\nMaiúsculas importam: <code>Foto.JPG</code> é diferente de <code>foto.jpg</code>.',erro:'90% das imagens quebradas são caminho errado: nome diferente, pasta errada ou maiúscula trocada.'},
  {t:'mc',q:'Qual atributo diz QUAL imagem mostrar?',o:['alt','href','src','img'],a:2,w:'src = source, a origem da imagem.'},
  {t:'mc',q:'Pra que serve o alt?',o:['Deixar a imagem maior','Descrever a imagem','Trocar a cor','Virar um link'],a:1,w:'O alt descreve a imagem pra leitores de tela e pro Google. E aparece se a imagem não carregar.'},
  {t:'mc',q:'A foto está em img/sorriso.jpg. Qual src está certo?',o:['src="sorriso.jpg"','src="img/sorriso.jpg"','src="img\\sorriso"','src="Img/Sorriso.JPG"'],a:1,w:'Pasta + barra + nome exato do arquivo: img/sorriso.jpg.'},
  {t:'fill',q:'Complete a imagem:',code:'<img ___="logo.png" ___="Logo da empresa">',o:['src','alt','href','title'],a:['src','alt'],w:'Primeiro o src (arquivo), depois o alt (descrição).'},
  {t:'mc',q:'Qual destas está CERTA?',o:['<img src="a.jpg"></img>','<img src="a.jpg" alt="Gato">','<image href="a.jpg">','<img>a.jpg</img>'],a:1,w:'img não fecha e usa src + alt.'},
  {t:'type',q:'Coloque uma imagem com src e alt (pode inventar o nome do arquivo)',start:'',hint:'<img src="img/equipe.jpg" alt="Equipe da clínica">',check:d=>{const i=d.querySelector('img');return !!i&&!!i.getAttribute('src')&&!!(i.getAttribute('alt')||'').trim()},w:'<img src="img/equipe.jpg" alt="Equipe da clínica">'}
 ]},
 {n:'Estrutura',i:'🏗️',obj:['Montar o esqueleto completo','Diferenciar head e body','Criar a estrutura no VS Code em 1 segundo'],ex:[
  {t:'info',q:'O esqueleto completo',ana:'Pense num teatro. O <b>body</b> é o palco: tudo que o público vê. O <b>head</b> são os bastidores: coisas importantes que o público não vê, como o nome da peça e a iluminação.',b:'Uma página de verdade tem uma estrutura fixa:\n• <code>&lt;!DOCTYPE html&gt;</code>: avisa que é HTML moderno\n• <code>&lt;html&gt;</code>: a caixa que envolve tudo\n• <code>&lt;head&gt;</code>: os bastidores (título da aba, acentos, CSS)\n• <code>&lt;body&gt;</code>: o palco, o que aparece na tela',code:'<!DOCTYPE html>\n<html lang="pt-BR">\n  <head>\n    <meta charset="utf-8">\n    <title>Minha página</title>\n  </head>\n  <body>\n    <h1>Oi!</h1>\n  </body>\n</html>',tip:'No VS Code, num arquivo .html vazio, digite ! e aperte Enter: ele escreve essa estrutura toda pra você.'},
  {t:'mc',q:'Onde fica o conteúdo que APARECE na tela?',o:['<head>','<title>','<body>','<!DOCTYPE>'],a:2,w:'Tudo que aparece vai no body.'},
  {t:'mc',q:'O <title> aparece onde?',o:['No meio da página','Na aba do navegador','No rodapé','Em lugar nenhum'],a:1,w:'O title é o nome que aparece na aba e no resultado do Google.'},
  {t:'info',q:'Recuo: o código "em escadinha"',b:'Repare que o código acima tem espaços no começo das linhas. Isso se chama <b>recuo</b> (ou indentação).\n\nTudo que está DENTRO de uma tag fica um pouco mais pra direita. Assim você enxerga quem está dentro de quem.\n\nPro navegador não muda nada. É pra você (e quem for mexer depois) entender o código.',tip:'No VS Code, Shift+Alt+F arruma o recuo do arquivo inteiro sozinho.'},
  {t:'build',q:'Monte a ordem certa:',o:['<html>','<head>','</head>','<body>','</body>','</html>'],a:['<html>','<head>','</head>','<body>','</body>','</html>'],w:'html por fora, head primeiro, body depois.'},
  {t:'mc',q:'Se os acentos aparecem como "Ã©", o que falta?',o:['<title>','<meta charset="utf-8">','<body>','Um <h1>'],a:1,w:'O charset utf-8 resolve acentos quebrados.'}
 ]},
 {n:'Organizando',i:'📦',obj:['Agrupar conteúdo com div','Usar tags semânticas','Entender o que é "dentro de"'],ex:[
  {t:'info',q:'Caixas pra organizar',ana:'Pense numa gaveta com divisórias: meias de um lado, camisetas do outro. As caixas do HTML separam a página em partes.',b:'<code>&lt;div&gt;</code> é uma caixa genérica, sem significado, só pra agrupar coisas.\n\nTambém existem caixas <b>semânticas</b>, que dizem o que a parte É:\n• <code>&lt;header&gt;</code>: o topo (logo e menu)\n• <code>&lt;nav&gt;</code>: o menu\n• <code>&lt;main&gt;</code>: o conteúdo principal\n• <code>&lt;section&gt;</code>: uma seção\n• <code>&lt;footer&gt;</code>: o rodapé',code:'<header>Logo e menu</header>\n<main>\n  <section>Sobre</section>\n  <section>Tratamentos</section>\n</main>\n<footer>Contato</footer>',show:true,tip:'Tags semânticas ajudam o Google a entender o site. Prefira elas à div quando fizer sentido.'},
  {t:'mc',q:'Qual tag é usada pro RODAPÉ?',o:['<bottom>','<footer>','<end>','<header>'],a:1,w:'footer = rodapé.'},
  {t:'mc',q:'Qual é a "caixa genérica" do HTML?',o:['<box>','<div>','<span>','<group>'],a:1,w:'div é a caixa mais usada pra agrupar.'},
  {t:'info',q:'header não é head!',b:'Esses dois confundem todo mundo no começo:\n• <code>&lt;head&gt;</code>: os bastidores, NÃO aparece na tela\n• <code>&lt;header&gt;</code>: o topo do site, APARECE na tela, fica dentro do body',erro:'Colocar o logo e o menu dentro do <head>. Eles não aparecem, porque o head é invisível.'},
  {t:'fill',q:'Complete o topo do site:',code:'<___>\n  <h1>Meu site</h1>\n</header>',o:['header','head','top','footer'],a:['header'],w:'header é o topo visível. Não confunda com head!'},
  {t:'type',q:'Crie um <header> com um <h1> dentro e um <footer> com um <p> dentro',start:'',hint:'<header>\n  <h1>Meu site</h1>\n</header>\n<footer>\n  <p>Contato</p>\n</footer>',check:d=>!!d.querySelector('header h1')&&!!d.querySelector('footer p'),w:'<header>\n  <h1>Meu site</h1>\n</header>\n<footer>\n  <p>Contato</p>\n</footer>'}
 ]}
]},
{u:'Unidade 3',t:'Tabelas e formulários',l:[
 {n:'Tabelas',i:'🧮',obj:['Montar tabelas','Diferenciar th e td','Saber quando usar tabela'],ex:[
  {t:'info',q:'Dados em linhas e colunas',ana:'Pense numa planilha: linhas na horizontal, colunas na vertical, e cada quadradinho é uma célula.',b:'Uma tabela é montada linha por linha:\n• <code>&lt;table&gt;</code>: a tabela inteira\n• <code>&lt;tr&gt;</code>: uma linha (<i>table row</i>)\n• <code>&lt;th&gt;</code>: célula de cabeçalho (o título da coluna)\n• <code>&lt;td&gt;</code>: célula comum (<i>table data</i>)\n\nAs células ficam SEMPRE dentro de uma tr.',code:'<table>\n  <tr><th>Tratamento</th><th>Sessões</th></tr>\n  <tr><td>Limpeza</td><td>1</td></tr>\n  <tr><td>Clareamento</td><td>3</td></tr>\n</table>',show:true,tip:'Tabela é pra dados (preços, horários). Nunca use tabela pra montar o layout da página.'},
  {t:'mc',q:'Qual tag cria uma LINHA da tabela?',o:['<td>','<tr>','<th>','<line>'],a:1,w:'tr = table row (linha).'},
  {t:'mc',q:'Qual a diferença entre th e td?',o:['Nenhuma','th é cabeçalho, td é célula comum','td é maior','th é uma imagem'],a:1,w:'th fica em negrito por padrão: é o título da coluna.'},
  {t:'mc',q:'Uma tabela com 2 colunas e 3 linhas tem quantas <tr>?',o:['2','3','5','6'],a:1,w:'Uma tr pra cada linha: 3 linhas, 3 tr. As colunas são as células dentro de cada tr.'},
  {t:'fill',q:'Complete a célula:',code:'<tr>\n  <___>Pizza</td>\n</tr>',o:['td','tr','th','table'],a:['td'],w:'Célula comum é td.'},
  {t:'type',q:'Crie uma tabela com uma linha de cabeçalho (2 th) e uma linha de dados (2 td)',start:'<table>\n  \n</table>',hint:'<tr><th>Dia</th><th>Horário</th></tr>\n<tr><td>Sábado</td><td>8h</td></tr>',check:d=>d.querySelectorAll('table tr th').length>=2&&d.querySelectorAll('table tr td').length>=2,w:'<table>\n  <tr><th>Dia</th><th>Horário</th></tr>\n  <tr><td>Sábado</td><td>8h</td></tr>\n</table>'}
 ]},
 {n:'Formulários',i:'✍️',obj:['Criar campos','Usar tipos de input','Ligar label e campo','Campos obrigatórios'],ex:[
  {t:'info',q:'Pegando informações',ana:'Um formulário é como uma ficha de cadastro de papel: tem os espaços pra preencher e, no fim, você entrega.',b:'• <code>&lt;form&gt;</code>: a ficha inteira\n• <code>&lt;input&gt;</code>: um espaço pra preencher (não tem fechamento!)\n• <code>&lt;button&gt;</code>: o botão de enviar\n\nO <code>placeholder</code> é o textinho cinza de exemplo, que some quando você digita.',code:'<form>\n  <input type="text" placeholder="Seu nome">\n  <button>Enviar</button>\n</form>',show:true},
  {t:'mc',q:'Qual tag cria um CAMPO pra digitar?',o:['<field>','<input>','<text>','<write>'],a:1,w:'input é o campo. Ele também não tem fechamento.'},
  {t:'info',q:'Tipos de campo',b:'O atributo <code>type</code> muda o campo, e no celular muda até o teclado:\n• <code>text</code>: texto comum\n• <code>email</code>: abre teclado com @\n• <code>tel</code>: abre teclado de números\n• <code>password</code>: esconde o que digita\n• <code>number</code>: só números\n\nPra textos longos, use <code>&lt;textarea&gt;&lt;/textarea&gt;</code> (essa fecha!).',code:'<input type="tel" placeholder="(49) 99999-0000">\n<textarea placeholder="Sua mensagem"></textarea>',show:true},
  {t:'info',q:'Label: o nome do campo',b:'O <code>&lt;label&gt;</code> é o nome que fica em cima do campo.\n\nPra ligar os dois, o <code>for</code> do label tem que ser IGUAL ao <code>id</code> do input. Assim, tocar no nome já coloca o cursor no campo.\n\nE com <code>required</code>, o campo vira obrigatório: o navegador não deixa enviar vazio.',code:'<label for="nome">Nome</label>\n<input id="nome" required>',show:true,erro:'Escrever for e id diferentes (for="nome" e id="Nome"). Aí a ligação não funciona.'},
  {t:'mc',q:'O que o atributo placeholder faz?',o:['Envia o formulário','Mostra um texto de exemplo no campo','Deixa o campo obrigatório','Esconde o campo'],a:1,w:'É a dica cinza que some quando você digita.'},
  {t:'mc',q:'Qual type abre o teclado de NÚMEROS de telefone no celular?',o:['text','tel','phone','number-phone'],a:1,w:'type="tel" abre o teclado numérico de telefone.'},
  {t:'fill',q:'Ligue o label ao campo:',code:'<label ___="email">E-mail</label>\n<input ___="email" type="email">',o:['for','id','name','href'],a:['for','id'],w:'O label usa for, o input usa id, e os dois valores são iguais.'},
  {t:'type',q:'Crie um formulário com label + input ligados (for e id), o input obrigatório, e um button',start:'<form>\n  \n</form>',hint:'<label for="nome">Nome</label>\n<input id="nome" required>\n<button>Enviar</button>',check:d=>{const l=d.querySelector('form label[for]');if(!l)return false;const i=d.getElementById(l.getAttribute('for'));return !!i&&i.tagName==='INPUT'&&i.required&&!!d.querySelector('form button')},w:'<form>\n  <label for="nome">Nome</label>\n  <input id="nome" required>\n  <button>Enviar</button>\n</form>'}
 ]},
 {n:'Revisão de HTML',i:'🏆',obj:['Revisar tudo que você aprendeu','Montar um mini site de clínica'],ex:[
  {t:'mc',q:'Qual tag NÃO tem fechamento?',o:['<p>','<img>','<h1>','<li>'],a:1,w:'img, br e input não fecham.'},
  {t:'mc',q:'Como quebrar a linha dentro de um parágrafo?',o:['Dando Enter no código','Com <br>','Com </br>','Com <p> dentro do <p>'],a:1,w:'<br>, sem fechamento. O Enter no código é ignorado.'},
  {t:'mc',q:'Link pro Instagram em nova aba:',o:['<a src="..." new>','<a href="..." target="_blank">','<link href="...">','<a href="..." open>'],a:1,w:'href + target="_blank".'},
  {t:'build',q:'Monte um item de lista em negrito:',o:['<li>','<strong>','Promoção','</strong>','</li>'],a:['<li>','<strong>','Promoção','</strong>','</li>'],w:'A última tag aberta é a primeira a fechar.'},
  {t:'mc',q:'Onde fica o título que aparece na aba?',o:['<h1> no body','<title> no head','<header>','<footer>'],a:1,w:'title, dentro do head.'},
  {t:'mc',q:'Qual é a diferença entre head e header?',o:['Nenhuma','head é invisível (bastidores), header é o topo visível','header é invisível','head é o rodapé'],a:1,w:'head = bastidores. header = topo da página, que aparece.'},
  {t:'type',q:'Desafio final! Mini site de clínica: um <header> com <h1>, um <p> com endereço em 2 linhas (<br>) e um link de WhatsApp',start:'',hint:'<header><h1>Clínica Sorriso</h1></header>\n<p>Rua A, 10<br>Centro</p>\n<a href="https://wa.me/5549999990000">WhatsApp</a>',check:d=>!!d.querySelector('header h1')&&!!d.querySelector('p br')&&!!d.querySelector('a[href*="wa.me"]'),w:'<header><h1>Clínica Sorriso</h1></header>\n<p>Rua A, 10<br>Centro</p>\n<a href="https://wa.me/5549999990000">WhatsApp</a>'}
 ]}
]},
{u:"Unidade 4",t:"HTML intermediário",l:[{n:"Vídeo, áudio e mapas",i:"🎬",obj:["Colocar vídeo e áudio na página","Incorporar um mapa ou vídeo do YouTube","Entender o iframe"],ex:[{t:"info",q:"Vídeo e áudio nativos",b:"O HTML toca vídeo e áudio sozinho, sem programa extra:\n• <code>&lt;video src=\"aula.mp4\" controls&gt;&lt;/video&gt;<\/code>\n• <code>&lt;audio src=\"musica.mp3\" controls&gt;&lt;/audio&gt;<\/code>\n\nO atributo <code>controls<\/code> mostra os botões de play, pausa e volume.",code:"<video src=\"trailer.mp4\" controls width=\"320\"><\/video>",tip:"Outros atributos úteis: muted (sem som), loop (repete) e autoplay (começa sozinho, só funciona com muted na maioria dos navegadores).",erro:"Esquecer o controls. O vídeo aparece, mas a pessoa não tem como dar play."},{t:"mc",q:"Qual atributo mostra os botões de play e pausa?",o:["play","controls","buttons","show"],a:1,w:"controls mostra a barra de controle."},{t:"info",q:"Iframe: uma janela pra outro site",ana:"Um iframe é como um porta-retrato que mostra outro site dentro do seu.",b:"O <code>&lt;iframe&gt;<\/code> mostra uma página de outro lugar dentro da sua. É assim que se coloca:\n• mapa do Google Maps\n• vídeo do YouTube\n\nO próprio Google Maps e o YouTube te dão o código pronto (em Compartilhar → Incorporar).",code:"<iframe src=\"https://www.youtube.com/embed/ID_DO_VIDEO\"\n  width=\"320\" height=\"180\" allowfullscreen><\/iframe>"},{t:"mc",q:"Pra colocar um mapa do Google no site, você usa:",o:["<map>","<iframe>","<img>","<a>"],a:1,w:"O Google Maps te dá um código de iframe pronto."},{t:"fill",q:"Complete o vídeo com controles:",code:"<video src=\"filme.mp4\" ___><\/video>",o:["controls","play","buttons","auto"],a:["controls"],w:"controls."},{t:"type",q:"Coloque um <video> com src=\"aula.mp4\" e o atributo controls",start:"",hint:"<video src=\"aula.mp4\" controls><\/video>",check:d=>{const v=d.querySelector('video');return !!v&&/aula\.mp4/.test(v.getAttribute('src')||'')&&v.hasAttribute('controls')},w:"<video src=\"aula.mp4\" controls><\/video>"}]},{n:"Meta tags e Google",i:"🔎",obj:["Entender o que o Google lê","Escrever title e description","Controlar a prévia no WhatsApp"],ex:[{t:"info",q:"O que aparece no Google",ana:"O title e a description são como a capa e a sinopse de um livro na vitrine: é o que faz a pessoa escolher o seu.",b:"No resultado do Google aparecem duas coisas que você controla no <code>&lt;head&gt;<\/code>:\n• <code>&lt;title&gt;<\/code>: o título azul\n• <code>&lt;meta name=\"description\"&gt;<\/code>: o textinho embaixo",code:"<head>\n  <title>Pizzaria Bella | Pizza no forno a lenha<\/title>\n  <meta name=\"description\" content=\"Pizzas artesanais no forno a lenha. Peça pelo WhatsApp.\">\n<\/head>",tip:"Bom title: até uns 60 caracteres, com o nome e o principal serviço. Boa description: até uns 155 caracteres, convidando pro clique."},{t:"mc",q:"Onde ficam as meta tags?",o:["No body","No head","No footer","Em qualquer lugar"],a:1,w:"Meta tags ficam no head: são informações sobre a página."},{t:"mc",q:"Qual title é melhor pro Google?",o:["Home","Página inicial","Pizzaria Bella | Pizza no forno a lenha","index.html"],a:2,w:"Diz o nome e o que o lugar faz."},{t:"info",q:"A prévia no WhatsApp",b:"Quando você manda um link no WhatsApp, aparece uma prévia com foto e título. Ela vem das tags <b>Open Graph<\/b>:",code:"<meta property=\"og:title\" content=\"Pizzaria Bella\">\n<meta property=\"og:description\" content=\"Pizza no forno a lenha\">\n<meta property=\"og:image\" content=\"https://site.com/capa.jpg\">",erro:"Usar um caminho relativo no og:image (img/capa.jpg). Ali precisa ser o endereço completo, com https://."},{t:"fill",q:"Complete a descrição:",code:"<meta name=\"___\" content=\"Os melhores bolos da cidade\">",o:["description","title","text","info"],a:["description"],w:"name=\"description\"."},{t:"mc",q:"De onde vem a imagem que aparece quando você manda o link no WhatsApp?",o:["Do favicon","Da meta og:image","Da primeira imagem do site, sempre","Do title"],a:1,w:"og:image define a imagem da prévia."}]},{n:"Semântica avançada",i:"🧠",obj:["Usar article, aside e figure","Marcar datas e citações","Deixar o HTML mais claro pro Google"],ex:[{t:"info",q:"Mais tags com significado",b:"Além de header, main e footer, existem:\n• <code>&lt;article&gt;<\/code>: um conteúdo que faz sentido sozinho (um post, uma notícia, um card de produto)\n• <code>&lt;aside&gt;<\/code>: algo ao lado, complementar (barra lateral, dica)\n• <code>&lt;figure&gt;<\/code> + <code>&lt;figcaption&gt;<\/code>: imagem com legenda",code:"<article>\n  <h2>Receita de bolo<\/h2>\n  <figure>\n    <img src=\"bolo.jpg\" alt=\"Bolo de chocolate\">\n    <figcaption>Bolo pronto em 40 minutos<\/figcaption>\n  <\/figure>\n<\/article>",tip:"Pergunte: \"se eu copiar só esse pedaço pra outro site, ele faz sentido sozinho?\". Se sim, é um article."},{t:"mc",q:"Um post de blog completo é melhor marcado como:",o:["<div>","<article>","<aside>","<span>"],a:1,w:"Faz sentido sozinho: article."},{t:"mc",q:"Qual tag dá legenda a uma imagem dentro de figure?",o:["<caption>","<figcaption>","<legend>","<label>"],a:1,w:"figcaption, dentro de figure."},{t:"info",q:"Datas e citações",b:"• <code>&lt;time datetime=\"2026-12-25\"&gt;25 de dezembro&lt;/time&gt;<\/code>: uma data que o computador entende\n• <code>&lt;blockquote&gt;<\/code>: uma citação longa\n• <code>&lt;q&gt;<\/code>: uma citação curta no meio do texto",code:"<blockquote>A simplicidade é o último grau de sofisticação.<\/blockquote>",show:true},{t:"fill",q:"Complete a figura com legenda:",code:"<figure>\n  <img src=\"praia.jpg\" alt=\"Praia\">\n  <___>Verão de 2026<\/figcaption>\n<\/figure>",o:["figcaption","caption","legend","p"],a:["figcaption"],w:"figcaption."},{t:"type",q:"Crie um <article> com um <h2> e uma <figure> com <img> e <figcaption>",start:"",hint:"<article>\n  <h2>Título<\/h2>\n  <figure>\n    <img src=\"foto.jpg\" alt=\"Foto\">\n    <figcaption>Legenda<\/figcaption>\n  <\/figure>\n<\/article>",check:d=>!!d.querySelector('article h2')&&!!d.querySelector('article figure img')&&!!d.querySelector('article figure figcaption'),w:"<article>\n  <h2>Título<\/h2>\n  <figure>\n    <img src=\"foto.jpg\" alt=\"Foto\">\n    <figcaption>Legenda<\/figcaption>\n  <\/figure>\n<\/article>"}]},{n:"Formulários avançados",i:"🗳️",obj:["Usar select, radio e checkbox","Agrupar campos","Usar o atributo name"],ex:[{t:"info",q:"Escolhas no formulário",b:"• <code>&lt;select&gt;<\/code> + <code>&lt;option&gt;<\/code>: lista suspensa (escolher 1 de muitos)\n• <code>type=\"radio\"<\/code>: escolher 1 entre poucas opções visíveis\n• <code>type=\"checkbox\"<\/code>: marcar várias opções",code:"<select>\n  <option>Pequena<\/option>\n  <option>Média<\/option>\n  <option>Grande<\/option>\n<\/select>\n<label><input type=\"checkbox\"> Borda recheada<\/label>",show:true},{t:"mc",q:"Pra escolher VÁRIOS adicionais numa pizza, use:",o:["radio","checkbox","select","text"],a:1,w:"checkbox permite marcar vários."},{t:"info",q:"O name faz os radios funcionarem juntos",b:"Radios com o MESMO <code>name<\/code> formam um grupo: marcar um desmarca o outro.\n\nO <code>name<\/code> também é o nome que vai junto quando o formulário é enviado.",code:"<label><input type=\"radio\" name=\"tamanho\"> Pequena<\/label>\n<label><input type=\"radio\" name=\"tamanho\"> Grande<\/label>",show:true,erro:"Dar um name diferente pra cada radio. Aí dá pra marcar todos ao mesmo tempo."},{t:"mc",q:"Por que dá pra marcar dois radios ao mesmo tempo?",o:["Faltou o controls","Eles estão com name diferente","Faltou o checkbox","É normal"],a:1,w:"Radios do mesmo grupo precisam do mesmo name."},{t:"info",q:"Agrupando com fieldset",b:"<code>&lt;fieldset&gt;<\/code> agrupa campos relacionados e <code>&lt;legend&gt;<\/code> dá um título ao grupo. Fica mais organizado e mais acessível.",code:"<fieldset>\n  <legend>Entrega<\/legend>\n  <label><input type=\"radio\" name=\"e\"> Retirar<\/label>\n  <label><input type=\"radio\" name=\"e\"> Entregar<\/label>\n<\/fieldset>",show:true},{t:"type",q:"Crie um <select> com 3 <option>",start:"<select>\n  \n<\/select>",hint:"<option>Um<\/option>\n<option>Dois<\/option>\n<option>Três<\/option>",check:d=>d.querySelectorAll('select option').length>=3,w:"<select>\n  <option>Um<\/option>\n  <option>Dois<\/option>\n  <option>Três<\/option>\n<\/select>"}]}]}]},

{id:'css',cat:'prog',nome:'CSS',icone:'🎨',cor:'#4da3ff',sub:'Cores, tamanhos e layout',nivel:'Iniciante → Intermediário',req:'html',meta:'Deixar qualquer página bonita e organizada: cores, fontes, espaçamentos, layout lado a lado e versão de celular.',units:[
{u:'Unidade 1',t:'Fundamentos do CSS',l:[
 {n:'O que é CSS',i:'🎨',obj:['Entender o papel do CSS','Ler e escrever uma regra','Saber onde colocar o CSS'],ex:[
  {t:'info',q:'HTML é a estrutura. CSS é a aparência.',ana:'Pense numa casa. O HTML são as paredes, portas e janelas. O CSS é a pintura, os móveis e a decoração. A casa existe sem decoração, mas ninguém quer morar nela assim.',b:'O <b>CSS</b> (Cascading Style Sheets) define como as coisas ficam: cor, tamanho, espaço, posição.\n\nVeja a mesma página sem CSS e com CSS: o conteúdo é igual, só muda a aparência.',code:'<h1>Clínica Sorriso</h1>\n<p>Agende sua avaliação.</p>',show:'<style>body{font-family:Arial;background:#f2f7ff;text-align:center}h1{color:#1F6FEB;font-size:28px}p{color:#555}</style><h1>Clínica Sorriso</h1><p>Agende sua avaliação.</p>'},
  {t:'info',q:'A anatomia de uma regra',b:'Toda regra de CSS tem 3 partes:\n• o <b>seletor</b>: QUEM vai mudar (<code>h1</code>)\n• a <b>propriedade</b>: O QUE vai mudar (<code>color</code>)\n• o <b>valor</b>: COMO vai ficar (<code>red</code>)\n\nPropriedade e valor ficam dentro das chaves <code>{ }</code>, separados por dois pontos, e terminam com ponto e vírgula.',code:'h1 {\n  color: red;\n  font-size: 40px;\n}',show:'<style>h1{color:red;font-size:40px}</style><h1>Título</h1>',tip:'Leia em voz alta: "todo h1: cor vermelha, tamanho 40". Ajuda muito no começo.',erro:'Esquecer o ponto e vírgula no fim da linha. Aí a linha de baixo para de funcionar e você não entende por quê.'},
  {t:'mc',q:'Na regra  p { color: blue; }  quem é o seletor?',o:['color','blue','p','{ }'],a:2,w:'O seletor vem antes das chaves: é quem vai receber o estilo.'},
  {t:'mc',q:'Na mesma regra, quem é o VALOR?',o:['p','color','blue',';'],a:2,w:'O valor vem depois dos dois pontos: blue.'},
  {t:'info',q:'Onde escrever o CSS',b:'Dois jeitos:\n• Dentro de <code>&lt;style&gt;</code>, no head do HTML (bom pra treinar e pra páginas pequenas)\n• Num arquivo separado, <code>estilo.css</code>, ligado com <code>&lt;link&gt;</code> no head (o jeito profissional)',code:'<head>\n  <link rel="stylesheet" href="estilo.css">\n</head>',tip:'Com arquivo separado, um mesmo CSS serve pra várias páginas. Muda num lugar, muda em todas.'},
  {t:'fill',q:'Deixe todos os parágrafos vermelhos:',code:'p {\n  ___: red;\n}',o:['color','text','font','paint'],a:['color'],w:'color muda a cor do texto.'},
  {t:'mc',q:'O que separa uma declaração da outra?',o:['Vírgula ,','Ponto e vírgula ;','Ponto .','Espaço'],a:1,w:'Cada propriedade: valor; termina com ponto e vírgula.'},
  {t:'type',live:1,q:'Deixe o título com cor vermelha (red)',start:'<style>\n  h1 {\n    \n  }\n</style>\n<h1>Meu site</h1>',hint:'Dentro das chaves: color: red;',check:(d,w)=>w.getComputedStyle(d.querySelector('h1')).color==='rgb(255, 0, 0)',w:'h1 {\n  color: red;\n}'}
 ]},
 {n:'Seletores',i:'🎯',obj:['Selecionar por tag, classe e id','Saber quando usar cada um','Usar mais de uma classe'],ex:[
  {t:'info',q:'Três jeitos de escolher',ana:'Pense numa escola. "Todos os alunos" é a tag. "A turma do 3º ano" é a classe. "O aluno de matrícula 123" é o id: só existe um.',b:'• <b>Tag</b>: <code>p</code> pega TODOS os parágrafos\n• <b>Classe</b>: <code>.destaque</code> pega quem tem <code>class="destaque"</code>\n• <b>Id</b>: <code>#topo</code> pega quem tem <code>id="topo"</code>',code:'<p>Normal</p>\n<p class="destaque">Em destaque</p>\n\n<style>\n  .destaque { color: green; font-weight: 700; }\n</style>',show:true,tip:'No dia a dia, use classes. Elas podem se repetir em vários elementos. O id deve ser único na página.'},
  {t:'mc',q:'Qual seletor pega class="botao"?',o:['#botao','.botao','botao','*botao'],a:1,w:'Classe usa ponto na frente.'},
  {t:'fill',q:'Selecione o id "topo":',code:'___topo {\n  background: black;\n}',o:['#','.','*','@'],a:['#'],w:'Id usa # na frente.'},
  {t:'info',q:'Um elemento, várias classes',b:'Um elemento pode ter mais de uma classe, separadas por espaço. Cada classe traz seus estilos.\n\nIsso permite montar estilos como peças de Lego: uma classe pro botão, outra pra cor.',code:'<button class="btn verde">Agendar</button>\n<button class="btn">Ver mais</button>\n\n<style>\n  .btn { padding: 10px 16px; border: 0; border-radius: 8px; }\n  .verde { background: #22c55e; color: white; }\n</style>',show:true,erro:'Colocar ponto dentro do HTML: class=".btn". No HTML é sem ponto. O ponto só existe no CSS.'},
  {t:'mc',q:'Qual pode aparecer em VÁRIOS elementos?',o:['id','class','os dois','nenhum'],a:1,w:'Classe se repete. Id é único.'},
  {t:'build',q:'Monte uma regra pra classe card:',o:['.card','{','color: blue;','}','#card'],a:['.card','{','color: blue;','}'],w:'.card { color: blue; }'},
  {t:'type',live:1,q:'Crie a regra .aviso com color: red (só o primeiro parágrafo deve ficar vermelho)',start:'<style>\n  \n</style>\n<p class="aviso">Atenção!</p>\n<p>Texto normal</p>',hint:'.aviso { color: red; }',check:(d,w)=>w.getComputedStyle(d.querySelector('.aviso')).color==='rgb(255, 0, 0)'&&w.getComputedStyle(d.querySelectorAll('p')[1]).color!=='rgb(255, 0, 0)',w:'.aviso { color: red; }'}
 ]},
 {n:'Cores e fundos',i:'🌈',obj:['Usar cores por nome, hex e rgb','Mudar o fundo','Escolher cores que combinam'],ex:[
  {t:'info',q:'Formatos de cor',b:'• Nome: <code>red</code>, <code>white</code>, <code>black</code> (poucas opções)\n• Hexadecimal: <code>#1F6FEB</code> (o mais usado: milhões de cores)\n• RGB: <code>rgb(31, 111, 235)</code> (quanto de vermelho, verde e azul)\n\n<code>color</code> muda o texto. <code>background</code> muda o fundo.',code:'<div class="faixa">Agende já</div>\n<style>\n  .faixa { background: #1F6FEB; color: white; padding: 14px; }\n</style>',show:true,tip:'Pra pegar a cor exata de um logo, use um conta-gotas (color picker) e copie o código hex.'},
  {t:'mc',q:'Qual é um código hex válido?',o:['#22e57a','22e57a#','hex(22e57a)','#22e57'],a:0,w:'# + 6 caracteres (0-9 e a-f).'},
  {t:'fill',q:'Deixe o fundo do botão verde:',code:'.botao {\n  ___: green;\n}',o:['background','color','border','fill'],a:['background'],w:'background muda o fundo. color muda o texto.'},
  {t:'info',q:'Contraste: dá pra ler?',b:'Uma cor bonita não adianta se ninguém consegue ler. Regra simples:\n• fundo escuro → texto claro\n• fundo claro → texto escuro\n\nCinza clarinho em fundo branco é o erro mais comum em sites de clínica.',code:'<p style="background:#fff;color:#ddd;padding:8px">Ruim: quase não dá pra ler</p>\n<p style="background:#fff;color:#222;padding:8px">Bom: fácil de ler</p>',show:true,erro:'Escolher a cor do texto só pela beleza. Teste no celular, no sol: se cansa a vista, está claro demais.'},
  {t:'mc',q:'Texto branco em fundo preto:',o:['color: black; background: white;','color: white; background: black;','text: white; fill: black;','font: white;'],a:1,w:'color = texto, background = fundo.'},
  {t:'type',live:1,q:'Mude o fundo da página (body) pra black',start:'<style>\n  body {\n    \n  }\n</style>\n<p style="color:white">Noite</p>',hint:'background: black;',check:(d,w)=>w.getComputedStyle(d.body).backgroundColor==='rgb(0, 0, 0)',w:'body {\n  background: black;\n}'}
 ]},
 {n:'Textos e fontes',i:'🔤',obj:['Mudar tamanho e peso','Alinhar textos','Trocar a fonte e o espaço entre linhas'],ex:[
  {t:'info',q:'Estilizando texto',b:'• <code>font-size</code>: tamanho (<code>18px</code>)\n• <code>font-weight</code>: peso (<code>400</code> normal, <code>700</code> negrito)\n• <code>text-align</code>: alinhamento (<code>left</code>, <code>center</code>, <code>right</code>)\n• <code>font-family</code>: a fonte\n• <code>line-height</code>: espaço entre as linhas',code:'<h1>Sorriso novo</h1>\n<p>Texto com linhas mais espaçadas fica muito mais fácil de ler no celular.</p>\n<style>\n  h1 { font-size: 30px; font-weight: 700; text-align: center; }\n  p { font-size: 17px; line-height: 1.6; }\n</style>',show:true,tip:'No celular, texto de leitura deve ter no mínimo 16px, com line-height entre 1.4 e 1.7.'},
  {t:'mc',q:'Como centralizar um texto?',o:['align: middle;','text-align: center;','center: true;','font-align: center;'],a:1,w:'text-align: center.'},
  {t:'fill',q:'Deixe o texto em negrito:',code:'p {\n  font-weight: ___;\n}',o:['700','big','bold-text','10px'],a:['700'],w:'700 (ou bold) é negrito.'},
  {t:'info',q:'A fonte certa',b:'<code>font-family</code> recebe uma lista: se a primeira fonte não existir no aparelho, ele tenta a próxima.\n\nTermine sempre com uma fonte genérica: <code>sans-serif</code> (sem "pezinho", moderna) ou <code>serif</code> (com "pezinho", clássica).',code:'body {\n  font-family: Montserrat, Arial, sans-serif;\n}',tip:'O Google Fonts tem centenas de fontes de graça. Montserrat, Inter e Poppins ficam ótimas em sites de clínica.'},
  {t:'mc',q:'O que "px" significa em 16px?',o:['Pixels','Porcentagem','Pontos extras','Peso'],a:0,w:'px = pixels, uma unidade de tamanho de tela.'},
  {t:'type',live:1,q:'Centralize o título e deixe ele com 32px',start:'<style>\n  h1 {\n    \n  }\n</style>\n<h1>Centro</h1>',hint:'text-align: center;\nfont-size: 32px;',check:(d,w)=>{const c=w.getComputedStyle(d.querySelector('h1'));return c.textAlign==='center'&&c.fontSize==='32px'},w:'h1 {\n  text-align: center;\n  font-size: 32px;\n}'}
 ]}
]},
{u:'Unidade 2',t:'Layout de verdade',l:[
 {n:'Box model',i:'📐',obj:['Entender content, padding, border e margin','Arredondar cantos','Fazer um cartão bonito'],ex:[
  {t:'info',q:'Todo elemento é uma caixa',ana:'Pense num quadro na parede: a foto é o conteúdo, o paspatur branco em volta é o padding, a moldura é a border, e o espaço até o próximo quadro é a margin.',b:'De dentro pra fora:\n• <b>content</b>: o conteúdo\n• <b>padding</b>: espaço INTERNO (o paspatur)\n• <b>border</b>: a borda (a moldura)\n• <b>margin</b>: espaço EXTERNO (afasta dos vizinhos)',code:'<div class="card">Limpeza dental</div>\n<div class="card">Clareamento</div>\n<style>\n  .card {\n    padding: 20px;\n    border: 2px solid #ccc;\n    margin: 12px 0;\n    border-radius: 12px;\n  }\n</style>',show:true,tip:'Coloque *{box-sizing:border-box} no início do CSS. Assim o padding não aumenta o tamanho da caixa.'},
  {t:'mc',q:'Qual é o espaço INTERNO da caixa?',o:['margin','padding','border','gap'],a:1,w:'padding = recheio interno.'},
  {t:'mc',q:'Pra afastar um card do outro, você usa:',o:['padding','margin','color','font-size'],a:1,w:'margin = espaço por fora.'},
  {t:'info',q:'Atalhos de 4 lados',b:'padding e margin aceitam até 4 valores, no sentido do relógio a partir de cima:\n• <code>padding: 20px;</code> → todos os lados\n• <code>padding: 10px 20px;</code> → cima/baixo 10, lados 20\n• <code>padding: 10px 20px 30px 40px;</code> → cima, direita, baixo, esquerda',erro:'Achar que padding: 10px 20px é esquerda e direita. O primeiro valor é SEMPRE cima/baixo.'},
  {t:'fill',q:'Faça uma borda de 2px sólida preta:',code:'border: 2px ___ black;',o:['solid','line','full','thick'],a:['solid'],w:'Estilos de borda: solid, dashed, dotted.'},
  {t:'mc',q:'padding: 8px 24px; dá:',o:['8 em cima e embaixo, 24 nos lados','8 nos lados, 24 em cima e embaixo','8 em tudo','24 em tudo'],a:0,w:'Primeiro valor: cima/baixo. Segundo: lados.'},
  {t:'type',live:1,q:'Dê padding de 20px e cantos arredondados na .caixa',start:'<style>\n  .caixa {\n    background: #eee;\n    \n  }\n</style>\n<div class="caixa">Conteúdo</div>',hint:'padding: 20px;\nborder-radius: 12px;',check:(d,w)=>{const c=w.getComputedStyle(d.querySelector('.caixa'));return parseFloat(c.paddingTop)>=20&&parseFloat(c.borderTopLeftRadius)>0},w:'padding: 20px;\nborder-radius: 12px;'}
 ]},
 {n:'Flexbox',i:'↔️',obj:['Colocar itens lado a lado','Alinhar e espaçar com flex','Quebrar linha quando não cabe'],ex:[
  {t:'info',q:'Lado a lado com display: flex',ana:'Pense numa prateleira. Normalmente cada caixa fica numa linha, uma embaixo da outra. Com flex, você coloca todas lado a lado na mesma prateleira.',b:'Colocando <code>display: flex</code> no elemento PAI, os filhos ficam lado a lado.\n• <code>gap</code>: espaço entre eles\n• <code>justify-content</code>: alinhamento na horizontal\n• <code>align-items</code>: alinhamento na vertical',code:'<div class="menu">\n  <a>Início</a><a>Tratamentos</a><a>Contato</a>\n</div>\n<style>\n  .menu { display: flex; gap: 16px; justify-content: center; }\n</style>',show:true,tip:'Flexbox resolve a maioria dos layouts: menus, cards em linha, botões lado a lado.'},
  {t:'mc',q:'Onde você coloca display: flex?',o:['Em cada filho','No elemento pai','No body sempre','No HTML'],a:1,w:'No pai. Ele organiza os filhos.'},
  {t:'fill',q:'Coloque os itens lado a lado:',code:'.lista {\n  display: ___;\n}',o:['flex','block','none','side'],a:['flex'],w:'display: flex.'},
  {t:'info',q:'Os valores de justify-content',b:'• <code>flex-start</code>: tudo no começo\n• <code>center</code>: tudo no meio\n• <code>space-between</code>: o primeiro na ponta esquerda, o último na direita (perfeito pra logo + menu)\n\nE <code>flex-wrap: wrap</code> deixa os itens pularem pra linha de baixo quando não cabem.',code:'<div class="topo"><b>Logo</b><span>Menu</span></div>\n<style>\n  .topo { display: flex; justify-content: space-between; padding: 10px; background: #eef3ff; }\n</style>',show:true,erro:'Colocar display: flex no filho em vez do pai. Nada muda e parece que o flex não funciona.'},
  {t:'mc',q:'Logo na esquerda e menu na direita. Qual usar?',o:['justify-content: center','justify-content: space-between','text-align: right','align-items: end'],a:1,w:'space-between empurra um pra cada ponta.'},
