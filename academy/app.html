 {q:'Crie <code>produtos<\/code>: um array com 3 objetos ou mais, cada um com <code>nome<\/code> e <code>preco<\/code>',dica:'Cada objeto fica entre chaves, e os objetos são separados por vírgula dentro dos colchetes.',cod:'const produtos = [\n  { nome: "Arroz", preco: 22 },\n  { nome: "Feijão", preco: 9 },\n  { nome: "Café", preco: 18 }\n];',check:(d,w)=>{try{const p=w.eval('produtos');return Array.isArray(p)&&p.length>=3&&p.every(x=>typeof x.nome==='string'&&typeof x.preco==='number')}catch(e){return false}}},
 {q:'Crie <code>caros<\/code> com <code>filter<\/code>: só os produtos com preço acima de 10',dica:'filter fica com os itens em que a condição dá true.',cod:'const caros = produtos.filter(p => p.preco > 10);',check:(d,w)=>{try{const p=w.eval('produtos'),c=w.eval('caros');return Array.isArray(c)&&c.length===p.filter(x=>x.preco>10).length&&c.every(x=>x.preco>10)}catch(e){return false}}},
 {q:'Crie <code>nomes<\/code> com <code>map<\/code>: só os nomes dos produtos',dica:'map transforma cada objeto em outra coisa: aqui, só o nome.',cod:'const nomes = produtos.map(p => p.nome);',check:(d,w)=>{try{return JSON.stringify(w.eval('nomes'))===JSON.stringify(w.eval('produtos').map(x=>x.nome))}catch(e){return false}}},
 {q:'Ao clicar em <code>#add<\/code>, adicione um <code>&lt;li&gt;<\/code> com o texto do campo <code>#item<\/code> na <code>#lista<\/code>',dica:'Pegue o value do campo, crie o li, coloque o texto e use appendChild.',cod:'document.querySelector("#add").addEventListener("click", () => {\n  const li = document.createElement("li");\n  li.textContent = document.querySelector("#item").value;\n  document.querySelector("#lista").appendChild(li);\n});',check:d=>{d.querySelector('#item').value='Leite teste';d.querySelector('#add').click();return [...d.querySelectorAll('#lista li')].some(l=>/leite teste/i.test(l.textContent))}}
],sol:'<script>\n  const produtos = [\n    { nome: "Arroz", preco: 22 },\n    { nome: "Feijão", preco: 9 },\n    { nome: "Café", preco: 18 }\n  ];\n  const caros = produtos.filter(p => p.preco > 10);\n  const nomes = produtos.map(p => p.nome);\n\n  document.querySelector("#add").addEventListener("click", () => {\n    const li = document.createElement("li");\n    li.textContent = document.querySelector("#item").value;\n    document.querySelector("#lista").appendChild(li);\n  });\n<\/script>'},

/* ================= estado ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dstr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const hoje=()=>dstr(new Date());
const ontem=()=>{const d=new Date();d.setDate(d.getDate()-1);return dstr(d)};
let S={done:{},xp:0,streak:0,last:'',dayXp:0,day:'',som:true,ultimo:''};
try{const v=JSON.parse(localStorage.getItem('criate-academy')||'null');if(v){S={...S,...v};
  /* migra progresso antigo (só HTML) */
  for(const k of Object.keys(S.done))if(/^\d+$/.test(k)){S.done['html:'+k]=true;delete S.done[k]}}}catch(e){}
const salvar=()=>{try{localStorage.setItem('criate-academy',JSON.stringify(S))}catch(e){}};
if(S.day!==hoje()){S.day=hoje();S.dayXp=0}
if(S.last&&S.last!==hoje()&&S.last!==ontem())S.streak=0;
const META=50;
const FL={};CURSOS.forEach(c=>{FL[c.id]=[];c.units.forEach((u,ui)=>u.l.forEach(l=>FL[c.id].push({ui,l})))});
const feitas=c=>FL[c.id].filter((x,k)=>S.done[c.id+':'+k]).length;
const pct=c=>feitas(c)/FL[c.id].length;
const curso=id=>CURSOS.find(c=>c.id===id);
let VIEW={tela:'home',curso:null};

/* ================= som ================= */
let AC=null;
function tom(seq,tipo='sine',vol=.18){if(!S.som)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t0=AC.currentTime;seq.forEach(([f,ini,dur])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=tipo;o.frequency.setValueAtTime(f,t0+ini);g.gain.setValueAtTime(0,t0+ini);g.gain.linearRampToValueAtTime(vol,t0+ini+.015);g.gain.exponentialRampToValueAtTime(.001,t0+ini+dur);o.connect(g);g.connect(AC.destination);o.start(t0+ini);o.stop(t0+ini+dur+.02)})}catch(e){}}
const sOk=()=>tom([[784,0,.12],[1175,.09,.22]],'sine',.2);
const sBad=()=>tom([[220,0,.16],[165,.12,.26]],'triangle',.22);
const sTap=()=>tom([[1400,0,.04]],'sine',.06);
const sFim=()=>tom([[523,0,.15],[659,.12,.15],[784,.24,.15],[1047,.36,.4]],'sine',.2);

/* ================= telas ================= */
function topo(){$('sXp').textContent=S.xp;$('sStreak').textContent=S.streak;$('som').textContent=S.som?'🔊':'🔇'}
function metaHtml(){return `<div class="goal"><div class="row"><span>🎯 Meta de hoje</span><span style="color:var(--xp)">${Math.min(S.dayXp,META)}/${META} XP</span></div><div class="bar"><i style="width:${Math.min(S.dayXp/META,1)*100}%"></i></div></div>`}
const BASE={html:11,css:8,js:9};
const unidadeFeita=(cid,ui)=>FL[cid].every((x,k)=>x.ui!==ui||S.done[cid+':'+k]);
function liberado(c){if(!c.req)return true;const r=curso(c.req),n=BASE[r.id]||FL[r.id].length;for(let k=0;k<n;k++)if(!S.done[r.id+':'+k])return false;return true}
function render(){topo();VIEW.tela==='home'?renderHome():renderCurso()}
function renderHome(){
  const h=new Date().getHours(),oi=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';
  let cat0='prog';try{cat0=localStorage.getItem('ca-cat')||'prog'}catch(x){}
  let u=curso(S.ultimo);if(!u||(u.cat||'prog')!==cat0)u=CURSOS.find(c=>(c.cat||'prog')===cat0)||CURSOS[0];
  const prox=FL[u.id].findIndex((x,k)=>!S.done[u.id+':'+k]);
  let nm='';try{nm=(localStorage.getItem('ca-nome')||'').trim()}catch(x){}nm=nm?nm[0].toUpperCase()+nm.slice(1):'';
  let cat='prog';try{cat=localStorage.getItem('ca-cat')||'prog'}catch(x){}
  const CATS=[['prog','💻','Programação','Criar sites e sistemas'],['neg','💼','Negócios','Vender e negociar melhor']];
  let html=`<div class="home"><h1>${oi}${nm?', '+esc(nm):''}! 👋</h1><p class="sub">Escolha uma área e faça uma lição por vez. Constância vale mais que pressa.</p>${metaHtml()}`;
  if(prox>=0)html+=`<button class="cont" data-cur="${u.id}" data-go="${prox}"><span class="ic">${FL[u.id][prox].l.i}</span><span><small>CONTINUAR · ${esc(u.nome)}</small><b>${esc(FL[u.id][prox].l.n)}</b></span></button>`;
  html+=`<div class="cats">${CATS.map(([k,ic,t,sub])=>`<button class="catb ${cat===k?'on':''}" data-cat="${k}"><span>${ic}</span><b>${t}</b><small>${sub}</small></button>`).join('')}</div>`;
  html+=`<div class="cgrid">${CURSOS.filter(c=>(c.cat||'prog')===cat).map(c=>{const lib=liberado(c),p=pct(c);return `<button class="ccard ${lib?'':'lock'}" data-cur="${c.id}"><span class="ic" style="background:${c.cor}22;border:2px solid ${c.cor}66">${lib?c.icone:'🔒'}</span><span style="flex:1;min-width:0"><h3>${esc(c.nome)}</h3><p>${esc(c.sub)}</p><div class="bar"><i style="width:${p*100}%;background:${c.cor};box-shadow:0 0 10px ${c.cor}88"></i></div><div class="meta">${lib?`${feitas(c)} de ${FL[c.id].length} lições · ${esc(c.nivel)}`:`Libera ao terminar o básico de ${esc(curso(c.req).nome)}`}</div></span></button>`}).join('')}</div>
  ${cat==='prog'?'<div class="cinfo" style="margin-top:18px"><b>🗺️ Ordem recomendada:</b> HTML → CSS → JavaScript. O curso <b>Editando sites</b> libera depois do HTML e já serve direto pro seu trabalho com os sites dos clientes.</div>':'<div class="cinfo" style="margin-top:18px"><b>💼 Como usar:</b> faça uma lição antes de prospectar. As atividades de escrever são treino de verdade: escreva como se fosse mandar pro cliente.</div>'}</div>`;
  $('mapa').innerHTML=html;
}
function renderCurso(){
  const c=curso(VIEW.curso);let k=0;
  let html=`<button class="voltar" data-home="1">← Cursos</button><div style="display:flex;gap:14px;align-items:center;margin-top:10px"><span style="font-size:44px">${c.icone}</span><div><h1 style="margin:0;font-size:26px;font-weight:900">${esc(c.nome)}</h1><div style="color:var(--mut);font-weight:800">${feitas(c)} de ${FL[c.id].length} lições</div></div></div>
  <div class="cinfo"><b>Ao final você vai conseguir:</b> ${esc(c.meta)}</div>`;
  if(pct(c)>=1)html+=`<div class="cert">🎓 Curso concluído!<b>${esc(c.nome)}</b><span style="font-size:14px;color:var(--mut)">Pode refazer qualquer lição pra revisar.</span></div>`;
  c.units.forEach((u,ui)=>{
    const prim=k;
    html+=`<div class="unit ${S.done[c.id+':'+prim]||prim===0||S.done[c.id+':'+(prim-1)]?'':'lock'}" style="${S.done[c.id+':'+prim]||prim===0||S.done[c.id+':'+(prim-1)]?`background:${c.cor};box-shadow:0 5px 0 #0006`:''}"><small>${esc(u.u)}</small><h2>${esc(u.t)}</h2></div><div class="path">`;
    u.l.forEach(l=>{const kk=k++,id=c.id+':'+kk,done=S.done[id],open=!done&&(kk===0||S.done[c.id+':'+(kk-1)]);
      html+=`<button class="node n${kk%8} ${done?'done':open?'open':''}" data-k="${kk}" aria-label="${esc(l.n)}">${done?'⭐':open?l.i:'🔒'}${done?'<span class="redo" aria-hidden="true">↺</span>':''}<span class="lbl">${esc(l.n)}${done?' <i>· refazer</i>':''}</span></button><div class="spacer"></div>`});
    html+='</div>';
    const pk=c.id+':'+ui,P=PROJ[pk];
    if(P){const ab=unidadeFeita(c.id,ui),ft=(S.proj||{})[pk];

  salvar();const P=PROJ[L.proj];$('lbar').style.width='100%';$('hearts').textContent='🏁';
  $('ex').innerHTML=`<div class="end"><div class="trofeu">🏆</div><h2>Teste prático concluído!</h2><div class="txt">${esc(P.t)}${P.conv?' · Compare sempre suas respostas com as do professor: é assim que se pega o jeito.':' · Você construiu algo de verdade sozinho. Tente fazer o mesmo no VS Code!'}</div>
  <div class="res"><div><b style="color:var(--xp)">+${ganho}</b><small>XP${prim?'':' (refeito)'}</small></div><div><b>🔥${S.streak}</b><small>${S.streak===1?'dia':'dias'} seguidos</small></div></div></div>`;
  $('foot').className='lfoot';$('footIn').innerHTML='<button class="big" id="voltar">CONTINUAR</button>';$('voltar').onclick=fecharLicao;
}
function confete(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const b=document.createElement('div');b.className='confete';const cs=['#22e57a','#ffc83d','#ff5a5a','#7ee2ff','#fff'];b.innerHTML=Array.from({length:70},(_,i)=>`<i style="left:${Math.random()*100}%;background:${cs[i%5]};animation-delay:${Math.random()*.4}s;animation-duration:${1.6+Math.random()*1.4}s"></i>`).join('');document.body.appendChild(b);setTimeout(()=>b.remove(),3600)}
render();
}
