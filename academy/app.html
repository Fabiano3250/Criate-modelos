  {t:'info',q:'Os 4 sinais de golpe',b:'Desconfie quando a mensagem tem:\n• <b>Pressa</b>: "sua conta será bloqueada em 1 hora"\n• <b>Medo ou prêmio</b>: "você tem uma dívida" ou "você ganhou"\n• <b>Pedido incomum</b>: senha, código, Pix, dados do cartão\n• <b>Link ou remetente estranho</b>: <code>bradesco-seguro-atualiza.com</code> em vez do site oficial',tip:'A pressa é a arma principal do golpista. Quando sentir que precisa agir AGORA, pare e respire. Golpe odeia calma.'},
  {t:'mc',q:'Chega um SMS: "Seu CPF será bloqueado hoje. Regularize em: receita-cpf-regulariza.net". Qual é o sinal mais forte de golpe?',o:['É SMS','Pressa + link com endereço estranho','Fala em CPF','Chegou de manhã'],a:1,w:'Ameaça com prazo curto e um endereço que não é o oficial (gov.br). Golpe clássico.'},
  {t:'info',q:'O golpe do "novo número"',b:'Um dos golpes mais comuns no Brasil:\n\n1. Alguém manda mensagem com a foto de um parente: "Oi, troquei de número, salva esse"\n2. Logo depois: "Preciso pagar uma conta urgente, me faz um Pix que te devolvo amanhã?"\n\n<b>Como se proteger:</b> ligue pro número antigo da pessoa, ou faça uma pergunta que só ela saberia responder.',erro:'Confiar porque a foto é do parente. Qualquer um copia uma foto do Instagram em 2 segundos.'},
  {t:'mc',q:'Sua "prima" manda mensagem de um número novo pedindo um Pix urgente. O que você faz primeiro?',o:['Faz o Pix, é família','Liga pro número antigo dela pra confirmar','Pede o CPF dela','Manda o Pix pela metade'],a:1,w:'Confirme por outro caminho, que você já sabia antes. Se for ela mesmo, não custa nada esperar 1 minuto.'},
  {t:'info',q:'Olhe o endereço antes de clicar',b:'O que vale é o <b>domínio</b>: o nome que vem logo antes do <code>.com</code>, <code>.com.br</code> ou <code>.gov.br</code>.\n\n• <code>https://www.<b>nubank.com.br</b>/app</code>: oficial\n• <code>https://nubank.com.br.<b>seguro-login.top</b></code>: falso! O domínio real é seguro-login.top\n\nNo celular, segure o dedo no link (sem soltar) pra ver o endereço completo antes de abrir.'},
  {t:'mc',q:'Qual destes links é o verdadeiro do Instagram?',o:['instagram.com.verificar-conta.co','https://www.instagram.com/accounts','instagram-suporte.net','instagran.com'],a:1,w:'O domínio é instagram.com. Os outros só usam o nome pra enganar, ou trocam uma letra (instagran).'},
  {t:'build',q:'Coloque na ordem o que fazer ao receber uma mensagem suspeita:',o:['Não clicar no link','Confirmar por um canal oficial','Bloquear e denunciar'],a:['Não clicar no link','Confirmar por um canal oficial','Bloquear e denunciar'],w:'Primeiro não clica, depois confirma pelo app ou telefone oficial, e por fim bloqueia e denuncia.'}
 ]}
]},
{u:'Unidade 2',t:'Celular, computador e internet',l:[
 {n:'Atualizações e vírus',i:'🔄',obj:['Entender por que atualizar é proteção','Saber o que é malware','Instalar apps com segurança'],ex:[
  {t:'info',q:'Atualizar é tapar buracos',ana:'Pense num muro com uma rachadura que todo ladrão do bairro já conhece. A atualização é o pedreiro tapando a rachadura.',b:'Quando uma falha de segurança é descoberta num app ou sistema, a empresa corrige e manda uma <b>atualização</b>.\n\nO problema: depois que a correção sai, a falha fica famosa. Quem não atualiza fica com o "buraco" aberto que todo golpista já sabe usar.',tip:'Deixe as atualizações automáticas ligadas no celular, no computador e no navegador. É o cuidado que dá menos trabalho e mais protege.'},
  {t:'mc',q:'Por que é perigoso adiar as atualizações por meses?',o:['O celular fica mais lento','As falhas corrigidas ficam conhecidas e continuam abertas no seu aparelho','As atualizações vencem','Não é perigoso'],a:1,w:'Depois que a correção sai, os golpistas sabem exatamente qual falha atacar em quem não atualizou.'},
  {t:'info',q:'Malware: programa do mal',b:'<b>Malware</b> é qualquer programa feito pra prejudicar. Alguns tipos:\n• <b>Vírus e trojans</b>: se escondem em arquivos e apps que parecem normais\n• <b>Ransomware</b>: tranca seus arquivos e pede resgate pra devolver\n• <b>Spyware</b>: espiona o que você digita e vê\n\nA maioria entra porque <b>a própria pessoa instala</b>, achando que é outra coisa.',erro:'Baixar app "pirata", "versão premium grátis" ou APK de site desconhecido. É o jeito número 1 de colocar malware no celular.'},
  {t:'mc',q:'Qual destas é a forma mais segura de instalar um app no celular?',o:['Baixar o APK que um amigo mandou no WhatsApp','Pela loja oficial (Play Store ou App Store)','Por um site que oferece a versão premium grátis','Por um link que chegou por SMS'],a:1,w:'As lojas oficiais verificam os apps. Fora delas, o risco de malware é muito maior.'},
  {t:'info',q:'Cuidado com as permissões',b:'Ao instalar um app, ele pede permissões: câmera, contatos, localização, SMS...\n\nPergunte sempre: <b>faz sentido?</b>\n• Um app de lanterna pedindo seus contatos e SMS: não faz sentido, desconfie\n• Um app de mapa pedindo localização: faz sentido\n\nVocê pode revisar e tirar permissões em Configurações → Apps.'},
  {t:'mc',q:'Um app de calculadora pede acesso aos seus SMS. O que isso indica?',o:['Normal, toda calculadora precisa','Pedido suspeito: ele não precisa disso pra funcionar','Que ele é premium','Que o celular está atualizado'],a:1,w:'Acesso a SMS permite ler códigos de verificação. Uma calculadora não precisa disso.'}
 ]},
 {n:'Wi-Fi público e o cadeado',i:'📶',obj:['Saber os riscos do Wi-Fi público','Entender o que o cadeado (HTTPS) garante','Saber o que o cadeado NÃO garante'],ex:[
  {t:'info',q:'O cadeado do navegador',ana:'É como mandar uma carta num envelope lacrado em vez de um cartão-postal. No postal, o carteiro lê tudo. No envelope lacrado, só quem recebe abre.',b:'Quando o endereço começa com <code>https://</code> e aparece o cadeado, a conexão entre você e o site é <b>criptografada</b>: quem estiver no meio do caminho (no Wi-Fi, por exemplo) não consegue ler o que você envia.\n\nO <b>s</b> do https vem de "secure", seguro.'},
  {t:'info',q:'O cadeado NÃO quer dizer que o site é confiável',b:'Esse é o ponto mais importante:\n\nO cadeado garante que a conversa com o site é <b>privada</b>. Ele <b>não</b> garante que o site é <b>honesto</b>.\n\nSites de golpe também têm cadeado, porque o certificado é grátis. Um site falso do banco pode ter cadeado e mesmo assim roubar sua senha.',erro:'Pensar "tem cadeado, então é seguro". O cadeado protege o caminho, não diz quem está do outro lado. Sempre confira o domínio.'},
  {t:'mc',q:'O que o cadeado (https) garante?',o:['Que o site é da empresa oficial','Que a conexão é criptografada e ninguém no caminho lê seus dados','Que o site não tem vírus','Que o site é do governo'],a:1,w:'Ele protege o caminho. Quem é o dono do site você confere pelo domínio.'},
  {t:'info',q:'Wi-Fi público: aeroporto, café, rodoviária',b:'Em redes abertas, qualquer pessoa pode estar conectada junto com você, e existem até redes falsas com nomes como "Wifi_Gratis_Shopping".\n\nCuidados:\n• Prefira o <b>4G/5G</b> do seu celular pra entrar no banco ou digitar senhas\n• Confira o nome certo da rede com o estabelecimento\n• Desligue a conexão automática em redes abertas',tip:'Se precisar muito usar um Wi-Fi público, só acesse sites com https e evite o banco. Fica pro 4G.'},
  {t:'mc',q:'Você está no aeroporto e precisa fazer um Pix. Qual é a opção mais segura?',o:['Usar o Wi-Fi grátis do aeroporto','Usar os dados móveis (4G/5G) do seu celular','Usar a rede "Aeroporto_Free_VIP"','Pedir o celular de alguém emprestado'],a:1,w:'Os dados móveis não são compartilhados com estranhos. É bem mais seguro que uma rede aberta.'},
  {t:'mc',q:'Um site de golpe pode ter o cadeado?',o:['Não, nunca','Sim, o cadeado não prova que o site é honesto','Só se for do exterior','Só no computador'],a:1,w:'Qualquer site consegue um certificado grátis. Por isso o domínio importa mais que o cadeado.'}
 ]},
 {n:'Backup: a cópia que salva',i:'💾',obj:['Entender o que é backup','Aplicar a regra 3-2-1','Saber o que fazer backup no seu trabalho'],ex:[
  {t:'info',q:'Backup é a cópia de segurança',ana:'É como ter a chave reserva da casa guardada com alguém de confiança. Se perder a sua, você não fica na rua.',b:'<b>Backup</b> é uma cópia dos seus arquivos guardada em outro lugar.\n\nCelular roubado, computador queimado, ransomware, arquivo apagado sem querer: com backup, você perde <b>uma tarde</b>. Sem backup, você perde <b>tudo</b>.'},
  {t:'info',q:'A regra 3-2-1',b:'A regra que os profissionais usam:\n• <b>3</b> cópias dos arquivos importantes\n• em <b>2</b> lugares diferentes (ex.: computador e HD externo)\n• e <b>1</b> fora de casa (ex.: na nuvem, como Google Drive ou GitHub)\n\nAssim, nem um incêndio, nem um roubo, nem um vírus acabam com tudo de uma vez.',tip:'O código dos sites dos seus clientes no GitHub já conta como uma cópia fora de casa. Mantenha sempre atualizado.'},
  {t:'mc',q:'Na regra 3-2-1, o que significa o "1"?',o:['1 senha forte','1 cópia fora de casa, como na nuvem','1 computador só','Fazer backup 1 vez por ano'],a:1,w:'Uma cópia longe do lugar original protege contra roubo, incêndio e problemas no local.'},
  {t:'mc',q:'Um ransomware trancou todos os arquivos do seu computador. O que te salva sem pagar o resgate?',o:['Desligar o Wi-Fi','Um backup feito antes, guardado em outro lugar','Trocar a senha do e-mail','Formatar e torcer'],a:1,w:'Com um backup separado, você apaga tudo, restaura a cópia e segue a vida sem pagar nada.'},
  {t:'info',q:'Backup que não foi testado é só esperança',b:'De tempos em tempos, tente <b>restaurar</b> um arquivo do backup pra ver se funciona mesmo.\n\nMuita gente descobre que o backup estava desligado ou vazio justamente no dia em que precisa.',erro:'Guardar o backup no mesmo HD do computador. Se o HD queimar, vai original e cópia juntos.'},
  {t:'mc',q:'Qual destes NÃO é um bom backup?',o:['Cópia no Google Drive','Cópia num HD externo','Uma pasta "backup" dentro do mesmo computador','Código salvo no GitHub'],a:2,w:'Se o computador quebrar ou for infectado, a pasta de backup vai junto com ele.'}
 ]},
 {n:'Engenharia social e privacidade',i:'🕵️',obj:['Entender o que é engenharia social','Saber o que não expor nas redes','Conhecer o básico da LGPD'],ex:[
  {t:'info',q:'Hackear pessoas em vez de máquinas',ana:'Em vez de arrombar a porta, o ladrão se veste de entregador e pede pra você abrir. Você mesmo abre.',b:'<b>Engenharia social</b> é enganar pessoas pra que elas entreguem informações ou acessos por vontade própria.\n\nO golpista usa:\n• <b>confiança</b>: "sou do suporte", "sou seu gerente"\n• <b>ajuda</b>: "só preciso que você confirme um dado"\n• <b>autoridade</b>: "aqui é da polícia, do banco, da Receita"\n\nNa maioria dos ataques, a parte mais fácil de invadir é a pessoa, não o sistema.'},
  {t:'mc',q:'Alguém liga se dizendo "do suporte do VitrineAI" e pede sua senha pra "corrigir um erro". Isso é:',o:['Atendimento normal','Engenharia social','Uma atualização','Verificação em duas etapas'],a:1,w:'Suporte de verdade nunca precisa da sua senha. Ele está usando autoridade e ajuda pra te enganar.'},
  {t:'info',q:'O que você posta vira munição',b:'Golpistas montam o golpe com o que você mostra:\n• nome do pet, da mãe, data de nascimento: viram resposta de "pergunta secreta" e palpite de senha\n• foto do cartão, boleto, documento ou passagem: têm dados pra fraude\n• "viajando 15 dias!": avisa que a casa está vazia\n\nAntes de postar, pergunte: <b>um golpista poderia usar isso?</b>'},
  {t:'mc',q:'Qual destes posts é o mais arriscado?',o:['Foto do pôr do sol','Foto do cartão de crédito novo com o número aparecendo','Foto do almoço','Foto do treino'],a:1,w:'Número do cartão aparecendo é convite pra fraude. Nunca poste documentos, cartões ou boletos.'},
  {t:'info',q:'LGPD: a lei dos dados pessoais',b:'A <b>LGPD</b> (Lei Geral de Proteção de Dados) é a lei brasileira que diz como empresas podem usar dados pessoais: nome, telefone, CPF, endereço...\n\nNo seu trabalho isso importa porque:\n• o formulário de agendamento de um site <b>coleta dados</b> de pacientes\n• a clínica precisa avisar pra que usa esses dados (a página de <b>política de privacidade</b>)\n• você só deve pedir os dados que realmente precisa',tip:'No formulário de um site, peça só o essencial: nome e WhatsApp. Quanto menos dado você guarda, menos dado pode vazar.'},
  {t:'mc',q:'Num formulário de agendamento de clínica, o que é mais adequado pedir?',o:['Nome, WhatsApp, CPF, RG, renda e endereço completo','Só o necessário: nome e WhatsApp','A senha do e-mail do paciente','Nada, nem o nome'],a:1,w:'Pedir só o essencial respeita a LGPD e diminui o estrago se algo vazar.'}
 ]}
]},
{u:'Unidade 3',t:'Sites seguros pros seus clientes',l:[
 {n:'HTTPS e domínio do cliente',i:'🔒',obj:['Garantir HTTPS nos sites que você entrega','Entender quem deve ser dono do domínio','Proteger as contas de hospedagem'],ex:[
  {t:'info',q:'Todo site entregue precisa de HTTPS',b:'Hoje o HTTPS não é luxo, é o mínimo:\n• o Chrome mostra <b>"Não seguro"</b> em sites sem ele, e o paciente desiste\n• o Google coloca sites sem HTTPS mais pra baixo na busca\n• formulários sem HTTPS mandam os dados "em cartão-postal"\n\nBoa notícia: o <b>Vercel</b> e quase toda hospedagem moderna já colocam HTTPS sozinhos e de graça.',tip:'Depois de ligar o domínio do cliente no Vercel, abra o site e confira se o endereço começa com https:// e se tem o cadeado.'},
  {t:'mc',q:'Um site de clínica sem HTTPS. O que o paciente vê no Chrome?',o:['Nada de diferente','Um aviso de "Não seguro" perto do endereço','Uma estrela dourada','O site mais rápido'],a:1,w:'O navegador avisa "Não seguro", e isso derruba a confiança na clínica.'},
  {t:'info',q:'O domínio deve ser do cliente',b:'O <b>domínio</b> (ex.: <code>clinicasorriso.com.br</code>) é o endereço do negócio. Ele deve ficar registrado <b>no nome do cliente</b> (CPF ou CNPJ dele), no Registro.br.\n\nVocê pode ajudar a registrar e configurar, mas o dono é ele. Isso evita brigas e mostra profissionalismo.',erro:'Registrar o domínio do cliente no seu nome "pra facilitar". Se um dia vocês se desentenderem, o cliente fica preso e a sua reputação fica manchada.'},
  {t:'mc',q:'No nome de quem deve ficar o domínio do site da clínica?',o:['No seu nome, já que você fez o site','No nome do cliente (CPF ou CNPJ dele)','No nome do Vercel','De ninguém'],a:1,w:'O domínio é do negócio do cliente. Você ajuda a configurar, mas o titular é ele.'},
  {t:'info',q:'Proteja as contas que publicam os sites',b:'Quem entra na sua conta do <b>Vercel</b>, do <b>GitHub</b> ou do <b>Registro.br</b> pode tirar do ar ou trocar o site de <b>todos</b> os seus clientes.\n\nPor isso, nessas contas:\n• senha longa e única\n• verificação em duas etapas ligada\n• e-mail de recuperação também protegido',tip:'Comece por aqui: ligue a verificação em duas etapas no GitHub, no Vercel e no seu e-mail principal.'},
  {t:'mc',q:'Qual conta, se invadida, pode tirar do ar o site de TODOS os seus clientes?',o:['Sua conta da Netflix','Sua conta do Vercel ou do GitHub','Seu perfil no Pinterest','Sua conta do jogo'],a:1,w:'É de lá que os sites são publicados. Essas contas precisam da proteção mais forte.'}
 ]},
 {n:'Segredos fora do código',i:'🗝️',obj:['Saber o que é uma chave secreta','Entender por que o código do site é público','Diferenciar chave pública de chave secreta'],ex:[
  {t:'info',q:'Todo código do site é público',ana:'O HTML, o CSS e o JavaScript de um site são como a vitrine de uma loja: qualquer um que passa na rua consegue ver tudo que está ali.',b:'Qualquer pessoa pode ver o código de um site: no computador, é só apertar <code>Ctrl + U</code>.\n\nPor isso, <b>nunca</b> coloque no HTML ou no JavaScript do site:\n• senhas\n• chaves secretas de APIs (pagamento, IA, banco de dados)\n• tokens de acesso\n\nTudo que vai pro navegador, o visitante consegue ler.'},
  {t:'mc',q:'Você colocou a chave secreta de uma API de pagamento dentro do script do site. Quem consegue ver?',o:['Só você','Só o Vercel','Qualquer pessoa que abrir o código do site','Ninguém, porque está no JavaScript'],a:2,w:'O código do site vai inteiro pro navegador do visitante. Qualquer um consegue ler.'},
  {t:'info',q:'Chave pública x chave secreta',b:'Muitos serviços dão <b>duas</b> chaves:\n• <b>Pública</b> (publishable, anon): feita pra ficar no site. Sozinha ela não faz estrago, porque o servidor tem regras que limitam o que ela pode fazer\n• <b>Secreta</b> (secret, service_role): dá acesso total. Fica só no servidor, em <b>variáveis de ambiente</b>, nunca no código do site\n\nO Criate Academy usa a chave <b>pública</b> do Supabase no site, e as regras do banco garantem que cada pessoa só mexe no próprio progresso.',erro:'Colar a chave "service_role" ou "secret" no site pra "fazer funcionar mais rápido". Com ela, qualquer visitante pode ler e apagar o banco inteiro.'},
  {t:'mc',q:'Qual chave pode ficar no código de um site?',o:['A chave secreta (service_role)','A chave pública (publishable/anon), com regras de segurança no banco','A senha do banco de dados','Nenhuma chave pode, nunca'],a:1,w:'A chave pública foi feita pra isso, desde que o banco tenha regras protegendo os dados.'},
  {t:'info',q:'Vazou? Troque na hora',b:'Se uma chave secreta foi parar no código, no GitHub ou num print:\n1. <b>Gere uma chave nova</b> no painel do serviço e desative a antiga\n2. Coloque a nova numa variável de ambiente\n3. Apagar o arquivo não basta: o histórico do GitHub e os robôs já podem ter copiado',tip:'Existem robôs que vasculham o GitHub o tempo todo atrás de chaves esquecidas. Uma chave vazada pode ser usada em minutos.'},
  {t:'build',q:'Coloque na ordem o que fazer quando uma chave secreta vaza:',o:['Gerar uma chave nova e desativar a antiga','Guardar a nova numa variável de ambiente','Conferir se o serviço foi usado por alguém estranho'],a:['Gerar uma chave nova e desativar a antiga','Guardar a nova numa variável de ambiente','Conferir se o serviço foi usado por alguém estranho'],w:'Primeiro corta o acesso do invasor, depois guarda a nova chave do jeito certo e então investiga o estrago.'}
 ]},
 {n:'Formulários e textos de visitantes',i:'📝',obj:['Entender por que não confiar no que o visitante digita','Conhecer o ataque XSS de forma simples','Usar textContent em vez de innerHTML'],ex:[
  {t:'info',q:'Tudo que vem do visitante pode ser perigoso',ana:'É como receber um pacote de um desconhecido: você não sai abrindo dentro de casa sem olhar o que tem.',b:'Formulários, comentários, campos de busca: tudo que o visitante digita pode conter <b>código</b> em vez de texto normal.\n\nSe o site pega esse texto e coloca na página como HTML, o código do visitante <b>roda no site</b>. Esse ataque se chama <b>XSS</b> (cross-site scripting).'},
  {t:'info',q:'innerHTML x textContent',b:'No JavaScript, existem dois jeitos de colocar texto na página:\n• <code>innerHTML</code>: entende o texto como <b>HTML</b>. Se vier <code>&lt;img onerror=...&gt;</code>, ele executa\n• <code>textContent</code>: mostra o texto <b>exatamente como veio</b>, sem executar nada\n\nRegra prática: texto que veio do visitante sempre com <code>textContent</code>.',code:'const nome = campo.value;\n\n// perigoso: executa HTML\nsaudacao.innerHTML = "Oi, " + nome;\n\n// seguro: só mostra o texto\nsaudacao.textContent = "Oi, " + nome;'},
  {t:'mc',q:'Um visitante digitou código HTML no campo de nome. Qual linha mostra o nome sem executar nada?',o:['el.innerHTML = nome','el.textContent = nome','document.write(nome)','eval(nome)'],a:1,w:'textContent trata tudo como texto puro. O código aparece escrito, mas não roda.'},
  {t:'fill',q:'Complete para mostrar o comentário com segurança:',code:'caixa.___ = comentario;',o:['textContent','innerHTML','outerHTML','eval'],a:['textContent'],w:'textContent mostra o texto do visitante sem executar.'},
  {t:'info',q:'Validar no navegador ajuda, mas não basta',b:'O <code>required</code> e o <code>type="email"</code> do HTML ajudam o visitante a preencher certo. Mas eles rodam no navegador, e qualquer um consegue desligar.\n\nPor isso, quando um formulário manda dados pra um servidor ou banco, a verificação de verdade acontece <b>lá no servidor</b> também.',erro:'Achar que o required protege o banco de dados. Ele só ajuda quem está preenchendo de boa-fé.'},
  {t:'mc',q:'Onde fica a verificação que realmente protege os dados de um formulário?',o:['Só no required do HTML','No servidor ou banco, além do navegador','No CSS','Na cor do botão'],a:1,w:'O navegador pode ser burlado. A regra que vale de verdade fica no servidor.'}
 ]},
 {n:'Plano de segurança do freelancer',i:'✅',obj:['Juntar tudo num checklist','Saber o que fazer se uma conta for invadida','Passar segurança pro cliente'],ex:[
  {t:'info',q:'Seu checklist de segurança',b:'O que todo freelancer de sites deveria ter:\n• Gerenciador de senhas, com senha diferente em cada conta\n• Verificação em duas etapas no e-mail, GitHub, Vercel, WhatsApp e banco\n• Celular e computador atualizados\n• Backup dos projetos no GitHub e em outro lugar\n• Nenhuma chave secreta no código dos sites\n• Domínios no nome dos clientes',tip:'Não precisa fazer tudo hoje. Faça um item por dia esta semana e você vai estar mais protegido que a maioria das empresas.'},
  {t:'info',q:'Invadiram uma conta. E agora?',b:'Se perceber que entraram numa conta sua:\n1. <b>Troque a senha</b> na hora (de um aparelho que você confia)\n2. <b>Encerre as outras sessões</b>: quase todo app tem "sair de todos os aparelhos"\n3. <b>Ligue a verificação em duas etapas</b>, se ainda não estava\n4. <b>Avise seus contatos</b>, se o golpista pode ter mandado mensagens\n5. Se usava a mesma senha em outro lugar, troque lá também',erro:'Ficar com vergonha e não avisar ninguém. Avisar rápido impede que seus contatos caiam no golpe em seu nome.'},
  {t:'mc',q:'Seu Instagram foi invadido e você conseguiu entrar de novo. Qual é o primeiro passo?',o:['Postar uma foto','Trocar a senha e encerrar as sessões em outros aparelhos','Apagar o app','Esperar pra ver se acontece de novo'],a:1,w:'Trocar a senha e derrubar as sessões tira o invasor da conta. Depois vem a verificação em duas etapas.'},
  {t:'info',q:'Segurança também vende',b:'Clientes confiam mais em quem cuida dos dados deles. Você pode mencionar na proposta:\n• "site com HTTPS (cadeado de segurança)"\n• "domínio registrado no seu nome"\n• "formulário que pede só o necessário"\n• "backup do site guardado"\n\nIsso diferencia você de quem só entrega "um site bonito".'},
  {t:'mc',q:'Qual frase passa mais confiança pra uma clínica numa proposta?',o:['"Faço o site rapidinho, sem burocracia"','"O site vem com HTTPS, o domínio fica no nome da clínica e eu guardo um backup"','"Uso a mesma senha pra todos os clientes, fica mais fácil"','"Segurança é coisa de banco"'],a:1,w:'Mostra cuidado com o que é do cliente. Isso é profissionalismo e ajuda a fechar.'},
  {t:'build',q:'Monte a ordem de prioridade pra começar hoje:',o:['Verificação em duas etapas no e-mail','Gerenciador de senhas','Atualizar celular e computador'],a:['Verificação em duas etapas no e-mail','Gerenciador de senhas','Atualizar celular e computador'],w:'O e-mail recupera todas as outras contas, então ele vem primeiro. Depois senhas únicas e, por fim, os aparelhos em dia.'}
 ]}
]}]}
];

/* ================= testes práticos (1 por unidade) ================= */
const PROJ=(()=>{
const R=(d,sel,prop)=>{const vis=rs=>{for(const r of rs){if(r.cssRules&&!r.selectorText){if(vis(r.cssRules))return true;continue}if(r.selectorText&&r.selectorText.split(',').map(x=>x.trim()).includes(sel)&&(!prop||r.style.getPropertyValue(prop).trim()))return r.style.getPropertyValue(prop).trim()||true}return false};for(const sh of d.styleSheets){try{const v=vis(sh.cssRules);if(v)return v}catch(e){}}return false};
const show=['preco','quantidade','total','frete','mensagem'];
return {
'html:0':{t:'Cardápio da Lanchonete do Zé',cena:'O Zé tem uma lanchonete e pediu uma página simples com o cardápio. Monte usando só o que você aprendeu na Unidade 1. Se travar, toque no 💡 de cada passo.',start:'<!-- Escreva seu código aqui embaixo -->\n\n',passos:[
 {q:'Um título principal <code>&lt;h1&gt;<\/code> com o texto <b>Lanchonete do Zé<\/b>',dica:'O h1 é o título mais importante da página. Abre, escreve o texto e fecha com a barra.',cod:'<h1>Lanchonete do Zé<\/h1>',check:d=>{const h=d.querySelector('h1');return !!h&&/z[ée]/i.test(h.textContent)}},
 {q:'Um subtítulo <code>&lt;h2&gt;<\/code> "Lanches" e, embaixo, uma lista <code>&lt;ul&gt;<\/code> com pelo menos 3 lanches',dica:'A ul é a lista com bolinhas. Cada item vai dentro de um li.',cod:'<h2>Lanches<\/h2>\n<ul>\n  <li>X-Salada<\/li>\n  <li>X-Bacon<\/li>\n  <li>Cachorro-quente<\/li>\n<\/ul>',check:d=>!!d.querySelector('h2')&&d.querySelectorAll('ul li').length>=3},
 {q:'Outro <code>&lt;h2&gt;<\/code> "Como pedir" e uma lista numerada <code>&lt;ol&gt;<\/code> com 3 passos',dica:'ol é a lista numerada: use quando a ORDEM importa, como num passo a passo.',cod:'<h2>Como pedir<\/h2>\n<ol>\n  <li>Escolha o lanche<\/li>\n  <li>Chame no WhatsApp<\/li>\n  <li>Retire no balcão<\/li>\n<\/ol>',check:d=>d.querySelectorAll('h2').length>=2&&d.querySelectorAll('ol li').length>=3},
 {q:'Um parágrafo <code>&lt;p&gt;<\/code> com o endereço, usando <code>&lt;br&gt;<\/code> pra pular de linha entre a rua e a cidade',dica:'O br quebra a linha DENTRO do mesmo parágrafo. Ele não tem fechamento.',cod:'<p>Rua das Flores, 120<br>Tangará - SC<\/p>',check:d=>!!d.querySelector('p br')},
 {q:'Destaque uma palavra com <code>&lt;strong&gt;<\/code> dentro de um parágrafo (ex.: "promoção")',dica:'strong deixa a palavra em negrito e diz ao Google que ela é importante.',cod:'<p>Toda sexta tem <strong>promoção<\/strong> de X-Bacon!<\/p>',check:d=>!!d.querySelector('p strong')}
],sol:'<h1>Lanchonete do Zé<\/h1>\n<p>O melhor lanche da cidade. Toda sexta tem <strong>promoção<\/strong>!<\/p>\n\n<h2>Lanches<\/h2>\n<ul>\n  <li>X-Salada<\/li>\n  <li>X-Bacon<\/li>\n  <li>Cachorro-quente<\/li>\n<\/ul>\n\n<h2>Como pedir<\/h2>\n<ol>\n  <li>Escolha o lanche<\/li>\n  <li>Chame no WhatsApp<\/li>\n  <li>Retire no balcão<\/li>\n<\/ol>\n\n<p>Rua das Flores, 120<br>Tangará - SC<\/p>'},

'html:1':{t:'Site da Pizzaria Bella',cena:'A Pizzaria Bella quer um site organizado, com menu que leva até as partes da página, uma foto e o Instagram. Use links, imagens e a estrutura que você aprendeu.',start:'<!-- Monte o site aqui -->\n\n',passos:[
 {q:'Um <code>&lt;header&gt;<\/code> com o <code>&lt;h1&gt;<\/code> "Pizzaria Bella" e dois links de menu: um pra <code>#cardapio<\/code> e outro pra <code>#contato<\/code>',dica:'Link interno usa # + o id da seção. O header é o topo do site.',cod:'<header>\n  <h1>Pizzaria Bella<\/h1>\n  <nav>\n    <a href="#cardapio">Cardápio<\/a>\n    <a href="#contato">Contato<\/a>\n  <\/nav>\n<\/header>',check:d=>!!d.querySelector('header h1')&&!!d.querySelector('a[href="#cardapio"]')&&!!d.querySelector('a[href="#contato"]')},
 {q:'Um <code>&lt;main&gt;<\/code> com uma <code>&lt;section id="cardapio"&gt;<\/code>, que tenha um <code>&lt;h2&gt;<\/code> e uma imagem com <code>alt<\/code> preenchido',dica:'O id é o "endereço" da seção, que o link #cardapio usa. Toda imagem precisa de alt descrevendo o que aparece nela. Pode usar a foto do exemplo.',cod:'<main>\n  <section id="cardapio">\n    <h2>Cardápio<\/h2>\n    <img src="https://picsum.photos/id/292/400/200" alt="Pizza de calabresa saindo do forno">\n  <\/section>\n<\/main>',check:d=>{const i=d.querySelector('main #cardapio img');return !!d.querySelector('main #cardapio h2')&&!!i&&(i.getAttribute('alt')||'').trim().length>2}},
 {q:'Uma <code>&lt;section id="contato"&gt;<\/code> com um link pro Instagram que abre em <b>outra aba<\/b>',dica:'target="_blank" faz o link abrir numa aba nova. O endereço precisa começar com https://.',cod:'<section id="contato">\n  <h2>Contato<\/h2>\n  <a href="https://instagram.com/pizzariabella" target="_blank">Instagram<\/a>\n<\/section>',check:d=>{const a=d.querySelector('#contato a[target="_blank"]');return !!a&&/^https?:\/\//.test(a.getAttribute('href')||'')}},
 {q:'Um <code>&lt;footer&gt;<\/code> com "© 2026 Pizzaria Bella"',dica:'O footer é o rodapé. O símbolo © você pode copiar daqui ou escrever &amp;copy;.',cod:'<footer>\n  <p>© 2026 Pizzaria Bella<\/p>\n<\/footer>',check:d=>{const f=d.querySelector('footer');return !!f&&/©|2026/.test(f.textContent)}}
],sol:'<header>\n  <h1>Pizzaria Bella<\/h1>\n  <nav>\n    <a href="#cardapio">Cardápio<\/a>\n    <a href="#contato">Contato<\/a>\n  <\/nav>\n<\/header>\n\n<main>\n  <section id="cardapio">\n    <h2>Cardápio<\/h2>\n    <img src="https://picsum.photos/id/292/400/200" alt="Pizza de calabresa saindo do forno">\n    <ul>\n      <li>Calabresa<\/li>\n      <li>Margherita<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id="contato">\n    <h2>Contato<\/h2>\n    <a href="https://instagram.com/pizzariabella" target="_blank">Instagram<\/a>\n  <\/section>\n<\/main>\n\n<footer>\n  <p>© 2026 Pizzaria Bella<\/p>\n<\/footer>'},

'html:2':{t:'Tabela de preços do salão',cena:'Um salão de beleza quer mostrar os preços numa tabela e ter um formulário de agendamento. Junte tabelas e formulários numa página só.',start:'<!-- Tabela e formulário aqui -->\n\n',passos:[
 {q:'Uma <code>&lt;table&gt;<\/code> com cabeçalho usando <code>&lt;th&gt;<\/code>: "Serviço" e "Preço"',dica:'tr é uma linha. th é uma célula de cabeçalho (fica em negrito). td é uma célula comum.',cod:'<table>\n  <tr>\n    <th>Serviço<\/th>\n    <th>Preço<\/th>\n  <\/tr>\n<\/table>',check:d=>d.querySelectorAll('table th').length>=2},
 {q:'Pelo menos 3 linhas de serviços com <code>&lt;td&gt;<\/code>',dica:'Cada serviço é uma linha tr nova, com duas células td: o nome e o preço.',cod:'<tr>\n  <td>Corte<\/td>\n  <td>R$ 40<\/td>\n<\/tr>',check:d=>[...d.querySelectorAll('table tr')].filter(r=>r.querySelector('td')).length>=3},
 {q:'Um <code>&lt;form&gt;<\/code> com um campo de nome que tenha <code>&lt;label for&gt;<\/code> ligado ao <code>id<\/code> do campo',dica:'O for do label precisa ser IGUAL ao id do input. Assim, tocar no texto já seleciona o campo.',cod:'<form>\n  <label for="nome">Seu nome<\/label>\n  <input id="nome">\n<\/form>',check:d=>[...d.querySelectorAll('form label[for]')].some(l=>{const i=d.getElementById(l.getAttribute('for'));return !!i&&i.tagName==='INPUT'})},
 {q:'Um campo de telefone com <code>type="tel"<\/code>',dica:'type="tel" abre o teclado de números no celular.',cod:'<label for="tel">WhatsApp<\/label>\n<input id="tel" type="tel">',check:d=>!!d.querySelector('form input[type="tel"]')},
 {q:'O nome deve ser obrigatório (<code>required<\/code>) e o formulário precisa de um <code>&lt;button&gt;<\/code>',dica:'required não deixa enviar com o campo vazio. Coloque dentro da tag do input.',cod:'<input id="nome" required>\n<button>Agendar<\/button>',check:d=>!!d.querySelector('form input[required]')&&!!d.querySelector('form button')}
],sol:'<h1>Salão Bela Vista<\/h1>\n<table>\n  <tr><th>Serviço<\/th><th>Preço<\/th><\/tr>\n  <tr><td>Corte<\/td><td>R$ 40<\/td><\/tr>\n  <tr><td>Escova<\/td><td>R$ 35<\/td><\/tr>\n  <tr><td>Manicure<\/td><td>R$ 30<\/td><\/tr>\n<\/table>\n\n<h2>Agende seu horário<\/h2>\n<form>\n  <label for="nome">Seu nome<\/label>\n  <input id="nome" required>\n\n  <label for="tel">WhatsApp<\/label>\n  <input id="tel" type="tel">\n\n  <button>Agendar<\/button>\n<\/form>'},

'html:3':{t:'Página completa da barbearia',cena:'Agora é pra valer: uma página completa, com o esqueleto (head e body), pronta pro Google e pro WhatsApp. Uma barbearia vai usar esta página.',start:'<!DOCTYPE html>\n<html lang="pt-BR">\n<head>\n  <meta charset="UTF-8">\n  <title>Document<\/title>\n  <!-- coloque a descrição pro Google aqui -->\n<\/head>\n<body>\n  <!-- o conteúdo da página vai aqui -->\n\n<\/body>\n<\/html>',passos:[
 {q:'Troque o <code>&lt;title&gt;<\/code> por um título bom pro Google (nome + serviço)',dica:'O title aparece na aba e no Google. Ex.: nome da barbearia + o que ela faz.',cod:'<title>Barbearia do Léo | Corte e barba em Tangará<\/title>',check:d=>{const t=(d.title||'').trim();return t.length>8&&!/^document$/i.test(t)}},
 {q:'Uma <code>&lt;meta name="description"&gt;<\/code> no head com uma frase convidando pro clique',dica:'Ela é o textinho embaixo do título no Google. Fica no head.',cod:'<meta name="description" content="Corte, barba e sobrancelha. Agende pelo WhatsApp.">',check:d=>{const m=d.querySelector('meta[name="description"]');return !!m&&(m.getAttribute('content')||'').trim().length>=20}},
 {q:'No body, um <code>&lt;article&gt;<\/code> com <code>&lt;h2&gt;<\/code> e uma <code>&lt;figure&gt;<\/code> com imagem e <code>&lt;figcaption&gt;<\/code>',dica:'figure junta a imagem com a legenda (figcaption).',cod:'<article>\n  <h2>Corte degradê<\/h2>\n  <figure>\n    <img src="https://picsum.photos/id/1005/400/220" alt="Cliente com corte degradê">\n    <figcaption>Nosso corte mais pedido<\/figcaption>\n  <\/figure>\n<\/article>',check:d=>!!d.querySelector('article h2')&&!!d.querySelector('article figure img')&&!!d.querySelector('figure figcaption')},
 {q:'Um <code>&lt;iframe&gt;<\/code> com o mapa (pode ser o endereço de exemplo)',dica:'O Google Maps dá esse código pronto em Compartilhar → Incorporar. Aqui no app o mapa pode não carregar, mas no seu site vai.',cod:'<iframe src="https://www.google.com/maps?q=Tangara+SC&output=embed" width="320" height="200"><\/iframe>',check:d=>!!d.querySelector('iframe[src]')},
 {q:'Um <code>&lt;form&gt;<\/code> com um <code>&lt;select&gt;<\/code> de serviços (2 opções ou mais) e 2 radios de horário com o <b>mesmo name<\/b>',dica:'Radios com o mesmo name formam um grupo: só dá pra marcar um.',cod:'<form>\n  <select>\n    <option>Corte<\/option>\n    <option>Barba<\/option>\n  <\/select>\n  <label><input type="radio" name="turno"> Manhã<\/label>\n  <label><input type="radio" name="turno"> Tarde<\/label>\n<\/form>',check:d=>{if(d.querySelectorAll('form select option').length<2)return false;const n={};d.querySelectorAll('form input[type="radio"][name]').forEach(r=>n[r.name]=(n[r.name]||0)+1);return Object.values(n).some(x=>x>=2)}}
],sol:'<!DOCTYPE html>\n<html lang="pt-BR">\n<head>\n  <meta charset="UTF-8">\n  <title>Barbearia do Léo | Corte e barba em Tangará<\/title>\n  <meta name="description" content="Corte, barba e sobrancelha. Agende pelo WhatsApp.">\n<\/head>\n<body>\n  <h1>Barbearia do Léo<\/h1>\n\n  <article>\n    <h2>Corte degradê<\/h2>\n    <figure>\n      <img src="https://picsum.photos/id/1005/400/220" alt="Cliente com corte degradê">\n      <figcaption>Nosso corte mais pedido<\/figcaption>\n    <\/figure>\n  <\/article>\n\n  <iframe src="https://www.google.com/maps?q=Tangara+SC&output=embed" width="320" height="200"><\/iframe>\n\n  <form>\n    <select>\n      <option>Corte<\/option>\n      <option>Barba<\/option>\n    <\/select>\n    <label><input type="radio" name="turno"> Manhã<\/label>\n    <label><input type="radio" name="turno"> Tarde<\/label>\n    <button>Agendar<\/button>\n  <\/form>\n<\/body>\n<\/html>'},

'css:0':{t:'Pinte o cartão de visita',cena:'O HTML do cartão de visita da Ana já está pronto. Sua missão é dar a cara dela só com CSS, dentro da tag style.',start:'<style>\n  \n<\/style>\n\n<h1>Ana Souza<\/h1>\n<p class="cargo">Designer gráfica<\/p>\n<p>Crio marcas e artes para pequenos negócios. Sou <span class="destaque">criativa<\/span> e entrego no prazo.<\/p>',passos:[
 {q:'No <code>body<\/code>: uma cor de fundo (background) diferente de branco',dica:'Escreva o seletor body e, dentro das chaves, a propriedade background.',cod:'body {\n  background: #fdf2e9;\n}',check:(d,w)=>{const b=w.getComputedStyle(d.body).backgroundColor;return b!=='rgba(0, 0, 0, 0)'&&b!=='rgb(255, 255, 255)'}},
 {q:'No <code>body<\/code>: uma fonte com <code>font-family<\/code>',dica:'Sempre termine com uma fonte reserva: sans-serif ou serif.',cod:'body {\n  font-family: Arial, sans-serif;\n}',check:d=>!!R(d,'body','font-family')},
 {q:'Mude a cor do <code>h1<\/code>',dica:'Seletor de tag: só o nome dela, sem ponto.',cod:'h1 {\n  color: #c2410c;\n}',check:d=>!!R(d,'h1','color')},
 {q:'Deixe o <code>.cargo<\/code> maior, com <code>font-size<\/code> de 20px ou mais',dica:'Classe no CSS começa com ponto: .cargo',cod:'.cargo {\n  font-size: 20px;\n}',check:(d,w)=>parseFloat(w.getComputedStyle(d.querySelector('.cargo')).fontSize)>=20},
 {q:'Faça o <code>.destaque<\/code> ficar em negrito (<code>font-weight<\/code>) e com outra cor',dica:'font-weight: bold deixa em negrito.',cod:'.destaque {\n  font-weight: bold;\n  color: #c2410c;\n}',check:(d,w)=>{const c=w.getComputedStyle(d.querySelector('.destaque'));return parseInt(c.fontWeight)>=600&&!!R(d,'.destaque','color')}}
],sol:'<style>\n  body {\n    background: #fdf2e9;\n    font-family: Arial, sans-serif;\n    padding: 20px;\n  }\n  h1 {\n    color: #c2410c;\n  }\n  .cargo {\n    font-size: 20px;\n  }\n  .destaque {\n    font-weight: bold;\n    color: #c2410c;\n  }\n<\/style>\n\n<h1>Ana Souza<\/h1>\n<p class="cargo">Designer gráfica<\/p>\n<p>Crio marcas e artes para pequenos negócios. Sou <span class="destaque">criativa<\/span> e entrego no prazo.<\/p>'},

'css:1':{t:'Página de serviços que se adapta',cena:'Uma academia quer a página de serviços com menu no topo e 3 cartões lado a lado, que viram um embaixo do outro no celular. O HTML já está pronto: é só CSS.',start:'<style>\n  \n<\/style>\n\n<header class="topo">\n  <span class="logo">Academia Forte<\/span>\n  <nav><a href="#">Planos<\/a> <a href="#">Contato<\/a><\/nav>\n<\/header>\n\n<div class="cards">\n  <div class="card">Musculação<\/div>\n  <div class="card">Funcional<\/div>\n  <div class="card">Pilates<\/div>\n<\/div>',passos:[
 {q:'Cada <code>.card<\/code> com <code>padding<\/code> de 12px ou mais, <code>border-radius<\/code> e uma cor de fundo',dica:'padding é o espaço de DENTRO. border-radius arredonda os cantos.',cod:'.card {\n  padding: 16px;\n  border-radius: 12px;\n  background: #e0f2fe;\n}',check:(d,w)=>{const c=w.getComputedStyle(d.querySelector('.card'));return parseFloat(c.paddingTop)>=12&&parseFloat(c.borderTopLeftRadius)>0&&c.backgroundColor!=='rgba(0, 0, 0, 0)'}},
 {q:'No <code>.topo<\/code>: <code>display: flex<\/code> e <code>justify-content: space-between<\/code> (logo à esquerda, menu à direita)',dica:'O flex vai no PAI (.topo), não nos filhos.',cod:'.topo {\n  display: flex;\n  justify-content: space-between;\n}',check:d=>R(d,'.topo','display')==='flex'&&R(d,'.topo','justify-content')==='space-between'},
 {q:'Na <code>.cards<\/code>: <code>display: flex<\/code> e um <code>gap<\/code> entre os cartões',dica:'gap é o espaço entre os filhos de um flex.',cod:'.cards {\n  display: flex;\n  gap: 12px;\n}',check:d=>R(d,'.cards','display')==='flex'&&!!R(d,'.cards','gap')},
 {q:'No celular (<code>@media (max-width: 600px)<\/code>), a <code>.cards<\/code> vira coluna: <code>flex-direction: column<\/code>',dica:'A media query só vale quando a tela é pequena. A regra de dentro sobrescreve a de fora.',cod:'@media (max-width: 600px) {\n  .cards {\n    flex-direction: column;\n  }\n}',check:d=>{for(const sh of d.styleSheets){for(const r of sh.cssRules){if(r.media&&/max-width/.test(r.media.mediaText)){for(const x of r.cssRules)if(x.selectorText==='.cards'&&x.style.flexDirection==='column')return true}}}return false}}
],sol:'<style>\n  .topo {\n    display: flex;\n    justify-content: space-between;\n    padding: 12px;\n  }\n  .cards {\n    display: flex;\n    gap: 12px;\n  }\n  .card {\n    flex: 1;\n    padding: 16px;\n    border-radius: 12px;\n    background: #e0f2fe;\n  }\n  @media (max-width: 600px) {\n    .cards {\n      flex-direction: column;\n    }\n  }\n<\/style>'},

'css:2':{t:'Vitrine da loja com efeitos',cena:'Uma loja de roupas quer uma vitrine em grade, um botão de WhatsApp que fica sempre na tela, um botão com efeito ao passar o mouse e um selo animado. Use o CSS intermediário.',start:'<style>\n  \n<\/style>\n\n<div class="selo">NOVO<\/div>\n<div class="galeria">\n  <div>Camiseta<\/div><div>Calça<\/div><div>Jaqueta<\/div>\n  <div>Vestido<\/div><div>Boné<\/div><div>Tênis<\/div>\n<\/div>\n<a class="botao" href="#">Ver coleção<\/a>\n<a class="whats" href="#">WhatsApp<\/a>',passos:[
 {q:'A <code>.galeria<\/code> vira uma grade com <code>display: grid<\/code> e <code>grid-template-columns<\/code>',dica:'repeat(3, 1fr) = 3 colunas iguais.',cod:'.galeria {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 8px;\n}',check:d=>R(d,'.galeria','display')==='grid'&&!!R(d,'.galeria','grid-template-columns')},
 {q:'O <code>.whats<\/code> fica fixo no canto de baixo à direita (<code>position: fixed<\/code>, <code>bottom<\/code> e <code>right<\/code>)',dica:'fixed prende na tela, mesmo rolando a página.',cod:'.whats {\n  position: fixed;\n  bottom: 16px;\n  right: 16px;\n}',check:(d,w)=>{const c=w.getComputedStyle(d.querySelector('.whats'));return c.position==='fixed'&&!!R(d,'.whats','bottom')&&!!R(d,'.whats','right')}},
 {q:'O <code>.botao<\/code> com <code>transition<\/code> e uma regra <code>.botao:hover<\/code> que muda a cor',dica:'O transition vai no estado NORMAL, assim anima na ida e na volta.',cod:'.botao {\n  background: #111;\n  color: white;\n  transition: background .3s;\n}\n.botao:hover {\n  background: #E63946;\n}',check:d=>!!R(d,'.botao','transition')&&(!!R(d,'.botao:hover','background')||!!R(d,'.botao:hover','background-color')||!!R(d,'.botao:hover','color'))},
 {q:'Crie um <code>@keyframes<\/code> e aplique no <code>.selo<\/code> com <code>animation<\/code>',dica:'Primeiro cria a animação com um nome, depois usa o nome em animation.',cod:'@keyframes pisca {\n  50% { opacity: .4; }\n}\n.selo {\n  animation: pisca 1s infinite;\n}',check:(d,w)=>{const n=w.getComputedStyle(d.querySelector('.selo')).animationName;if(!n||n==='none')return false;for(const sh of d.styleSheets)for(const r of sh.cssRules)if(r.type===7&&r.name===n)return true;return false}}
],sol:'<style>\n  .galeria {\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: 8px;\n  }\n  .galeria div {\n    background: #f1f1f1;\n    padding: 20px;\n    text-align: center;\n  }\n  .whats {\n    position: fixed;\n    bottom: 16px;\n    right: 16px;\n    background: #25d366;\n    color: white;\n    padding: 10px 14px;\n    border-radius: 99px;\n  }\n  .botao {\n    background: #111;\n    color: white;\n    padding: 10px 16px;\n    transition: background .3s;\n  }\n  .botao:hover {\n    background: #E63946;\n  }\n  @keyframes pisca {\n    50% { opacity: .4; }\n  }\n  .selo {\n    animation: pisca 1s infinite;\n  }\n<\/style>'},

'js:0':{t:'Calculadora de pedido',cena:'Uma lanchonete quer calcular o total do pedido e o frete. Escreva o código dentro do script. Embaixo dele já tem um ajudante que mostra suas variáveis no resultado: não precisa mexer nele.',start:'<script>\n  // escreva seu código aqui\n  \n<\/script>\n\n<!-- ajudante: mostra suas variáveis na tela (não precisa mexer) -->\n<script>\n  for (const n of '+JSON.stringify(show)+') {\n    let v;\n    try { v = eval(n); } catch (e) { v = "(ainda não existe)"; }\n    document.body.insertAdjacentHTML("beforeend", "<p><b>" + n + "<\/b>: " + v + "<\/p>");\n  }\n<\/script>',passos:[
 {q:'Crie <code>preco<\/code> (o preço de um lanche, um número) e <code>quantidade<\/code> (outro número)',dica:'Número não vai entre aspas. Use const.',cod:'const preco = 25;\nconst quantidade = 3;',check:(d,w)=>{try{return typeof w.eval('preco')==='number'&&typeof w.eval('quantidade')==='number'}catch(e){return false}}},
 {q:'Crie <code>total<\/code> = preço vezes quantidade',dica:'O sinal de vezes em programação é o asterisco *.',cod:'const total = preco * quantidade;',check:(d,w)=>{try{return w.eval('total')===w.eval('preco*quantidade')}catch(e){return false}}},
 {q:'Crie <code>frete<\/code>: se o total for <b>100 ou mais<\/b>, frete é 0; senão, é 15',dica:'Crie com let (porque o valor muda) e use if/else com >=.',cod:'let frete;\nif (total >= 100) {\n  frete = 0;\n} else {\n  frete = 15;\n}',check:(d,w)=>{try{return w.eval('frete')===(w.eval('total')>=100?0:15)}catch(e){return false}}},
 {q:'Crie <code>mensagem<\/code>: um texto que mostre o total, ex.: "Seu pedido deu R$ 75"',dica:'Junte texto e número com + ou use crase com ${ }.',cod:'const mensagem = "Seu pedido deu R$ " + total;',check:(d,w)=>{try{const m=w.eval('mensagem');return typeof m==='string'&&m.includes(String(w.eval('total')))}catch(e){return false}}}
],sol:'<script>\n  const preco = 25;\n  const quantidade = 3;\n  const total = preco * quantidade;\n\n  let frete;\n  if (total >= 100) {\n    frete = 0;\n  } else {\n    frete = 15;\n  }\n\n  const mensagem = "Seu pedido deu R$ " + total;\n<\/script>'},

'js:1':{t:'Loja interativa',cena:'Uma loja quer mostrar os produtos na página com JavaScript e um botão que conta quantos itens a pessoa adicionou. Use funções, listas e eventos.',start:'<h1>Loja da Bia<\/h1>\n<ul id="lista"><\/ul>\n<button id="mais">Adicionar ao carrinho<\/button>\n<p>Itens no carrinho: <span id="contador">0<\/span><\/p>\n\n<script>\n  \n<\/script>',passos:[
 {q:'Crie a função <code>precoComDesconto(valor)<\/code> que devolve o valor com 10% de desconto',dica:'10% de desconto = valor vezes 0.9. Não esqueça o return.',cod:'function precoComDesconto(valor) {\n  return valor * 0.9;\n}',check:(d,w)=>{try{return Math.abs(w.eval('precoComDesconto(100)')-90)<0.001}catch(e){return false}}},
 {q:'Crie o array <code>produtos<\/code> com pelo menos 3 nomes de produtos',dica:'Array fica entre colchetes, itens separados por vírgula.',cod:'const produtos = ["Camiseta", "Boné", "Meia"];',check:(d,w)=>{try{const p=w.eval('produtos');return Array.isArray(p)&&p.length>=3}catch(e){return false}}},
 {q:'Mostre cada produto como um <code>&lt;li&gt;<\/code> dentro da <code>#lista<\/code>',dica:'Use for...of e vá somando no innerHTML da lista.',cod:'for (const p of produtos) {\n  document.querySelector("#lista").innerHTML += "<li>" + p + "<\/li>";\n}',check:d=>d.querySelectorAll('#lista li').length>=3},
 {q:'Ao clicar em <code>#mais<\/code>, o <code>#contador<\/code> soma 1',dica:'Guarde a contagem numa variável com let. No clique, some 1 e escreva no textContent.',cod:'let itens = 0;\ndocument.querySelector("#mais").addEventListener("click", () => {\n  itens = itens + 1;\n  document.querySelector("#contador").textContent = itens;\n});',check:d=>{d.querySelector('#mais').click();d.querySelector('#mais').click();return d.querySelector('#contador').textContent.trim()==='2'}}
],sol:'<script>\n  function precoComDesconto(valor) {\n    return valor * 0.9;\n  }\n\n  const produtos = ["Camiseta", "Boné", "Meia"];\n  for (const p of produtos) {\n    document.querySelector("#lista").innerHTML += "<li>" + p + "<\/li>";\n  }\n\n  let itens = 0;\n  document.querySelector("#mais").addEventListener("click", () => {\n    itens = itens + 1;\n    document.querySelector("#contador").textContent = itens;\n  });\n<\/script>'},

'js:2':{t:'Lista de compras inteligente',cena:'Vamos juntar objetos, map, filter e eventos num app de lista de compras.',start:'<input id="item" placeholder="Novo item">\n<button id="add">Adicionar<\/button>\n<ul id="lista"><\/ul>\n\n<script>\n  \n<\/script>',passos:[
 {q:'Crie <code>produtos<\/code>: um array com 3 objetos ou mais, cada um com <code>nome<\/code> e <code>preco<\/code>',dica:'Cada objeto fica entre chaves, e os objetos são separados por vírgula dentro dos colchetes.',cod:'const produtos = [\n  { nome: "Arroz", preco: 22 },\n  { nome: "Feijão", preco: 9 },\n  { nome: "Café", preco: 18 }\n];',check:(d,w)=>{try{const p=w.eval('produtos');return Array.isArray(p)&&p.length>=3&&p.every(x=>typeof x.nome==='string'&&typeof x.preco==='number')}catch(e){return false}}},
 {q:'Crie <code>caros<\/code> com <code>filter<\/code>: só os produtos com preço acima de 10',dica:'filter fica com os itens em que a condição dá true.',cod:'const caros = produtos.filter(p => p.preco > 10);',check:(d,w)=>{try{const p=w.eval('produtos'),c=w.eval('caros');return Array.isArray(c)&&c.length===p.filter(x=>x.preco>10).length&&c.every(x=>x.preco>10)}catch(e){return false}}},
 {q:'Crie <code>nomes<\/code> com <code>map<\/code>: só os nomes dos produtos',dica:'map transforma cada objeto em outra coisa: aqui, só o nome.',cod:'const nomes = produtos.map(p => p.nome);',check:(d,w)=>{try{return JSON.stringify(w.eval('nomes'))===JSON.stringify(w.eval('produtos').map(x=>x.nome))}catch(e){return false}}},
 {q:'Ao clicar em <code>#add<\/code>, adicione um <code>&lt;li&gt;<\/code> com o texto do campo <code>#item<\/code> na <code>#lista<\/code>',dica:'Pegue o value do campo, crie o li, coloque o texto e use appendChild.',cod:'document.querySelector("#add").addEventListener("click", () => {\n  const li = document.createElement("li");\n  li.textContent = document.querySelector("#item").value;\n  document.querySelector("#lista").appendChild(li);\n});',check:d=>{d.querySelector('#item').value='Leite teste';d.querySelector('#add').click();return [...d.querySelectorAll('#lista li')].some(l=>/leite teste/i.test(l.textContent))}}
],sol:'<script>\n  const produtos = [\n    { nome: "Arroz", preco: 22 },\n    { nome: "Feijão", preco: 9 },\n    { nome: "Café", preco: 18 }\n  ];\n  const caros = produtos.filter(p => p.preco > 10);\n  const nomes = produtos.map(p => p.nome);\n\n  document.querySelector("#add").addEventListener("click", () => {\n    const li = document.createElement("li");\n    li.textContent = document.querySelector("#item").value;\n    document.querySelector("#lista").appendChild(li);\n  });\n<\/script>'},

'edit:0':{t:'Personalize o site do cliente',cena:'Este é o fluxo real do seu trabalho: um site modelo chegou e você precisa deixar ele com a cara do cliente "Clínica Sorriso Feliz". Ache cada coisa no código e troque, sem quebrar nada.',start:'<style>\n  :root { --cor: #1F6FEB; }\n  body { font-family: Arial, sans-serif; margin: 0; }\n  header { background: var(--cor); color: white; padding: 16px; }\n  .btn { display: inline-block; background: var(--cor); color: white; padding: 10px 16px; border-radius: 99px; text-decoration: none; margin: 12px 16px; }\n  p { padding: 0 16px; }\n<\/style>\n\n<header>\n  <h1>Clínica Exemplo<\/h1>\n<\/header>\n<p>Na Clínica Exemplo você é atendido com carinho.<\/p>\n<a class="btn" href="https://wa.me/5548900000000">Agende<\/a>\n<img src="https://picsum.photos/id/64/400/160" alt="Recepção da Clínica Exemplo">\n<p>Fale com a gente: <a href="https://wa.me/5548900000000">WhatsApp<\/a><\/p>',passos:[
 {q:'Troque <b>Clínica Exemplo<\/b> por <b>Clínica Sorriso Feliz<\/b> em TODOS os lugares (inclusive no alt da imagem)',dica:'Procure com os olhos cada "Clínica Exemplo". No VS Code você usaria Ctrl+F. São 3 lugares.',cod:'<h1>Clínica Sorriso Feliz<\/h1>',check:d=>{const h=d.documentElement.outerHTML;return !/Cl[ií]nica Exemplo/i.test(h)&&/Sorriso Feliz/i.test(h)}},
 {q:'Troque a cor principal (<code>--cor<\/code>) pelo verde <code>#16a34a<\/code>',dica:'A cor está numa variável lá no :root. Trocando ali, muda no site todo.',cod:':root { --cor: #16a34a; }',check:(d,w)=>w.getComputedStyle(d.documentElement).getPropertyValue('--cor').trim().toLowerCase()==='#16a34a'},
 {q:'Troque o número do WhatsApp em <b>todos<\/b> os links <code>wa.me<\/code> para <code>5548999990000<\/code>',dica:'São 2 links. O número fica logo depois de wa.me/.',cod:'href="https://wa.me/5548999990000"',check:d=>{const a=[...d.querySelectorAll('a[href*="wa.me"]')];return a.length>=2&&a.every(x=>x.getAttribute('href').includes('5548999990000'))}},
 {q:'Troque o texto do botão "Agende" por <b>Agendar pelo WhatsApp<\/b>',dica:'O texto do botão fica entre a abertura e o fechamento do a com class="btn".',cod:'<a class="btn" href="https://wa.me/5548999990000">Agendar pelo WhatsApp<\/a>',check:d=>{const b=d.querySelector('.btn');return !!b&&/agendar pelo whatsapp/i.test(b.textContent)}}
],sol:'<style>\n  :root { --cor: #16a34a; }\n  ...\n<\/style>\n\n<header>\n  <h1>Clínica Sorriso Feliz<\/h1>\n<\/header>\n<p>Na Clínica Sorriso Feliz você é atendido com carinho.<\/p>\n<a class="btn" href="https://wa.me/5548999990000">Agendar pelo WhatsApp<\/a>\n<img src="https://picsum.photos/id/64/400/160" alt="Recepção da Clínica Sorriso Feliz">\n<p>Fale com a gente: <a href="https://wa.me/5548999990000">WhatsApp<\/a><\/p>'},

'venda:0':{t:'Conversa com a Dra. Paula',obj:['Responder uma conversa real do começo ao fim','Mostrar valor antes de falar de preço','Usar tudo da Unidade 1'],conv:[

function carregarRk(){

  if(RK&&Date.now()-RKt<60000)return Promise.resolve(RK);
  let f=null;try{f=window.parent!==window&&window.parent.caRanking}catch(x){}
  if(typeof f!=='function'){RKerr=true;return Promise.resolve(null)}
  RKload=Promise.resolve().then(()=>f()).then(r=>{RK=Array.isArray(r)?r:null;RKerr=!RK;RKt=Date.now();return RK}).catch(()=>{RKerr=true;return null}).finally(()=>{RKload=null});
  return RKload}
function listaRk(modo){
  const sw=semana(),eu=meuNome().toLowerCase();
  const arr=(RK||[]).map(r=>({nome:String(r.nome||'?'),xp:+r.xp||0,sem:r.sem===sw?(+r.sem_xp||0):0}));

  if(i>=0){arr[i].xp=Math.max(arr[i].xp,me.xp);arr[i].sem=Math.max(arr[i].sem,me.sem)}else arr.push(me);

  else if(e.t==='info'){h=`<span class="tag">NOVO CONCEITO</span><div class="q">${esc(e.q)}</div>${e.ana?`<div class="ana"><b>Pense assim</b> ${esc(e.ana)}</div>`:''}<div class="txt">${e.b.replace(/\n/g,'<br>')}</div>${e.code?`<div class="codebox">${cor(e.code)}</div>`:''}${e.show&&e.code?`<div class="pv"><b>Como aparece na tela</b><iframe class="pvi" title="Resultado do exemplo"></iframe></div>`:''}${e.erro?`<div class="erro"><b>Erro comum</b> ${esc(e.erro)}</div>`:''}${e.tip?`<div class="tip"><b>Dica do professor</b> ${esc(e.tip)}</div>`:''}`;rodape('CONTINUAR',true)}
  else if(e.t==='mc'){h=`<span class="tag">ESCOLHA A RESPOSTA</span><div class="q">${esc(e.q)}</div><div class="opts">${e.o.map((o,i)=>`<button class="opt" data-o="${i}">${/[<>{};]|\(|\)|===|\.\w/.test(o)?`<code>${esc(o)}</code>`:esc(o)}</button>`).join('')}</div>`;rodape('VERIFICAR',false)}
  else if(e.t==='fill'){resp=[];h=`<span class="tag">COMPLETE O CÓDIGO</span><div class="q">${esc(e.q)}</div><div class="codebox" id="fillCode"></div><div class="chips">${e.o.map((o,i)=>`<button class="chip" data-c="${i}">${esc(o)}</button>`).join('')}</div><button class="reset" id="limpar">limpar</button>${e.tip?`<div class="tip"><b>Dica</b>${esc(e.tip)}</div>`:''}`;rodape('VERIFICAR',false)}
  else if(e.t==='build'){resp=[];const ord=embaralhar(e.o.map((o,i)=>i));h=`<span class="tag">MONTE O CÓDIGO</span><div class="q">${esc(e.q)}</div><div class="ans" id="ans"></div><div class="chips">${ord.map(i=>`<button class="chip" data-b="${i}">${esc(e.o[i])}</button>`).join('')}</div>`;rodape('VERIFICAR',false)}
  else if(e.t==='type'){h=`<span class="tag">ESCREVA O CÓDIGO</span><div class="q">${esc(e.q)}</div><textarea class="ed" id="ed" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Seu código">${esc(e.start||'')}</textarea><div class="pv"><b>Resultado${e.click?' (toque no botão pra testar)':''}</b><iframe id="pv" title="Resultado"></iframe></div><button class="reset" id="dica">Ver dica</button><div class="txt" id="dicaTxt" hidden style="margin-top:6px"><div class="codebox">${esc(e.hint)}</div></div>`;rodape('VERIFICAR',!!(e.start&&e.start.trim()))}
  else if(e.t==='escreva'){h=`<span class="tag">SUA VEZ DE RESPONDER</span><div class="q">${esc(e.q)}</div>${e.cli?`<div class="zap"><div class="zb cli"><small>${esc(e.quem||'Cliente')}</small>${esc(e.cli)}</div></div>`:''}<textarea class="msgEd" id="ed2" placeholder="Escreva aqui como se fosse mandar no WhatsApp…" aria-label="Sua resposta"></textarea><div class="small2">Não existe uma única resposta certa. Escreva do seu jeito e depois compare com a do professor.</div>`;rodape('COMPARAR COM O PROFESSOR',false)}
  $('ex').innerHTML=h;troca();
  if(e.t==='escreva'){const t=$('ed2');t.focus();t.addEventListener('input',()=>{$('acao').disabled=t.value.trim().length<10})}
  if(e.t==='info'&&e.show&&e.code){const f=document.querySelector('#ex .pvi');if(f){f.onload=()=>{try{f.style.height=Math.min(340,f.contentDocument.body.scrollHeight+18)+'px'}catch(x){}}}if(f)f.srcdoc='<meta charset="utf-8"><style>body{font-family:system-ui,sans-serif;padding:8px 12px;margin:0;color:#111;background:#fff}</style>'+(typeof e.show==='string'?e.show:e.code)}
  if(e.t==='fill')desenhaFill();
  if(e.t==='type'){atualizaPv();const ed=$('ed');
    const pos=(e.start||'').indexOf('\n  \n');if(pos>=0){ed.focus();ed.selectionStart=ed.selectionEnd=pos+3}else ed.focus();
    let tm;ed.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(atualizaPv,250);$('acao').disabled=!ed.value.trim()});
    ed.addEventListener('keydown',ev=>{if(ev.key==='Tab'){ev.preventDefault();const s=ed.selectionStart;ed.value=ed.value.slice(0,s)+'  '+ed.value.slice(ed.selectionEnd);ed.selectionStart=ed.selectionEnd=s+2;atualizaPv()}})}
  $('ex').parentElement.scrollTop=0;
}
function selo(cor,ic){return `<div class="selo" style="--cc:${cor}"><span class="s-halo"></span>${[0,1,2,3,4,5,6,7].map(i=>`<i class="sp" style="--a:${i*45}deg"></i>`).join('')}<svg viewBox="0 0 120 120" aria-hidden="true"><circle class="s-ring" cx="60" cy="60" r="54"/><circle class="s-fill" cx="60" cy="60" r="45"/><path class="s-chk" d="M40 61l13 13 28-30"/></svg>${ic?`<span class="s-ic">${ic}</span>`:''}</div>`}
function contar(){document.querySelectorAll('[data-n]').forEach(el=>{const n=+el.dataset.n,pre=el.dataset.pre||'';if(calmo()){el.textContent=pre+n;return}const t0=performance.now(),d=900;const f=t=>{const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);el.textContent=pre+Math.round(n*e);if(k<1)requestAnimationFrame(f)};setTimeout(()=>requestAnimationFrame(f),450)})}
function troca(){const x=$('ex');if(calmo())return;x.classList.remove('ex-in');void x.offsetWidth;x.classList.add('ex-in')}
function cor(code){return esc(code).replace(/(&lt;\/?)([a-zA-Z0-9!]+)/g,'$1<span class="t">$2</span>').replace(/([a-z\-]+)=(&quot;[^&]*?&quot;)/g,'<span class="a">$1</span>=<span class="s">$2</span>')}
function embaralhar(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}if(a.length>1&&a.every((v,i)=>v===i))[a[0],a[1]]=[a[1],a[0]];return a}
function desenhaFill(){const e=atual();let n=0;$('fillCode').innerHTML=esc(e.code).replace(/___/g,()=>{const v=resp[n];const html=`<span class="blank ${v!=null?'fill':''}" data-bl="${n}">${v!=null?esc(e.o[v]):'&nbsp;'}</span>`;n++;return html});
  document.querySelectorAll('[data-c]').forEach(b=>b.classList.toggle('used',resp.includes(+b.dataset.c)));$('acao').disabled=resp.length<e.a.length}
function atualizaPv(){const f=$('pv');if(f)f.srcdoc='<style>body{font-family:system-ui,sans-serif;padding:8px 12px;margin:0;color:#111}</style>'+$('ed').value}
function rodape(txt,ok){$('foot').className='lfoot';$('footIn').innerHTML=`<button class="big" id="acao" ${ok?'':'disabled'}>${txt}</button>`}
function rodarLive(code){return new Promise(res=>{const f=document.createElement('iframe');f.setAttribute('aria-hidden','true');f.style.cssText='position:fixed;left:-9999px;top:0;width:400px;height:300px;border:0';let ok=false;f.onload=()=>{if(ok)return;ok=true;setTimeout(()=>res(f),30)};document.body.appendChild(f);f.srcdoc='<style>body{font-family:system-ui,sans-serif;margin:0}</style>'+code;setTimeout(()=>{if(!ok){ok=true;res(f)}},2500)})}
$('ex').addEventListener('click',ev=>{
  const e=L&&atual();if(!e)return;
  const o=ev.target.closest('[data-o]');if(o){sTap();resp=+o.dataset.o;document.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===o));$('acao').disabled=false;return}
  const c=ev.target.closest('[data-c]');if(c&&resp.length<e.a.length){sTap();resp.push(+c.dataset.c);desenhaFill();return}
  const bl=ev.target.closest('[data-bl]');if(bl&&resp[+bl.dataset.bl]!=null){sTap();resp.splice(+bl.dataset.bl,1);desenhaFill();return}
  if(ev.target.id==='limpar'){resp=[];desenhaFill();return}
  const b=ev.target.closest('[data-b]');if(b&&!b.classList.contains('used')){sTap();resp.push(+b.dataset.b);b.classList.add('used');const s=document.createElement('button');s.className='chip';s.dataset.r=b.dataset.b;s.textContent=e.o[+b.dataset.b];$('ans').appendChild(s);$('acao').disabled=false;return}
  const r=ev.target.closest('[data-r]');if(r){sTap();const i=+r.dataset.r;resp.splice(resp.indexOf(i),1);r.remove();document.querySelector(`[data-b="${i}"]`).classList.remove('used');$('acao').disabled=!resp.length;return}
  if(ev.target.id==='dica'){$('dicaTxt').hidden=false;ev.target.hidden=true}
});
$('foot').addEventListener('click',async ev=>{
  const b=ev.target.closest('#acao,#seguir');if(!b||b.disabled)return;
  if(L&&L.pj){if(b.id==='acao')verificarProj();return}
  if(b.id==='seguir'){L.i++;return mostrar()}
  const e=atual();
  if(e.t==='info'||e.t==='intro'){sTap();L.i++;return mostrar()}
  if(e.t==='escreva'){sOk();L.xp+=10;const minha=$('ed2').value.trim();
    $('ex').innerHTML=`<span class="tag">COMPARE AS RESPOSTAS</span><div class="q">${esc(e.q)}</div><div class="zap">${e.cli?`<div class="zb cli"><small>${esc(e.quem||'Cliente')}</small>${esc(e.cli)}</div>`:''}<div class="zb eu"><small>Você</small>${esc(minha)}</div></div><div class="ana" style="margin-top:14px"><b>Um jeito bom de responder</b>${esc(e.mod)}</div><div class="chkL"><b>Confira se a sua resposta:</b>${e.chk.map((c,i)=>`<label><input type="checkbox"> ${esc(c)}</label>`).join('')}</div><div class="small2">Marque o que você fez. O que ficou faltando, tente usar na próxima mensagem de verdade.</div>`;
    $('ex').parentElement.scrollTop=0;
    $('foot').className='lfoot';$('footIn').innerHTML='<button class="big" id="seguir">CONTINUAR</button>';return}
  if(e.t==='type'){b.disabled=true;b.textContent='VERIFICANDO…';let ok=false;const code=$('ed').value;
    try{if(e.live){const f=await rodarLive(code);try{ok=!!e.check(f.contentDocument,f.contentWindow)}catch(x){ok=false}f.remove()}else ok=!!e.check(new DOMParser().parseFromString(code,'text/html'))}catch(x){ok=false}
    return feedback(ok,e)}
  let ok=false;
  if(e.t==='mc')ok=resp===e.a;
  if(e.t==='fill'||e.t==='build')ok=resp.map(i=>e.o[i]).join('|')===e.a.join('|');
  feedback(ok,e);
});
function feedback(ok,e){
  if(ok){sOk();L.xp+=10}else{sBad();L.vidas=Math.max(0,L.vidas-1);L.erros++;if(L.i<L.ex.length)L.fila.push(e);$('ex').classList.remove('shake');void $('ex').offsetWidth;$('ex').classList.add('shake')}
  $('hearts').innerHTML=ic('heart')+L.vidas;
  const certo=e.t==='mc'?e.o[e.a]:e.t==='type'?e.w:(e.a||[]).join(' ');
  $('foot').className='lfoot fb '+(ok?'ok':'bad');
  $('footIn').innerHTML=`<div class="fbt">${ok?ic('check')+['Mandou bem!','Isso aí!','Perfeito!','Arrasou!','Boa!'][Math.floor(Math.random()*5)]:ic('x')+'Quase!'}</div><div class="fbx">${ok?esc(e.w||''):`Resposta certa:<div class="codebox" style="margin:6px 0">${esc(certo)}</div>${e.t==='type'?'Essa atividade volta no final pra você tentar de novo.':esc(e.w||'')}`}</div><button class="big" id="seguir">${L.vidas===0&&!ok?'TENTAR DE NOVO':'CONTINUAR'}</button>`;
  if(L.vidas===0&&!ok){$('seguir').onclick=ev=>{ev.stopPropagation();L.proj?abrirProj(L.proj):abrir(L.cid,L.k)}}
}
function fim(){
  if(L.proj)return fimProj();
  sFim();confete();
  const antes=snap(),id=L.cid+':'+L.k,prim=!S.done[id],bonus=L.erros===0?10:0,ganho=L.xp+bonus,c=curso(L.cid);
  S.done[id]=true;ganhar(ganho);
  if(S.last!==hoje()){S.streak=S.last===ontem()?S.streak+1:1;S.last=hoje()}S.best=Math.max(+S.best||0,S.streak);
  salvar();
  const fimCurso=pct(c)>=1&&prim;
  $('lbar').style.width='100%';
  $('ex').innerHTML=`<div class="end">${selo(c.cor,fimCurso?ic('grad'):L.erros===0?ic('star'):'')}<h2>${fimCurso?'Curso concluído!':L.erros===0?'Lição perfeita!':'Lição concluída!'}</h2><div class="txt">${esc(FL[L.cid][L.k].l.n)}${fimCurso?` · você terminou o curso de ${esc(c.nome)}!`:prim&&L.k+1<FL[L.cid].length?' · próxima lição liberada':''}</div>
  <div class="res"><div><span class="r-ic">${ic('bolt')}</span><b data-n="${ganho}" data-pre="+">+${ganho}</b><small>XP${bonus?' · perfeito':''}</small></div><div><span class="r-ic">${ic('heart')}</span><b data-n="${L.vidas}">${L.vidas}</b><small>vidas</small></div><div><span class="r-ic">${ic('flame')}</span><b data-n="${S.streak}">${S.streak}</b><small>${S.streak===1?'dia seguido':'dias seguidos'}</small></div></div>
  ${novidades(antes)}${S.dayXp>=META&&S.dayXp-ganho<META?'<div class="goal feita" style="text-align:center;font-weight:600">Meta do dia batida. Volta amanhã pra manter a sequência.</div>':''}</div>`;
  contar();VIEW.recem=L.cid+':'+L.k;
  $('foot').className='lfoot';$('footIn').innerHTML='<button class="big" id="voltar">CONTINUAR</button>';$('voltar').onclick=fecharLicao;
}
/* ================= teste prático ================= */
function abrirProj(key){const dl=document.getElementById('dicaLock');if(dl)dl.classList.remove('show');
  const[cid,ui]=key.split(':'),P=PROJ[key];S.ultimo=cid;salvar();
  $('lesson').hidden=false;document.body.style.overflow='hidden';
  if(P.conv){L={cid,k:-1,proj:key,lic:{n:P.t,i:'🏁',obj:P.obj,ex:P.conv},ex:[{t:'intro'},...P.conv],i:0,vidas:5,xp:0,erros:0,fila:[]};return mostrar()}
  L={cid,proj:key,pj:true,ui:+ui,st:P.passos.map(()=>null),tent:P.passos.map(()=>0),xp:0};telaProj()}
function telaProj(){
  const P=PROJ[L.proj],c=curso(L.cid),u=c.units[L.ui];
  const code=((S.projCode||{})[L.proj])??P.start;
  $('hearts').innerHTML='';
  $('ex').innerHTML=`<span class="tag" style="color:${c.cor}">TESTE PRÁTICO · ${esc(c.nome.toUpperCase())} · ${esc(u.u.toUpperCase())}</span><div class="q">${esc(P.t)}</div>
  <div class="prof">${ic('info')}<span>${esc(P.cena)}</span></div>
  <div class="pmis" id="pmis"></div>
  <textarea class="ed ped" id="ped" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Seu código">${esc(code)}</textarea>
  <div class="pv ppv"><b>Resultado</b><iframe id="pv" title="Resultado"></iframe></div>
  <div class="pfb" id="pfb"></div>
  <details class="psol"><summary>Ver a solução do professor</summary><p class="small2" style="margin:4px 0 8px">Tente antes de olhar! Não precisa ficar igual: se os passos ficaram verdes, está certo.</p><div class="codebox">${cor(P.sol)}</div></details>`;
  desenhaPassos();
  const ed=$('ped'),pv=()=>{$('pv').srcdoc='<style>body{font-family:system-ui,sans-serif;padding:8px 12px;margin:0;color:#111}</style>'+ed.value};pv();
  let tm;ed.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(()=>{pv();S.projCode=S.projCode||{};S.projCode[L.proj]=ed.value.slice(0,8000);salvar()},300)});
  ed.addEventListener('keydown',ev=>{if(ev.key==='Tab'){ev.preventDefault();const s=ed.selectionStart;ed.value=ed.value.slice(0,s)+'  '+ed.value.slice(ed.selectionEnd);ed.selectionStart=ed.selectionEnd=s+2}});
  rodape('VERIFICAR',true);$('ex').parentElement.scrollTop=0;
}
function desenhaPassos(){const P=PROJ[L.proj];const ok=L.st.filter(x=>x===true).length,f1=L.st.findIndex(x=>x===false);$('lbar').style.width=(ok/P.passos.length*100)+'%';
  $('pmis').innerHTML=`<b>Sua missão (${ok} de ${P.passos.length})</b>`+P.passos.map((p,i)=>`<div class="pstep ${L.st[i]===true?'ok':L.st[i]===false?'no':''}"><div class="prow"><span class="pico">${L.st[i]===true?'✓':L.st[i]===false?'✕':i+1}</span><span class="ptx">${p.q}</span><button class="pajuda" data-aj="${i}">Ajuda</button></div><div class="paj" id="aj${i}" ${L.tent[i]>=2&&i===f1?'':'hidden'}>${p.dica}${p.cod?`<div class="codebox">${cor(p.cod)}</div>`:''}</div></div>`).join('')}
$('ex').addEventListener('click',ev=>{if(!L||!L.pj)return;const a=ev.target.closest('[data-aj]');if(a){sTap();const d=$('aj'+a.dataset.aj);d.hidden=!d.hidden}});
async function verificarProj(){
  const P=PROJ[L.proj],b=$('acao'),code=$('ped').value;b.disabled=true;b.textContent='VERIFICANDO…';
  for(let i=0;i<P.passos.length;i++){let ok=false;try{const f=await rodarLive(code);try{ok=!!P.passos[i].check(f.contentDocument,f.contentWindow)}catch(x){ok=false}f.remove()}catch(x){ok=false}
    if(!ok)L.tent[i]++;L.st[i]=ok}
  desenhaPassos();
  const falta=L.st.findIndex(x=>x!==true),fb=$('pfb');
  if(falta<0){sOk();fb.innerHTML='<div class="ana"><b>Tudo certo!</b> Todos os passos estão funcionando. Você usou de verdade o que aprendeu nesta unidade. Compare com a solução do professor se quiser ver outro jeito de fazer.</div>';
    $('foot').className='lfoot fb ok';$('footIn').innerHTML='<div class="fbt">'+ic('check')+'Teste concluído!</div><button class="big" id="pfim">CONCLUIR</button>';$('pfim').onclick=ev=>{ev.stopPropagation();fimProj()};return}
  sBad();const n=L.st.filter(x=>x===true).length;
  fb.innerHTML=`<div class="ana"><b>${n?`Boa! ${n} de ${P.passos.length} já estão certos.`:'Vamos lá, passo a passo.'}</b><br>Agora foque no passo ${falta+1}: ${P.passos[falta].q}<br><br>${L.tent[falta]>=2?'Abri a ajuda desse passo pra você, com um exemplo de código. Leia, entenda e adapte pro seu.':'Toque em Ajuda nele se precisar de uma dica.'}</div>`;
  rodape('VERIFICAR DE NOVO',true);
  const el=document.getElementById('aj'+falta);if(el)el.closest('.pstep').scrollIntoView({behavior:'smooth',block:'center'});
}
function fimProj(){
  const antes=snap();sFim();confete();S.proj=S.proj||{};const prim=!S.proj[L.proj];S.proj[L.proj]=1;
  const ganho=prim?50:10;ganhar(ganho);
  if(S.last!==hoje()){S.streak=S.last===ontem()?S.streak+1:1;S.last=hoje()}S.best=Math.max(+S.best||0,S.streak);
  salvar();const P=PROJ[L.proj];$('lbar').style.width='100%';$('hearts').innerHTML='';
  $('ex').innerHTML=`<div class="end">${selo(curso(L.cid).cor,ic('trophy'))}<h2>Teste prático concluído!</h2><div class="txt">${esc(P.t)}${P.conv?' · Compare sempre suas respostas com as do professor: é assim que se pega o jeito.':' · Você construiu algo de verdade sozinho. Tente fazer o mesmo no VS Code!'}</div>
  <div class="res r2"><div><span class="r-ic">${ic('bolt')}</span><b data-n="${ganho}" data-pre="+">+${ganho}</b><small>XP${prim?'':' · refeito'}</small></div><div><span class="r-ic">${ic('flame')}</span><b data-n="${S.streak}">${S.streak}</b><small>${S.streak===1?'dia seguido':'dias seguidos'}</small></div></div>${novidades(antes)}</div>`;contar();
  $('foot').className='lfoot';$('footIn').innerHTML='<button class="big" id="voltar">CONTINUAR</button>';$('voltar').onclick=fecharLicao;
}
function confete(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const b=document.createElement('div');b.className='confete';const cs=['#1F6FEB','#E63946','#FFC21A','#17171B','#0E7C86'];b.innerHTML=Array.from({length:70},(_,i)=>`<i style="left:${Math.random()*100}%;background:${cs[i%5]};animation-delay:${Math.random()*.4}s;animation-duration:${1.6+Math.random()*1.4}s"></i>`).join('');document.body.appendChild(b);setTimeout(()=>b.remove(),3600)}
render('f');atualizaRk();
}
</script>
</body>
</html>
