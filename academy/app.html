  {t:'type',live:1,q:'Deixe os botões do .menu lado a lado com espaço entre eles',start:'<style>\n  .menu {\n    \n  }\n</style>\n<div class="menu">\n  <button>Início</button>\n  <button>Sobre</button>\n  <button>Contato</button>\n</div>',hint:'display: flex;\ngap: 10px;',check:(d,w)=>{const c=w.getComputedStyle(d.querySelector('.menu'));return c.display==='flex'&&parseFloat(c.columnGap||c.gap)>0},w:'.menu {\n  display: flex;\n  gap: 10px;\n}'}
 ]},
 {n:'Responsivo',i:'📱',obj:['Fazer o site funcionar no celular','Usar media queries','Testar no tamanho certo'],ex:[
  {t:'info',q:'Um site, várias telas',ana:'Pense numa roupa de elástico: ela se ajusta a quem veste. Um site responsivo se ajusta à tela de quem abre.',b:'Três peças:\n• A tag <code>&lt;meta name="viewport" content="width=device-width, initial-scale=1"&gt;</code> no head\n• Medidas flexíveis (<code>%</code>, <code>max-width</code>)\n• <b>Media queries</b>: regras que só valem em certas larguras',code:'.cards { display: flex; gap: 12px; }\n\n@media (max-width: 600px) {\n  .cards { flex-direction: column; }\n}',tip:'A maioria dos pacientes vai abrir o site no celular. Sempre teste na tela pequena primeiro.'},
  {t:'mc',q:'O que uma media query faz?',o:['Toca vídeo','Aplica estilos só em certos tamanhos de tela','Carrega imagens','Cria animações'],a:1,w:'Ela liga regras conforme a largura da tela.'},
  {t:'fill',q:'Regras só pra telas até 600px:',code:'@media (___: 600px) {\n  ...\n}',o:['max-width','min-width','width-max','screen'],a:['max-width'],w:'max-width: até 600px de largura.'},
  {t:'info',q:'Como testar no computador',b:'No Chrome, aperte <b>F12</b> e clique no ícone de celular (ou Ctrl+Shift+M). A página vira do tamanho de um celular, e você escolhe o modelo lá em cima.',erro:'Testar só no computador e mandar pro cliente. Ele abre no celular e o menu está quebrado.'},
  {t:'mc',q:'Pra imagem nunca passar da largura da tela:',o:['width: 2000px','max-width: 100%','size: auto','overflow: big'],a:1,w:'max-width: 100% faz a imagem caber em qualquer tela.'},
  {t:'mc',q:'Sem a meta viewport, no celular o site...',o:['Fica perfeito','Aparece minúsculo, como no computador','Não abre','Fica sem cor'],a:1,w:'O celular finge ser uma tela grande e diminui tudo.'}
 ]},
 {n:'Revisão de CSS',i:'🏆',obj:['Revisar o curso de CSS','Montar um cartão de serviço completo'],ex:[
  {t:'mc',q:'Estrutura de uma regra:',o:['seletor { propriedade: valor; }','propriedade { seletor: valor }','valor = seletor','{ seletor }'],a:0,w:'seletor { propriedade: valor; }'},
  {t:'mc',q:'.botao seleciona:',o:['id="botao"','class="botao"','<botao>','todos os botões'],a:1,w:'Ponto = classe.'},
  {t:'mc',q:'Espaço interno x externo:',o:['margin / padding','padding / margin','border / gap','gap / border'],a:1,w:'padding dentro, margin fora.'},
  {t:'mc',q:'Pra empilhar os cards no celular:',o:['@media (max-width: 600px) { .cards { flex-direction: column; } }','@phone { stack }','.cards { mobile: true }','display: celular'],a:0,w:'Media query + flex-direction: column.'},
  {t:'type',live:1,q:'Desafio! .card com fundo #22e57a, padding 16px e cantos arredondados',start:'<style>\n  .card {\n    \n  }\n</style>\n<div class="card">Card</div>',hint:'background: #22e57a;\npadding: 16px;\nborder-radius: 12px;',check:(d,w)=>{const c=w.getComputedStyle(d.querySelector('.card'));return c.backgroundColor==='rgb(34, 229, 122)'&&parseFloat(c.paddingTop)>=16&&parseFloat(c.borderTopLeftRadius)>0},w:'background: #22e57a;\npadding: 16px;\nborder-radius: 12px;'}
 ]}
]},
{u:"Unidade 3",t:"CSS intermediário",l:[{n:"CSS Grid",i:"▦",obj:["Montar grades com grid","Usar fr e repeat","Fazer grade que se adapta sozinha"],ex:[{t:"info",q:"Grade de linhas e colunas",ana:"Flex é uma prateleira (uma linha). Grid é um tabuleiro de xadrez: linhas e colunas ao mesmo tempo.",b:"<code>display: grid<\/code> no pai e <code>grid-template-columns<\/code> diz as colunas.\n\nA unidade <code>fr<\/code> significa \"uma fração do espaço livre\". <code>1fr 1fr 1fr<\/code> são 3 colunas iguais.",code:"<div class=\"g\"><div>1<\/div><div>2<\/div><div>3<\/div><div>4<\/div><div>5<\/div><div>6<\/div><\/div>\n<style>\n  .g { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }\n  .g div { background: #dbe6ff; padding: 14px; text-align: center; border-radius: 8px; }\n<\/style>",show:true},{t:"mc",q:"grid-template-columns: 1fr 2fr; cria:",o:["2 colunas iguais","2 colunas, a segunda com o dobro da largura","3 colunas","1 linha"],a:1,w:"2fr pega o dobro de 1fr."},{t:"info",q:"repeat e a grade que se adapta",b:"<code>repeat(3, 1fr)<\/code> é o mesmo que <code>1fr 1fr 1fr<\/code>.\n\nE o truque mais útil de todos: a grade decide sozinha quantas colunas cabem:",code:"grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));",tip:"Essa linha faz os cards ficarem 1 por linha no celular e 3 ou 4 no computador, sem media query."},{t:"fill",q:"Faça 4 colunas iguais:",code:"grid-template-columns: ___(4, 1fr);",o:["repeat","grid","columns","times"],a:["repeat"],w:"repeat(4, 1fr)."},{t:"mc",q:"Flex ou Grid pra uma galeria de fotos em várias linhas e colunas?",o:["Flex","Grid","Nenhum","Tabela"],a:1,w:"Linhas e colunas ao mesmo tempo: Grid."},{t:"type",live:1,q:"Transforme a .galeria numa grade de 3 colunas iguais",start:"<style>\n  .galeria {\n    \n  }\n<\/style>\n<div class=\"galeria\"><div>A<\/div><div>B<\/div><div>C<\/div><\/div>",hint:"display: grid;\ngrid-template-columns: repeat(3, 1fr);",check:(d,w)=>{const c=w.getComputedStyle(d.querySelector('.galeria'));return c.display==='grid'&&c.gridTemplateColumns.split(' ').length===3},w:".galeria {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n}"}]},{n:"Posição e camadas",i:"📌",obj:["Usar position relative, absolute, fixed e sticky","Controlar quem fica por cima com z-index"],ex:[{t:"info",q:"Tirando elementos do lugar",b:"• <code>relative<\/code>: fica no lugar normal, mas vira \"referência\" pros filhos\n• <code>absolute<\/code>: sai do fluxo e se posiciona em relação ao pai relative\n• <code>fixed<\/code>: fica preso na tela, mesmo rolando (ex.: botão de WhatsApp flutuante)\n• <code>sticky<\/code>: rola normal e \"gruda\" ao chegar no topo (ex.: menu)",code:"<div class=\"card\">Produto<span class=\"selo\">Novo<\/span><\/div>\n<style>\n  .card { position: relative; padding: 24px; background: #eee; border-radius: 10px; }\n  .selo { position: absolute; top: 8px; right: 8px; background: red; color: white; padding: 2px 8px; border-radius: 99px; font-size: 12px; }\n<\/style>",show:true,tip:"O selo usa top e right pra ficar no canto. Ele se posiciona em relação ao .card porque o card é relative."},{t:"mc",q:"Botão de WhatsApp que fica sempre no canto da tela, mesmo rolando:",o:["relative","absolute","fixed","static"],a:2,w:"fixed prende na tela."},{t:"mc",q:"O absolute se posiciona em relação a quem?",o:["Sempre à tela","Ao pai mais próximo com position (como relative)","Ao irmão do lado","Ao body sempre"],a:1,w:"Ao ancestral posicionado mais próximo."},{t:"info",q:"Quem fica por cima: z-index",b:"Quando elementos se sobrepõem, <code>z-index<\/code> decide a ordem: número maior fica por cima. Só funciona em elementos com position diferente de static.",erro:"Colocar z-index: 9999 em tudo pra \"resolver\". Vira uma guerra de números. Use valores pequenos e organizados (1, 10, 100)."},{t:"fill",q:"Menu que gruda no topo ao rolar:",code:".menu {\n  position: ___;\n  top: 0;\n}",o:["sticky","fixed","absolute","relative"],a:["sticky"],w:"sticky + top: 0."},{t:"type",live:1,q:"Deixe o .whats fixo na tela (position: fixed) no canto de baixo à direita",start:"<style>\n  .whats {\n    background: #25d366; color: white; padding: 12px; border-radius: 99px;\n    \n  }\n<\/style>\n<a class=\"whats\">WhatsApp<\/a>",hint:"position: fixed;\nbottom: 16px;\nright: 16px;",check:(d,w)=>{const c=w.getComputedStyle(d.querySelector('.whats'));return c.position==='fixed'&&c.bottom!=='auto'&&c.right!=='auto'},w:"position: fixed;\nbottom: 16px;\nright: 16px;"}]},{n:"Hover e transições",i:"✨",obj:["Usar :hover e :focus","Animar mudanças suaves com transition"],ex:[{t:"info",q:"Pseudo-classes: estados do elemento",b:"Uma pseudo-classe aplica estilo num ESTADO:\n• <code>:hover<\/code>: quando o mouse passa por cima\n• <code>:focus<\/code>: quando o campo está selecionado\n• <code>:first-child<\/code>, <code>:last-child<\/code>: o primeiro ou último filho",code:"<button class=\"b\">Passe o mouse<\/button>\n<style>\n  .b { background: #1F6FEB; color: white; border: 0; padding: 12px 18px; border-radius: 10px; }\n  .b:hover { background: #E63946; }\n<\/style>",show:true,tip:"No celular não existe \"passar o mouse\". Use :hover como enfeite, nunca pra esconder algo importante."},{t:"mc",q:"Estilo quando o mouse passa por cima:",o:[":click",":hover",":mouse",":over"],a:1,w:":hover"},{t:"info",q:"Transição: a mudança suave",ana:"Sem transition, a mudança é como acender a luz no interruptor. Com transition, é como um dimmer: vai devagar.",b:"<code>transition<\/code> diz QUAL propriedade anima e em QUANTO tempo.",code:"<button class=\"b2\">Passe o mouse<\/button>\n<style>\n  .b2 { background: #1F6FEB; color: white; border: 0; padding: 12px 18px; border-radius: 10px; transition: background .4s, transform .2s; }\n  .b2:hover { background: #E63946; transform: scale(1.05); }\n<\/style>",show:true,erro:"Colocar o transition só no :hover. Aí anima pra ida, mas a volta é seca. Coloque no estado normal."},{t:"fill",q:"Anime a cor do fundo em 0.3 segundos:",code:"transition: ___ .3s;",o:["background","hover","color-change","all-time"],a:["background"],w:"transition: background .3s;"},{t:"mc",q:"Onde colocar o transition?",o:["No :hover","No estado normal do elemento","No body","No HTML"],a:1,w:"No estado normal, assim anima na ida e na volta."},{t:"type",live:1,q:"Faça o .link ficar vermelho (red) no :hover",start:"<style>\n  .link { color: blue; }\n  \n<\/style>\n<a class=\"link\">Passe o mouse<\/a>",hint:".link:hover { color: red; }",check:(d,w)=>{for(const sh of d.styleSheets){for(const r of sh.cssRules){if(r.selectorText&&/\.link:hover/.test(r.selectorText)&&/red|255, 0, 0|#f00/i.test(r.style.color))return true}}return false},w:".link:hover {\n  color: red;\n}"}]},{n:"Animações",i:"🎞️",obj:["Usar transform","Criar animações com @keyframes","Respeitar quem prefere menos movimento"],ex:[{t:"info",q:"transform: mover, girar, aumentar",b:"<code>transform<\/code> mexe no elemento sem empurrar os vizinhos:\n• <code>translateY(-10px)<\/code>: move 10px pra cima\n• <code>rotate(15deg)<\/code>: gira\n• <code>scale(1.2)<\/code>: aumenta 20%",code:"<div class=\"q\"><\/div>\n<style>\n  .q { width: 60px; height: 60px; background: #FFC21A; border-radius: 12px; transform: rotate(15deg) scale(1.2); margin: 20px; }\n<\/style>",show:true},{t:"info",q:"@keyframes: animação que roda sozinha",ana:"É como um desenho animado: você define os quadros principais (início, meio, fim) e o navegador desenha o movimento entre eles.",b:"1. Crie a animação com <code>@keyframes nome<\/code>\n2. Aplique com <code>animation: nome duração<\/code>",code:"<div class=\"bola\"><\/div>\n<style>\n  .bola { width: 40px; height: 40px; border-radius: 50%; background: #E63946; animation: pula 1s ease-in-out infinite; margin: 30px; }\n  @keyframes pula { 50% { transform: translateY(-24px); } }\n<\/style>",show:true,tip:"infinite faz repetir pra sempre. ease-in-out deixa o movimento natural, acelerando e freando."},{t:"mc",q:"O que infinite faz na animação?",o:["Deixa mais rápida","Repete pra sempre","Faz girar","Para a animação"],a:1,w:"Repete sem parar."},{t:"fill",q:"Crie a animação chamada brilho:",code:"___ brilho {\n  50% { opacity: .5; }\n}",o:["@keyframes","@animation","@frames","@motion"],a:["@keyframes"],w:"@keyframes nome { ... }"},{t:"info",q:"Animação com responsabilidade",b:"Algumas pessoas sentem enjoo ou tontura com muito movimento. O sistema delas pode pedir \"reduzir movimento\", e você respeita assim:",code:"@media (prefers-reduced-motion: reduce) {\n  .bola { animation: none; }\n}",erro:"Colocar animação em tudo. Use uma ou duas, com propósito. Movimento demais cansa e parece amador."},{t:"type",live:1,q:"Aplique a animação gira (já criada) no .icone, com 2s e infinite",start:"<style>\n  @keyframes gira { to { transform: rotate(360deg); } }\n  .icone {\n    \n  }\n<\/style>\n<div class=\"icone\">⚙️<\/div>",hint:"animation: gira 2s linear infinite;",check:(d,w)=>{const c=w.getComputedStyle(d.querySelector('.icone'));return c.animationName==='gira'&&c.animationIterationCount==='infinite'},w:".icone {\n  animation: gira 2s linear infinite;\n}"}]}]}]},

{id:'js',cat:'prog',nome:'JavaScript',icone:'⚡',cor:'#ffd53d',sub:'A lógica que dá vida',nivel:'Iniciante → Intermediário',req:'css',meta:'Criar interatividade: guardar informações, tomar decisões, reagir a cliques e mudar a página. É a base pra criar sistemas.',units:[
{u:'Unidade 1',t:'Lógica de programação',l:[
 {n:'O que é JavaScript',i:'⚡',obj:['Entender o papel do JS','Onde escrever','Usar o console pra ver o que acontece'],ex:[
  {t:'info',q:'A camada do comportamento',ana:'Num carro: o HTML é a lataria, o CSS é a pintura, e o JavaScript é o motor. É ele que faz as coisas acontecerem.',b:'<b>JavaScript</b> é uma linguagem de <b>programação</b> de verdade. Com ela, um botão faz algo quando você clica, um formulário calcula um valor ou uma lista aparece na tela.',code:'<button onclick="this.textContent=\'Você clicou!\'">Clique aqui</button>',show:true,tip:'Toque no botão do exemplo: isso é JavaScript funcionando.'},
  {t:'mc',q:'Qual parte do site cuida do COMPORTAMENTO?',o:['HTML','CSS','JavaScript','Imagens'],a:2,w:'JS é quem age: cliques, cálculos, mudanças.'},
  {t:'info',q:'Onde escrever e onde ver',b:'O JS fica dentro de <code>&lt;script&gt;</code>, normalmente no fim do body.\n\n<code>console.log()</code> mostra mensagens num painel escondido do navegador: aperte <b>F12</b> e vá na aba <b>Console</b>. É ali que você vê valores e erros.',code:'<script>\n  console.log("Olá!");\n<\/script>',tip:'Programador não adivinha: ele usa console.log pra ver o que está acontecendo.',erro:'Colocar o script no head e tentar mexer num botão que ainda nem foi criado. Coloque o script no fim do body.'},
  {t:'mc',q:'Em qual tag escrevemos JS no HTML?',o:['<js>','<code>','<script>','<style>'],a:2,w:'<script>. O <style> é pro CSS.'},
  {t:'fill',q:'Mostre "oi" no console:',code:'console.___("oi");',o:['log','print','show','write'],a:['log'],w:'console.log() mostra mensagens no console.'},
  {t:'mc',q:'Cada instrução em JS normalmente termina com:',o:[',',';','.',':'],a:1,w:'Ponto e vírgula, igual no CSS.'}
 ]},
 {n:'Variáveis',i:'📦',obj:['Guardar valores','Diferenciar let e const','Conhecer os tipos básicos'],ex:[
  {t:'info',q:'Caixinhas com nome',ana:'Pense em potes com etiqueta na cozinha: "açúcar", "sal". A etiqueta é o nome da variável, e o que está dentro é o valor.',b:'Variáveis guardam valores pra usar depois.\n• <code>let</code>: o valor pode mudar\n• <code>const</code>: o valor não muda\n\nO <code>=</code> aqui não é "igual": é "guarde isso dentro".',code:'const nome = "Fabiano";\nlet clientes = 3;\nclientes = 4; // mudou, porque é let',tip:'Regra de bolso: comece com const. Só troque pra let se precisar mudar o valor depois.'},
  {t:'mc',q:'Qual NÃO pode ter o valor alterado depois?',o:['let','const','var','nenhuma'],a:1,w:'const = constante.'},
  {t:'info',q:'Os tipos de valor',b:'• <b>string</b> (texto): sempre entre aspas → <code>"Ana"</code>\n• <b>number</b> (número): sem aspas → <code>25</code>\n• <b>boolean</b> (verdadeiro/falso): <code>true</code> ou <code>false</code>',erro:'Escrever "25" com aspas achando que é número. Com aspas é texto, e a conta dá resultado estranho.'},
  {t:'mc',q:'"25" (com aspas) é de que tipo?',o:['number','string','boolean','variável'],a:1,w:'Com aspas é texto (string), mesmo sendo número.'},
  {t:'fill',q:'Crie uma variável que pode mudar:',code:'___ pontos = 0;',o:['let','const','set','int'],a:['let'],w:'let permite mudar depois.'},
  {t:'type',live:1,q:'Crie uma const chamada preco com o valor 100 (número, sem aspas)',start:'<script>\n  \n<\/script>',hint:'const preco = 100;',check:(d,w)=>{try{return w.eval('preco')===100}catch(e){return false}},w:'const preco = 100;'}
 ]},
 {n:'Operações',i:'➕',obj:['Fazer contas','Juntar textos','Usar template strings'],ex:[
  {t:'info',q:'Contas',b:'Operadores: <code>+</code> soma, <code>-</code> subtrai, <code>*</code> multiplica, <code>/</code> divide.\n\nVocê pode fazer contas com variáveis, igual na matemática.',code:'const preco = 600;\nconst parcelas = 3;\nconst valorParcela = preco / parcelas; // 200'},
  {t:'info',q:'Montando textos',ana:'Template string é como uma mensagem com espaços em branco pra completar: "Olá, ____!". O JS completa os espaços com o valor das variáveis.',b:'Com textos, o <code>+</code> <b>junta</b>. Mas o jeito moderno é usar <b>crases</b> <code>`</code> e colocar a variável dentro de <code>${ }</code>.',code:'const nome = "Ana";\nconst msg = `Olá, ${nome}! Tudo bem?`;\n// "Olá, Ana! Tudo bem?"',tip:'É assim que o painel monta a mensagem do WhatsApp com o nome de cada cliente.',erro:'Usar aspas normais com ${}. Só funciona com crase: ` (fica perto do Enter ou do 1 no teclado).'},
  {t:'mc',q:'Quanto dá "2" + "2"?',o:['4','"22"','Erro','"4"'],a:1,w:'Com aspas são textos: o + junta e vira "22".'},
  {t:'fill',q:'Monte o texto com o nome:',code:'const msg = `Oi, ___{nome}!`;',o:['$','#','@','%'],a:['$'],w:'Dentro da crase: ${variavel}.'},
  {t:'mc',q:'Qual operador multiplica?',o:['x','*','×','#'],a:1,w:'Asterisco * multiplica.'},
  {t:'type',live:1,q:'Crie const total que seja 10 vezes 3',start:'<script>\n  \n<\/script>',hint:'const total = 10 * 3;',check:(d,w)=>{try{return w.eval('total')===30}catch(e){return false}},w:'const total = 10 * 3;'}
 ]},
 {n:'Condições',i:'🔀',obj:['Tomar decisões com if/else','Comparar valores','Usar else if'],ex:[
  {t:'info',q:'Se isso, faça aquilo',ana:'É como um porteiro: "SE tiver convite, pode entrar. SENÃO, fica fora."',b:'<code>if</code> executa algo só se a condição for verdadeira. <code>else</code> é o "senão".\n\nComparações: <code>===</code> igual, <code>!==</code> diferente, <code>&gt;</code> maior, <code>&lt;</code> menor, <code>&gt;=</code> maior ou igual.',code:'const hora = 14;\nif (hora < 12) {\n  console.log("Bom dia");\n} else {\n  console.log("Boa tarde");\n}',tip:'Use sempre === (três iguais) pra comparar.',erro:'Usar um = só dentro do if. Um = GUARDA valor; três === COMPARAM.'},
  {t:'mc',q:'Qual compara se dois valores são IGUAIS?',o:['=','===','=>','!='],a:1,w:'Um = guarda valor. === compara.'},
  {t:'info',q:'Mais de dois caminhos: else if',b:'Quando tem mais opções, encadeie com <code>else if</code>. O JS testa de cima pra baixo e para no primeiro verdadeiro.',code:'if (hora < 12) {\n  msg = "Bom dia";\n} else if (hora < 18) {\n  msg = "Boa tarde";\n} else {\n  msg = "Boa noite";\n}'},
  {t:'build',q:'Monte o começo de um if:',o:['if','(nota >= 7)','{','}','else'],a:['if','(nota >= 7)','{','}'],w:'if (condição) { ... }'},
  {t:'mc',q:'Se hora for 20, o código acima guarda:',o:['Bom dia','Boa tarde','Boa noite','Nada'],a:2,w:'20 não é < 12 nem < 18, então cai no else: Boa noite.'},
  {t:'type',live:1,q:'Se nota for >= 7, deixe aprovado = true',start:'<script>\n  const nota = 8;\n  let aprovado = false;\n  \n<\/script>',hint:'if (nota >= 7) {\n  aprovado = true;\n}',check:(d,w)=>{try{return w.eval('aprovado')===true}catch(e){return false}},w:'if (nota >= 7) {\n  aprovado = true;\n}'}
 ]}
]},
{u:'Unidade 2',t:'Interagindo com a página',l:[
 {n:'Funções',i:'🧩',obj:['Criar funções','Usar parâmetros e return','Saber quando criar uma função'],ex:[
  {t:'info',q:'Receitas reutilizáveis',ana:'Uma função é como uma receita de bolo: você escreve uma vez e usa sempre que quiser. Os ingredientes são os parâmetros, e o bolo pronto é o return.',b:'Uma <b>função</b> é um bloco de código com nome, que você chama quando quiser. Pode receber <b>parâmetros</b> e devolver um resultado com <code>return</code>.',code:'function soma(a, b) {\n  return a + b;\n}\n\nsoma(2, 3); // 5\nsoma(10, 5); // 15',tip:'Se você copia e cola o mesmo código 2 vezes, provavelmente ele deveria virar uma função.'},
  {t:'mc',q:'O que o return faz?',o:['Repete a função','Devolve um resultado','Apaga a função','Volta pro início'],a:1,w:'return entrega o resultado pra quem chamou.'},
  {t:'fill',q:'Complete a função:',code:'___ dobro(n) {\n  return n * 2;\n}',o:['function','func','def','let'],a:['function'],w:'Funções começam com function.'},
  {t:'info',q:'Criar x chamar',b:'Escrever <code>function soma(a, b) {...}</code> só <b>cria</b> a receita. Nada acontece ainda.\n\nPra usar, você <b>chama</b>: <code>soma(2, 3)</code>, com parênteses e os valores.',erro:'Criar a função e esquecer de chamar. O código está certo, mas nunca roda.'},
  {t:'mc',q:'Em soma(2, 3), o que são 2 e 3?',o:['Variáveis globais','Argumentos (valores passados)','Funções','Erros'],a:1,w:'São os valores que entram nos parâmetros a e b.'},
  {t:'type',live:1,q:'Crie a função dobro(n) que devolve n * 2',start:'<script>\n  \n<\/script>',hint:'function dobro(n) {\n  return n * 2;\n}',check:(d,w)=>{try{return typeof w.dobro==='function'&&w.dobro(4)===8}catch(e){return false}},w:'function dobro(n) {\n  return n * 2;\n}'}
 ]},
 {n:'Listas (arrays)',i:'📚',obj:['Guardar vários valores','Acessar itens','Percorrer listas'],ex:[
  {t:'info',q:'Vários valores numa variável',ana:'Pense numa fila numerada de armários. Cada armário tem um número, e o primeiro é o número 0.',b:'Arrays guardam listas entre <code>[ ]</code>. A contagem começa no <b>0</b>.\n• <code>.length</code>: quantos itens\n• <code>.push()</code>: adiciona no fim',code:'const servicos = ["Limpeza", "Clareamento"];\nservicos.push("Implante");\nservicos[0];      // "Limpeza"\nservicos.length;  // 3',tip:'A lista de clientes do seu painel é um array por baixo.',erro:'Achar que o primeiro item é o [1]. O primeiro é o [0]!'},
  {t:'mc',q:'Em ["a","b","c"], qual é a posição do "a"?',o:['1','0','-1','a'],a:1,w:'Arrays começam no 0.'},
  {t:'fill',q:'Adicione um item no fim:',code:'lista.___("novo");',o:['push','add','append','insert'],a:['push'],w:'push coloca no final.'},
  {t:'info',q:'Passando por cada item',b:'Pra fazer algo com CADA item, use <code>for...of</code>. Ele repete o bloco uma vez pra cada item da lista.',code:'<ul id="lista"></ul>\n<script>\n  const servicos = ["Limpeza", "Clareamento", "Implante"];\n  for (const s of servicos) {\n    document.querySelector("#lista").innerHTML += "<li>" + s + "</li>";\n  }\n<\/script>',show:true,tip:'Repare: 3 itens no array, 3 itens na tela. O for fez o trabalho repetitivo.'},
  {t:'mc',q:'Como saber quantos itens tem?',o:['lista.size','lista.length','lista.count()','lista.total'],a:1,w:'.length'},
  {t:'type',live:1,q:'Crie const frutas com 3 frutas',start:'<script>\n  \n<\/script>',hint:'const frutas = ["maçã", "uva", "pera"];',check:(d,w)=>{try{const f=w.eval('frutas');return Array.isArray(f)&&f.length>=3}catch(e){return false}},w:'const frutas = ["maçã", "uva", "pera"];'}
 ]},
 {n:'Mexendo na página',i:'🛠️',obj:['Pegar elementos com JS','Mudar texto e estilo','Mostrar e esconder coisas'],ex:[
  {t:'info',q:'O DOM',ana:'O DOM é como um controle remoto da página. Com ele, o JavaScript aponta pra qualquer elemento e muda o que quiser.',b:'• <code>document.querySelector(".classe")</code> pega o primeiro elemento que bate\n• <code>.textContent</code> muda o texto\n• <code>.style.color</code> muda o estilo',code:'<h1 id="titulo">Oi</h1>\n<script>\n  const t = document.querySelector("#titulo");\n  t.textContent = "Texto trocado pelo JS";\n  t.style.color = "green";\n<\/script>',show:true,tip:'querySelector aceita os mesmos seletores do CSS: tag, .classe e #id.'},
  {t:'mc',q:'Como pegar o elemento com id="preco"?',o:['document.querySelector("#preco")','document.get("preco")','page.preco','select(preco)'],a:0,w:'querySelector com # pra id.'},
  {t:'fill',q:'Troque o texto do elemento:',code:'el.___ = "Olá";',o:['textContent','text','value','write'],a:['textContent'],w:'textContent muda o texto.'},
  {t:'info',q:'Mostrar e esconder',b:'O jeito mais limpo é trocar uma classe com <code>classList.toggle()</code>: se tem, tira; se não tem, coloca. O CSS da classe faz o resto.',code:'.escondido { display: none; }\n\nmenu.classList.toggle("escondido");',erro:'Escrever o nome da classe com ponto no JS: toggle(".escondido"). No classList é sem ponto.'},
  {t:'type',live:1,q:'Mude o texto do h1 pra Tchau',start:'<h1 id="titulo">Oi</h1>\n<script>\n  \n<\/script>',hint:'document.querySelector("#titulo").textContent = "Tchau";',check:d=>/tchau/i.test(d.querySelector('h1').textContent),w:'document.querySelector("#titulo").textContent = "Tchau";'}
 ]},
 {n:'Cliques e eventos',i:'🖱️',obj:['Reagir a cliques','Juntar tudo: DOM + função + evento','Fazer um contador'],ex:[
  {t:'info',q:'Fazendo o botão funcionar',ana:'É como uma campainha: você instala ela (addEventListener) e diz o que acontece quando alguém aperta.',b:'<code>addEventListener</code> "escuta" um evento e roda uma função quando ele acontece. O mais comum é o <code>"click"</code>.',code:'<button>Clique</button>\n<script>\n  const btn = document.querySelector("button");\n  btn.addEventListener("click", function () {\n    btn.textContent = "Clicou!";\n  });\n<\/script>',show:true,tip:'Toque no botão do exemplo. Esse padrão (pegar, escutar, mudar) é a base de qualquer sistema web.'},
  {t:'mc',q:'Qual evento acontece quando a pessoa clica?',o:['"press"','"click"','"tap"','"push"'],a:1,w:'"click"'},
  {t:'info',q:'Juntando tudo: um contador',b:'Uma variável guarda o número, o clique soma 1, e o texto mostra o valor novo. Três ideias juntas: variável + evento + DOM.',code:'<button id="b">+1</button> <b id="n">0</b>\n<script>\n  let total = 0;\n  document.querySelector("#b").addEventListener("click", function () {\n    total = total + 1;\n    document.querySelector("#n").textContent = total;\n  });\n<\/script>',show:true},
  {t:'build',q:'Monte o "escutador" de clique:',o:['btn','.addEventListener(','"click"',', mudar)','.onClick('],a:['btn','.addEventListener(','"click"',', mudar)'],w:'btn.addEventListener("click", mudar)'},
  {t:'type',live:1,click:1,q:'Faça o botão mudar o texto do <p> pra Funcionou ao clicar',start:'<button>Clique</button>\n<p id="msg">...</p>\n<script>\n  const btn = document.querySelector("button");\n  \n<\/script>',hint:'btn.addEventListener("click", function () {\n  document.querySelector("#msg").textContent = "Funcionou";\n});',check:d=>{d.querySelector('button').click();return /funcionou/i.test(d.querySelector('#msg').textContent)},w:'btn.addEventListener("click", function () {\n  document.querySelector("#msg").textContent = "Funcionou";\n});'}
 ]},
 {n:'Revisão de JavaScript',i:'🏆',obj:['Revisar o curso de JavaScript'],ex:[
  {t:'mc',q:'let x const:',o:['const muda, let não','let muda, const não','os dois mudam','nenhum muda'],a:1,w:'let muda, const não.'},
  {t:'mc',q:'Primeira posição de um array:',o:['1','0','primeiro','-1'],a:1,w:'0.'},
  {t:'mc',q:'Pra pegar um elemento da página:',o:['console.log','document.querySelector','function','return'],a:1,w:'document.querySelector.'},
  {t:'mc',q:'Qual texto está certo pra montar a mensagem?',o:['"Oi, ${nome}"','`Oi, ${nome}`','\'Oi, ${nome}\'','Oi + {nome}'],a:1,w:'Só a crase entende o ${ }.'},
  {t:'type',live:1,q:'Desafio! Função saudacao(nome) que devolve `Olá, ${nome}!`',start:'<script>\n  \n<\/script>',hint:'function saudacao(nome) {\n  return `Olá, ${nome}!`;\n}',check:(d,w)=>{try{return w.saudacao('Ana')==='Olá, Ana!'}catch(e){return false}},w:'function saudacao(nome) {\n  return `Olá, ${nome}!`;\n}'}
 ]}
]},
{u:"Unidade 3",t:"JavaScript intermediário",l:[{n:"Objetos",i:"🗂️",obj:["Agrupar dados com objetos","Ler e mudar propriedades","Listas de objetos"],ex:[{t:"info",q:"Uma ficha com vários campos",ana:"Um objeto é como uma ficha de cadastro: cada campo tem um nome (nome, idade, cidade) e um valor.",b:"Objetos ficam entre <code>{ }<\/code>, com pares <code>chave: valor<\/code>. Você lê com ponto: <code>pessoa.nome<\/code>.",code:"const pessoa = {\n  nome: \"Ana\",\n  idade: 28,\n  cidade: \"Florianópolis\"\n};\npessoa.nome;    // \"Ana\"\npessoa.idade = 29; // mudou",tip:"Array guarda uma LISTA. Objeto guarda uma FICHA. Muito comum é uma lista de fichas: um array de objetos."},{t:"mc",q:"Como ler a cidade do objeto pessoa?",o:["pessoa[cidade]","pessoa.cidade","cidade.pessoa","pessoa->cidade"],a:1,w:"objeto.chave"},{t:"info",q:"Lista de objetos",b:"É assim que quase todo sistema guarda dados: um array de objetos.",code:"<ul id=\"l\"><\/ul>\n<script>\n  const produtos = [\n    { nome: \"Café\", preco: 8 },\n    { nome: \"Pão de queijo\", preco: 6 }\n  ];\n  for (const p of produtos) {\n    document.querySelector(\"#l\").innerHTML += `<li>${p.nome}: R$ ${p.preco}<\/li>`;\n  }\n<\/script>",show:true,erro:"Esquecer a vírgula entre as propriedades: { nome: \"Café\" preco: 8 }. Dá erro e nada funciona."},{t:"fill",q:"Complete o objeto:",code:"const carro = { marca___ \"Fiat\", ano: 2020 };",o:[":","=","->",";"],a:[":"],w:"Chave e valor separados por dois pontos."},{t:"mc",q:"produtos[1].nome no exemplo acima é:",o:["\"Café\"","\"Pão de queijo\"","6","undefined"],a:1,w:"Posição 1 é o segundo item."},{t:"type",live:1,q:"Crie const livro com titulo (texto) e paginas (número)",start:"<script>\n  \n<\/script>",hint:"const livro = { titulo: \"Dom Casmurro\", paginas: 256 };",check:(d,w)=>{try{const l=w.eval('livro');return typeof l.titulo==='string'&&typeof l.paginas==='number'}catch(e){return false}},w:"const livro = { titulo: \"Dom Casmurro\", paginas: 256 };"}]},{n:"map, filter e arrow functions",i:"🔁",obj:["Escrever funções curtas (arrow)","Transformar listas com map","Filtrar listas com filter"],ex:[{t:"info",q:"Arrow function: a função curta",b:"Um jeito mais curto de escrever funções:",code:"function dobro(n) { return n * 2; }\n\nconst dobro2 = n => n * 2;   // mesma coisa",tip:"Com um parâmetro, dispensa os parênteses. Com uma linha só, dispensa as chaves e o return."},{t:"info",q:"map: transforma cada item",ana:"map é uma máquina de suco: entram laranjas, saem copos de suco. Uma coisa entra, outra sai, na mesma quantidade.",b:"<code>map<\/code> cria uma NOVA lista aplicando uma função em cada item.",code:"const precos = [10, 20, 30];\nconst comDesconto = precos.map(p => p * 0.9);\n// [9, 18, 27]"},{t:"info",q:"filter: fica só com alguns",ana:"filter é uma peneira: só passa o que atende à condição.",b:"<code>filter<\/code> cria uma nova lista só com os itens em que a função devolve true.",code:"const idades = [12, 18, 25, 15];\nconst adultos = idades.filter(i => i >= 18);\n// [18, 25]",erro:"Achar que map ou filter mudam a lista original. Eles criam uma lista NOVA: guarde o resultado numa variável."},{t:"mc",q:"[1, 2, 3].map(n => n + 1) dá:",o:["[1, 2, 3]","[2, 3, 4]","6","[2]"],a:1,w:"Soma 1 em cada item."},{t:"mc",q:"Pra ficar só com os produtos acima de R$ 50, use:",o:["map","filter","push","length"],a:1,w:"Selecionar alguns itens: filter."},{t:"type",live:1,q:"Crie const pares com só os números pares de nums (use filter e n % 2 === 0)",start:"<script>\n  const nums = [1, 2, 3, 4, 5, 6];\n  \n<\/script>",hint:"const pares = nums.filter(n => n % 2 === 0);",check:(d,w)=>{try{return JSON.stringify(w.eval('pares'))==='[2,4,6]'}catch(e){return false}},w:"const pares = nums.filter(n => n % 2 === 0);"}]},{n:"Guardando dados",i:"💾",obj:["Salvar dados no navegador","Usar JSON pra guardar objetos","Recuperar ao abrir de novo"],ex:[{t:"info",q:"localStorage: a gaveta do navegador",ana:"É uma gaveta que fica no navegador da pessoa. Você guarda algo hoje e, quando ela voltar amanhã, ainda está lá.",b:"• <code>localStorage.setItem(\"chave\", \"valor\")<\/code>: guarda\n• <code>localStorage.getItem(\"chave\")<\/code>: pega\n• <code>localStorage.removeItem(\"chave\")<\/code>: apaga",code:"localStorage.setItem(\"nome\", \"Ana\");\nlocalStorage.getItem(\"nome\"); // \"Ana\"",tip:"Fica só naquele navegador, naquele aparelho. Não é um banco de dados na nuvem."},{t:"mc",q:"Qual comando GUARDA um valor?",o:["localStorage.getItem","localStorage.setItem","localStorage.save","storage.put"],a:1,w:"setItem guarda, getItem pega."},{t:"info",q:"JSON: transformando objetos em texto",b:"O localStorage só guarda TEXTO. Pra guardar um objeto ou lista, transforme em texto com <code>JSON.stringify<\/code> e volte com <code>JSON.parse<\/code>.",code:"const tarefas = [\"Estudar\", \"Treinar\"];\nlocalStorage.setItem(\"t\", JSON.stringify(tarefas));\n\nconst voltou = JSON.parse(localStorage.getItem(\"t\"));",erro:"Guardar o objeto direto: setItem(\"t\", tarefas). Ele vira o texto \"[object Object]\" e você perde os dados."},{t:"fill",q:"Transforme o objeto em texto pra guardar:",code:"localStorage.setItem(\"p\", JSON.___(pessoa));",o:["stringify","parse","text","save"],a:["stringify"],w:"stringify vira texto. parse volta pra objeto."},{t:"mc",q:"Pra transformar o texto guardado de volta em objeto:",o:["JSON.stringify","JSON.parse","toObject","eval"],a:1,w:"JSON.parse."}]},{n:"Projeto: lista de tarefas",i:"✅",obj:["Juntar tudo num mini app","Adicionar itens com um clique","Pensar como programador: passo a passo"],ex:[{t:"info",q:"Pensando como programador",b:"Antes de escrever código, quebre o problema em passos:\n1. Quando clicar no botão...\n2. pegue o texto do campo\n3. crie um item na lista\n4. limpe o campo\n\nCada passo vira uma ou duas linhas de código.",tip:"Esse jeito de pensar (quebrar em passos pequenos) serve pra qualquer programa, de uma calculadora a um painel de clientes."},{t:"info",q:"O código completo",b:"Leia com calma, linha por linha. Cada parte é algo que você já aprendeu:",code:"<input id=\"campo\" placeholder=\"Nova tarefa\">\n<button id=\"add\">Adicionar<\/button>\n<ul id=\"lista\"><\/ul>\n<script>\n  document.querySelector(\"#add\").addEventListener(\"click\", () => {\n    const campo = document.querySelector(\"#campo\");\n    if (campo.value.trim() === \"\") return;\n    const li = document.createElement(\"li\");\n    li.textContent = campo.value;\n    document.querySelector(\"#lista\").appendChild(li);\n    campo.value = \"\";\n  });\n<\/script>",show:true},{t:"mc",q:"O que a linha if (campo.value.trim() === \"\") return; faz?",o:["Apaga a lista","Não deixa adicionar tarefa vazia","Salva no localStorage","Muda a cor"],a:1,w:"Se o campo estiver vazio, para ali e não adiciona nada."},{t:"mc",q:"Qual comando coloca o novo li dentro da lista?",o:["appendChild","createElement","textContent","querySelector"],a:0,w:"appendChild adiciona o elemento como filho."},{t:"build",q:"Monte a ordem dos passos:",o:["pegar o texto","criar o li","colocar na lista","limpar o campo"],a:["pegar o texto","criar o li","colocar na lista","limpar o campo"],w:"Pegar, criar, colocar, limpar."},{t:"type",live:1,click:1,q:"Complete: ao clicar, adicione um <li> com o texto do campo na lista",start:"<input id=\"campo\" value=\"Estudar JS\">\n<button id=\"add\">Adicionar<\/button>\n<ul id=\"lista\"><\/ul>\n<script>\n  document.querySelector(\"#add\").addEventListener(\"click\", () => {\n    \n  });\n<\/script>",hint:"const li = document.createElement(\"li\");\nli.textContent = document.querySelector(\"#campo\").value;\ndocument.querySelector(\"#lista\").appendChild(li);",check:d=>{d.querySelector('#add').click();const li=d.querySelector('#lista li');return !!li&&/estudar/i.test(li.textContent)},w:"const li = document.createElement(\"li\");\nli.textContent = document.querySelector(\"#campo\").value;\ndocument.querySelector(\"#lista\").appendChild(li);"}]}]}]},

{id:'edit',cat:'prog',nome:'Editando sites',icone:'🔧',cor:'#22e57a',sub:'Na prática, pro seu trabalho',nivel:'Prático',req:'html',meta:'Abrir um site pronto (como os do VitrineAI), achar o que precisa mudar e editar textos, links, cores e imagens com segurança.',units:[
{u:'Unidade 1',t:'Mão na massa',l:[
 {n:'Inspecionando um site',i:'🔍',obj:['Usar o Inspecionar do navegador','Achar qualquer elemento no código','Testar mudanças sem medo'],ex:[
  {t:'info',q:'O raio-x do navegador',ana:'É como o raio-x do dentista: você vê por dentro sem precisar abrir nada.',b:'Em qualquer site, clique com o botão direito e escolha <b>Inspecionar</b> (ou aperte <b>F12</b>).\n\n• Aba <b>Elements</b>: o HTML\n• Painel <b>Styles</b>, ao lado: o CSS do elemento escolhido\n• O ícone de setinha no canto: clique nele e depois em qualquer parte do site pra achar o código daquela parte',tip:'Dá pra mudar texto e cor ali mesmo, pra testar. Mas a mudança some ao recarregar.'},
  {t:'mc',q:'Qual tecla abre as ferramentas de desenvolvedor?',o:['F5','F12','Ctrl+S','Esc'],a:1,w:'F12 (ou botão direito > Inspecionar).'},
  {t:'mc',q:'Você mudou a cor pelo Inspecionar e recarregou a página. O que acontece?',o:['A mudança fica salva','A mudança some','O site quebra','Muda pra todo mundo'],a:1,w:'O Inspecionar só testa. Pra valer, tem que editar o arquivo.'},
  {t:'info',q:'Achando o texto no arquivo',b:'Pra editar de verdade, abra o <code>index.html</code> no <b>VS Code</b> e use <b>Ctrl+F</b> pra buscar o texto que você quer mudar. Ele te leva direto ao lugar certo.\n\nE <b>Ctrl+H</b> troca um texto por outro em todo o arquivo.',tip:'Nos sites do VitrineAI, os textos editáveis têm data-edit="..." do lado. Buscar por data-edit te mostra todos de uma vez.',erro:'Usar Ctrl+H e clicar em "substituir tudo" sem olhar. Às vezes a palavra aparece num lugar que não devia mudar.'},
  {t:'mc',q:'Qual o jeito mais rápido de achar um texto num arquivo grande?',o:['Ler o arquivo todo','Ctrl+F e buscar','Apagar tudo','Inspecionar'],a:1,w:'Ctrl+F buscando o texto exato.'},
  {t:'mc',q:'Pra trocar o nome da clínica em 15 lugares de uma vez:',o:['Ctrl+H (substituir)','Ctrl+Z','F12','Reescrever tudo'],a:0,w:'Ctrl+H substitui em todo o arquivo. Confira antes de confirmar.'}
 ]},
 {n:'Trocando textos e links',i:'✏️',obj:['Editar textos sem quebrar tags','Montar links de WhatsApp certos','Fazer backup antes'],ex:[
  {t:'info',q:'Troque só o que está ENTRE as tags',ana:'É como trocar a foto de um porta-retrato: você troca a foto, não quebra a moldura.',b:'Ao editar, mude só o texto entre <code>&gt;</code> e <code>&lt;</code>. Se apagar um sinal de <code>&lt;</code> ou uma aspa, o layout pode quebrar inteiro.',code:'<h1 data-edit="hero.titulo">Texto antigo</h1>\n\n<h1 data-edit="hero.titulo">Texto novo</h1>',tip:'Antes de editar, faça uma cópia do arquivo (index-backup.html). Se algo quebrar, você volta em segundos.',erro:'Apagar sem querer o > do fim da tag. Tudo depois disso some ou fica estranho.'},
  {t:'mc',q:'Ao trocar um título, o que você muda?',o:['A tag inteira','Só o texto entre as tags','O atributo data-edit','O DOCTYPE'],a:1,w:'Só o conteúdo. Tags e atributos ficam iguais.'},
  {t:'info',q:'Link de WhatsApp certo',b:'Formato: <code>https://wa.me/</code> + <b>55</b> + DDD + número, <b>só números</b>.\n\nPra já vir com mensagem: <code>?text=</code> + a mensagem (espaço vira <code>%20</code>).',code:'<a href="https://wa.me/5548999991234?text=Olá!%20Quero%20agendar">\n  Agendar\n</a>',tip:'Sempre teste o link no seu próprio celular antes de entregar o site.'},
  {t:'mc',q:'Qual link de WhatsApp está CERTO?',o:['https://wa.me/(48) 99999-1234','https://wa.me/5548999991234','wa.me/48-99999-1234','https://whatsapp/48999991234'],a:1,w:'55 + DDD + número, sem espaço, traço ou parênteses.'},
  {t:'mc',q:'O número é (49) 3333-4444, fixo. O que fazer?',o:['Usar no wa.me normal','Confirmar com o cliente se esse número tem WhatsApp','Inventar um celular','Tirar o botão do site'],a:1,w:'Fixo pode não ter WhatsApp. Confirme antes, ou use um link tel: pra ligar.'},
  {t:'type',q:'Crie um botão-link de WhatsApp pro número 48 99999-1234',start:'',hint:'<a href="https://wa.me/5548999991234">Chamar no WhatsApp</a>',check:d=>{const a=d.querySelector('a[href]');return !!a&&/^https:\/\/wa\.me\/5548999991234/.test(a.getAttribute('href'))},w:'<a href="https://wa.me/5548999991234">Chamar no WhatsApp</a>'}
 ]},
 {n:'Trocando cores',i:'🎨',obj:['Achar as cores do site','Usar variáveis CSS','Combinar com a marca do cliente'],ex:[
  {t:'info',q:'Variáveis de cor',ana:'É como o interruptor geral da casa: em vez de trocar lâmpada por lâmpada, você muda num lugar só.',b:'Sites bem feitos guardam as cores principais em <b>variáveis CSS</b>, dentro de <code>:root</code>. Mudando ali, o site inteiro muda.\n\nElas começam com <code>--</code> e são usadas com <code>var()</code>.',code:'<button class="botao">Agendar</button>\n<style>\n  :root { --cor-principal: #0e6e7e; }\n  .botao { background: var(--cor-principal); color: white; border: 0; padding: 12px 18px; border-radius: 10px; }\n</style>',show:true,tip:'Pra combinar com o cliente, pegue a cor do logo dele (conta-gotas) e troque só a variável principal.'},
  {t:'mc',q:'Onde normalmente ficam as variáveis de cor?',o:['No body','No :root','No <title>','No <img>'],a:1,w:':root, no começo do CSS.'},
  {t:'fill',q:'Use a variável no botão:',code:'.botao {\n  background: ___(--cor-principal);\n}',o:['var','use','get','$'],a:['var'],w:'var(--nome-da-variavel).'},
  {t:'info',q:'Escolhendo as cores do cliente',b:'1. Pegue a cor principal do logo ou do Instagram da clínica.\n2. Use ela nos botões e títulos.\n3. Deixe o fundo claro e o texto escuro, pra ficar fácil de ler.\n4. Teste no celular.',erro:'Usar a cor do logo em TUDO, até no fundo. Fica pesado e difícil de ler. A cor principal é pra destacar, não pra pintar tudo.'},
  {t:'type',live:1,q:'Troque a cor principal pra #22e57a',start:'<style>\n  :root {\n    --cor-principal: #0e6e7e;\n  }\n  .botao { background: var(--cor-principal); color: white; padding: 12px; border: 0; }\n</style>\n<button class="botao">Agendar</button>',hint:'Troque o valor da variável: --cor-principal: #22e57a;',check:(d,w)=>w.getComputedStyle(d.querySelector('.botao')).backgroundColor==='rgb(34, 229, 122)',w:'--cor-principal: #22e57a;'}
 ]},
 {n:'Imagens e publicação',i:'🚀',obj:['Entender caminhos de imagem','Publicar um site','Conferir tudo antes de entregar'],ex:[
  {t:'info',q:'Por que a imagem some?',b:'O <code>src</code> aponta pra um <b>caminho</b>. <code>assets/foto.jpg</code> quer dizer "a pasta assets, ao lado do index.html".\n\nSe você publicar só o index.html, sem a pasta, as imagens quebram.',code:'<img src="assets/foto.jpg" alt="Consultório">',tip:'Sempre publique a pasta inteira (index.html + assets), ou embuta as imagens no HTML.'},
  {t:'mc',q:'Você subiu só o index.html e as imagens sumiram. Por quê?',o:['O site está fora do ar','Faltou a pasta das imagens','O HTML está errado','As imagens expiraram'],a:1,w:'O src aponta pra uma pasta que não foi junto.'},
  {t:'info',q:'Publicando de graça',b:'Netlify e Vercel publicam sites estáticos de graça. O arquivo principal precisa se chamar <code>index.html</code>, porque é ele que abre quando alguém entra no endereço.'},
  {t:'mc',q:'Qual nome o arquivo principal precisa ter?',o:['site.html','home.html','index.html','principal.html'],a:2,w:'index.html é o que abre por padrão.'},
  {t:'info',q:'Checklist antes de mandar pro cliente',b:'✅ Nome, endereço e horário certos\n✅ Botão de WhatsApp abre o número certo\n✅ Todas as imagens aparecem\n✅ Abre bem no celular\n✅ Nada de texto de exemplo esquecido ("Lorem ipsum", "Dra. Fulana")',erro:'Mandar a prévia com o telefone de outro cliente ou do modelo. O cliente perde a confiança na hora.'},
  {t:'mc',q:'Antes de editar um site do cliente, o primeiro passo é:',o:['Apagar o CSS','Fazer uma cópia de segurança','Trocar todas as cores','Publicar'],a:1,w:'Backup sempre. Se quebrar, você volta.'}
 ]}
]}]},

{id:'venda',cat:'neg',nome:'Vendas na prática',icone:'🤝',cor:'#E63946',sub:'Do zero: abordar, conversar e fechar',nivel:'Iniciante',meta:'Vender sem vergonha e sem parecer chato: entender o cliente, mostrar valor antes do preço, responder "tá caro" e "vou pensar", e pedir o fechamento com segurança. Feito pra quem nunca vendeu nada.',units:[
{u:'Unidade 1',t:'A cabeça de quem vende',l:[
 {n:'Vender é ajudar',i:'💡',obj:['Entender o que é vender de verdade','Perder o medo de oferecer','Falar do resultado, não da ferramenta'],ex:[
  {t:'info',q:'Se você acha que é ruim de venda, comece aqui',b:'Quase todo mundo que diz "sou péssimo em vendas" está imaginando o vendedor chato: aquele que insiste, fala sem parar e empurra coisa que ninguém quer.\n\nEsse tipo de venda é ruim mesmo. A boa notícia: <b>não é isso que você vai aprender aqui</b>.\n\nA venda que funciona hoje é quase o contrário: você <b>escuta mais do que fala</b>, faz perguntas e só oferece quando faz sentido pro cliente. Isso qualquer pessoa aprende, inclusive quem é tímido.'},
  {t:'info',q:'Vender é resolver um problema',ana:'Pense num dentista bom. Ele não chega empurrando um tratamento. Ele examina, mostra pro paciente onde está o problema e explica o que dá pra fazer. O paciente sai agradecido, e mesmo assim pagou. Isso é vender.',b:'Vender é só isso, em 3 passos:\n1. <b>Descobrir</b> um problema que a pessoa tem\n2. <b>Mostrar</b> que você tem uma solução\n3. <b>Combinar</b> um preço justo por ela\n\nSe a clínica perde pacientes porque ninguém acha ela no Google, e você resolve isso, oferecer não é incomodar. É ajudar.'},
  {t:'mc',q:'Pela explicação, qual é o PRIMEIRO passo de uma venda?',o:['Falar o preço','Descobrir um problema que a pessoa tem','Mandar o portfólio','Dar desconto'],a:1,w:'Antes de oferecer qualquer coisa, você precisa saber qual problema está resolvendo.'},
  {t:'mc',q:'Qual destas atitudes é de um BOM vendedor?',o:['Falar sem parar sobre o produto','Insistir até o cliente aceitar','Fazer perguntas e escutar o cliente','Prometer qualquer coisa pra fechar'],a:2,w:'Bom vendedor pergunta e escuta. É assim que ele descobre o que o cliente precisa.'},
  {t:'info',q:'O cliente não quer um site',b:'Parece estranho, mas é a ideia mais importante do curso.\n\nO dentista <b>não acorda querendo um site</b>. Ele quer:\n• mais pacientes marcando consulta\n• parecer mais profissional que a clínica do lado\n• a secretária perdendo menos tempo respondendo as mesmas perguntas\n\nO site é só o <b>caminho</b> pra isso. Então você fala do <b>resultado</b> (o que ele ganha), não da <b>ferramenta</b> (o site em si).'},
  {t:'info',q:'Ferramenta x resultado: veja a diferença',b:'Mesma coisa, dita de dois jeitos:\n\n<b>Falando da ferramenta</b> (o cliente não liga):\n• "O site é responsivo e feito em HTML"\n• "Tem hospedagem inclusa"\n\n<b>Falando do resultado</b> (o cliente se interessa):\n• "Abre bonito no celular, que é onde os pacientes procuram"\n• "Quem procurar dentista na cidade vai achar a clínica e chamar no WhatsApp"',tip:'Truque rápido: depois de qualquer frase sobre o site, pergunte "e daí? o que o dentista ganha com isso?". A resposta é o que você deve falar.'},
  {t:'mc',q:'Qual frase fala de RESULTADO?',o:['"O site é feito em HTML e CSS"','"Tem hospedagem inclusa"','"Quem procurar dentista na cidade vai achar a clínica e chamar no WhatsApp"','"Uso as melhores tecnologias"'],a:2,w:'Ela diz o que o dentista ganha: pacientes chegando pelo WhatsApp.'},
  {t:'mc',q:'Use o truque do "e daí?": "O site tem botão de WhatsApp." E daí? O que o dentista ganha?',o:['O site fica mais colorido','O paciente chama a clínica com um toque, sem precisar procurar o número','O WhatsApp fica mais rápido','Nada'],a:1,w:'Isso é o resultado: menos esforço pro paciente, mais mensagens chegando pra clínica.'},
  {t:'info',q:'O "não" faz parte, pra todo mundo',b:'Uma coisa que ninguém conta: <b>a maioria das pessoas não responde</b> quando você manda a primeira mensagem. Isso acontece com todo vendedor, até com os melhores.\n\nSe você manda 10 mensagens e 7 não respondem, não quer dizer que você é ruim. Quer dizer que você está no jogo. Venda é <b>volume</b> (falar com bastante gente) e <b>constância</b> (fazer um pouco todo dia).',erro:'Mandar 5 mensagens, receber 2 "não" e concluir que vender não é pra você. Com 5 tentativas ninguém consegue julgar nada.'},
  {t:'mc',q:'Você mandou 10 mensagens e 7 não responderam. O que isso significa?',o:['Que você é ruim de venda','Que vender não é pra você','Que é normal, e o certo é continuar com constância','Que os sites são feios'],a:2,w:'Em abordagem a quem não te conhece, a maioria não responde mesmo. Quem vende é quem continua.'},
  {t:'escreva',q:'Explique em uma frase, com suas palavras, por que um dentista deveria ter um site.',guia:'1. Pense no que o dentista GANHA (pacientes, agenda cheia, parecer profissional)\n2. Não fale de tecnologia\n3. Uma frase só, simples, como se falasse com sua mãe',mod:'Porque muita gente procura dentista no Google antes de marcar, e a clínica que não aparece lá acaba perdendo esses pacientes pra outra.',chk:['Fala do que o dentista GANHA (pacientes, agenda)','Não fala de tecnologia','É curta e fácil de entender']},
  {t:'info',q:'Resumo da lição',b:'• Vender bem é <b>ajudar</b>: descobrir um problema e oferecer a solução\n• O cliente compra <b>resultado</b> (pacientes), não ferramenta (site)\n• Use o truque do <b>"e daí?"</b> pra transformar ferramenta em resultado\n• Muitos "não" e silêncios são normais. O que conta é a constância'}
 ]},
 {n:'Conheça seu cliente',i:'🦷',obj:['Entender a rotina de uma clínica','Saber o que preocupa o dentista','Pesquisar em 2 minutos antes de abordar'],ex:[
  {t:'info',q:'Por que conhecer o cliente muda tudo',ana:'Se você vai dar um presente pra alguém, primeiro descobre do que a pessoa gosta. Mensagem de venda é igual: quanto mais você sabe sobre o cliente, mais certeira ela fica.',b:'Quem entende a rotina do cliente sabe:\n• <b>quando</b> mandar mensagem\n• <b>como</b> escrever (curto ou longo)\n• <b>o que</b> falar (o que importa pra ele)\n\nVamos ver como é o dia de uma clínica.'},
  {t:'info',q:'Um dia na clínica',b:'O dentista passa o dia atendendo, de luva e máscara. Ele <b>não pega no celular</b> entre um paciente e outro.\n\nQuem costuma ver o WhatsApp da clínica é a <b>secretária</b>. Ela atende telefone, confirma consultas, responde paciente... e no meio disso tudo aparece a sua mensagem.\n\nIsso explica por que a resposta demora, por que vem curta, e por que tantas vezes vem um "vou passar pra doutora".',tip:'Mande mensagens curtas, que dá pra ler em 10 segundos. Bons horários: antes das 8h, no almoço (12h às 13h30) ou depois das 18h.'},
  {t:'mc',q:'Em muitas clínicas, quem lê primeiro a sua mensagem no WhatsApp?',o:['Sempre o dentista','A secretária','O contador','Ninguém lê'],a:1,w:'Na maioria das vezes é a secretária. Escreva de um jeito que ela consiga repassar fácil.'},
  {t:'mc',q:'Sabendo que a secretária lê no meio da correria, como deve ser sua mensagem?',o:['Longa e cheia de detalhes técnicos','Curta, clara e fácil de repassar','Um áudio de 3 minutos','Um PDF de 10 páginas'],a:1,w:'Ela tem poucos segundos. Mensagem curta é lida e repassada; mensagem longa fica pra "depois".'},
  {t:'info',q:'O que preocupa um dentista',b:'Quase todo dono de clínica pensa nessas coisas:\n• <b>Agenda</b>: "tem horário vazio essa semana"\n• <b>Concorrência</b>: "abriu outra clínica na rua de baixo"\n• <b>Imagem</b>: "quero que vejam que a clínica é séria e moderna"\n• <b>Tempo</b>: "não tenho tempo pra mexer com internet"\n\nQuando sua mensagem toca numa dessas preocupações, ela chama atenção.'},
  {t:'mc',q:'Uma dentista reclamou: "não tenho tempo pra mexer com essas coisas de internet". Qual preocupação é essa?',o:['Agenda','Concorrência','Tempo','Imagem'],a:2,w:'É a falta de tempo. Por isso é forte dizer "eu cuido de tudo, você só aprova".'},
  {t:'info',q:'A pesquisa de 2 minutos',ana:'Chegar sem pesquisar é como o dentista atender sem olhar o raio-x: ele até pode acertar, mas é sorte.',b:'Antes de mandar mensagem, gaste só 2 minutos olhando:\n\n<b>No Instagram:</b> o nome do dentista, as cores da clínica, os tratamentos que mais aparecem (implante, lente, aparelho...)\n\n<b>No Google:</b> as avaliações (estrelas), se tem site, e se o site funciona bem no celular\n\nCom isso você escreve uma mensagem que mostra que <b>olhou de verdade</b> pra clínica, e não é robô.',erro:'Mandar a mesma mensagem pra todo mundo, começando com "Prezado(a)". Parece spam e vai direto pro esquecimento.'},
  {t:'mc',q:'Qual informação ajuda MAIS a personalizar a mensagem?',o:['O CNPJ da clínica','O nome do dentista e os tratamentos que ele destaca','A cor do carro do dentista','A quantidade de funcionários'],a:1,w:'Nome e especialidade deixam a mensagem pessoal e mostram que você pesquisou.'},
  {t:'info',q:'Transformando a pesquisa em frase',b:'Veja como cada coisa que você achou vira uma frase:\n\n• Achou <b>4,9 estrelas</b> no Google → "Vi que vocês têm ótimas avaliações no Google"\n• Achou <b>muito post de implante</b> → "Vi que vocês são referência em implantes"\n• <b>Não achou site</b> → "mas não encontrei um site pra conhecer a clínica"\n\nRepare: primeiro um <b>elogio sincero</b>, depois a <b>oportunidade</b>. Nunca uma crítica.'},
  {t:'mc',q:'A clínica tem 4,9 estrelas no Google e nenhum site. Qual frase usar?',o:['"Seu Instagram é fraco"','"Vocês têm ótimas avaliações, mas quem procura no Google não acha um site pra conhecer a clínica"','"Todo mundo tem site, menos vocês"','Não comentar nada'],a:1,w:'Elogio sincero + a oportunidade. Sem criticar ninguém.'},
  {t:'build',q:'Monte a frase na ordem certa: elogio primeiro, oportunidade depois.',o:['Vi que vocês têm ótimas avaliações no Google,','mas não encontrei um site','pra conhecer a clínica.'],a:['Vi que vocês têm ótimas avaliações no Google,','mas não encontrei um site','pra conhecer a clínica.'],w:'Começar pelo elogio deixa a pessoa aberta pra ouvir o resto.'},
  {t:'info',q:'Resumo da lição',b:'• Quem lê a mensagem costuma ser a <b>secretária</b>, no meio da correria: escreva curto\n• O dentista se preocupa com <b>agenda, concorrência, imagem e tempo</b>\n• Faça a <b>pesquisa de 2 minutos</b>: Instagram e Google\n• Use o que achou assim: <b>elogio sincero + oportunidade</b>'}
 ]},
 {n:'Valor antes do preço',i:'💎',obj:['Entender a diferença entre preço e valor, com calma','Saber em que momento falar o preço','Mostrar que o site se paga, sem prometer o que não controla'],ex:[
  {t:'info',q:'Duas palavras que parecem iguais, mas não são',b:'Vamos devagar, porque esta lição é muito importante.\n\n<b>Preço</b> é o número. Quanto a pessoa paga. Exemplo: R$ 600.\n\n<b>Valor</b> é o quanto aquilo <b>vale pra pessoa</b>. O que ela ganha, o problema que resolve, o quanto ela acha que vale a pena.\n\nO preço é igual pra todo mundo. O valor muda de pessoa pra pessoa.'},
  {t:'info',q:'Um exemplo do dia a dia',ana:'Uma garrafa de água custa R$ 3 no mercado. A mesma garrafa custa R$ 10 no estádio, no meio do jogo, num dia de calor. E as pessoas compram!',b:'O <b>preço</b> subiu de R$ 3 pra R$ 10. Mas o <b>valor</b> também subiu: no estádio, com sede e sem outra opção, aquela água vale muito mais pra pessoa.\n\nPor isso ninguém acha "caro" no estádio do mesmo jeito que acharia no mercado.\n\n<b>Conclusão:</b> a pessoa não acha algo caro por causa do número. Ela acha caro quando o número é <b>maior que o valor</b> que ela enxerga.'},
  {t:'mc',q:'Vamos checar: o que é PREÇO?',o:['O quanto algo vale pra pessoa','O número que a pessoa paga','A qualidade do produto','O desconto'],a:1,w:'Preço é só o número. Ex.: R$ 600.'},
  {t:'mc',q:'E o que é VALOR?',o:['O número da etiqueta','O quanto aquilo vale pra pessoa, o que ela ganha com aquilo','O preço com desconto','O custo pra você fazer'],a:1,w:'Valor é o que a pessoa ganha e o quanto ela acha que vale a pena.'},
  {t:'mc',q:'Quando uma pessoa acha algo CARO?',o:['Sempre que custa mais de R$ 100','Quando o preço é maior que o valor que ela enxerga','Quando o vendedor é simpático','Nunca'],a:1,w:'É isso. Se ela enxerga pouco valor, qualquer preço parece caro.'},
  {t:'info',q:'O que isso tem a ver com vender sites',b:'Imagine duas conversas com o mesmo preço:\n\n<b>Conversa 1:</b> o cliente pergunta "quanto custa?" e você responde só "R$ 600". O cliente não sabe o que ganha. Valor que ele enxerga: quase zero. Resultado: "tá caro".\n\n<b>Conversa 2:</b> você primeiro mostra que o site traz pacientes pelo Google, tem botão de WhatsApp, fica com as cores da clínica... e <b>depois</b> fala "R$ 600". Agora o cliente enxerga valor.\n\nMesmo preço. Reação diferente.'},
  {t:'info',q:'Veja na prática',b:'A mesma pergunta, respondida de dois jeitos:',msg:[['cli','Dra. Paula','Oi! Quanto fica o site?'],['eu','Jeito ruim','R$ 600.'],['eu','Jeito bom','Oi, Dra. Paula! O site fica com as cores da clínica, aparece quando alguém procura dentista na cidade e tem botão direto pro WhatsApp. Fica R$ 600, e dá pra fazer em 2x.']],tip:'Repare que o jeito bom NÃO enrola. Ele responde o preço na mesma mensagem, só que depois de mostrar o que ela ganha.'},
  {t:'mc',q:'Na resposta boa, o que vem PRIMEIRO?',o:['O preço','O que a cliente ganha com o site','O desconto','O portfólio'],a:1,w:'Primeiro o que ela ganha (valor), depois o número (preço).'},
  {t:'info',q:'Cuidado pra não exagerar',b:'"Valor antes do preço" <b>não</b> quer dizer fugir da pergunta.\n\nSe o cliente pergunta "quanto custa?" e você manda 3 parágrafos sem dizer o preço, ele fica irritado e desconfia.\n\nA regra é simples: <b>2 ou 3 linhas de valor, e o preço na mesma mensagem</b>.',erro:'Ficar enrolando: "depende, vamos marcar uma reunião pra eu te explicar". Muita gente some quando sente que o preço está sendo escondido.'},
  {t:'mc',q:'O cliente perguntou o preço. Qual resposta é melhor?',o:['"Depende, vamos marcar uma reunião?"','Só o número, sem mais nada','Duas linhas do que ele ganha e o preço logo em seguida','Mudar de assunto'],a:2,w:'Mostra valor rapidinho e responde a pergunta. Sem esconder nada.'},
  {t:'info',q:'A conta que faz o site parecer barato',b:'Um jeito poderoso de mostrar valor é fazer uma conta simples <b>junto com o dentista</b>.\n\n1. Pergunte: "Quanto custa, em média, um tratamento de implante aí?"\n2. Ele responde, por exemplo: "Uns R$ 3.000"\n3. Você mostra: "Então se o site trouxer <b>um</b> paciente de implante no ano inteiro, ele já se pagou cinco vezes."\n\nRepare: quem falou o número foi <b>ele</b>. Isso convence muito mais do que se você falasse.',erro:'Prometer resultado: "vou trazer 30 pacientes por mês". Você não controla isso, e promessa que não se cumpre queima seu nome.'},
  {t:'mc',q:'Um implante custa R$ 3.000 e o site custa R$ 600. Se o site trouxer UM paciente de implante, ele se pagou quantas vezes?',o:['1 vez','2 vezes','5 vezes','10 vezes'],a:2,w:'3.000 ÷ 600 = 5. É esse tipo de conta que faz o dentista enxergar o valor.'},
  {t:'mc',q:'Qual frase mostra valor SEM prometer o que você não controla?',o:['"Garanto 50 pacientes novos por mês"','"Se o site trouxer um paciente de implante no ano, ele já se pagou"','"Você vai ficar rico"','"É o melhor site do Brasil"'],a:1,w:'É uma conta honesta, que o próprio dentista consegue fazer.'},
  {t:'escreva',q:'Agora você. A dentista perguntou o preço. Responda com 2 linhas de valor e o preço na mesma mensagem (pode inventar o valor).',quem:'Dra. Paula',cli:'Oi! Quanto fica o site?',guia:'1. Cumprimente pelo nome\n2. Diga 2 coisas que ela GANHA (ex.: aparecer no Google, botão de WhatsApp, cores da clínica)\n3. Fale o preço sem pedir desculpa\n4. Termine com uma pergunta simples (ex.: "quer ver uma prévia?")',mod:'Oi, Dra. Paula! O site fica com as cores da clínica, aparece quando alguém procura dentista na cidade e tem botão direto pro WhatsApp. Fica R$ 600, e dá pra fazer em 2x. Quer que eu monte uma prévia gratuita pra você ver antes?',chk:['Respondeu o preço (não enrolou)','Mostrou o que ela ganha antes do número','Terminou com um próximo passo']},
  {t:'info',q:'Resumo da lição',b:'• <b>Preço</b> = o número. <b>Valor</b> = o quanto vale pra pessoa\n• A pessoa acha caro quando o preço é <b>maior que o valor que ela enxerga</b>\n• Por isso: <b>2 ou 3 linhas de valor, depois o preço</b>, na mesma mensagem\n• Faça a <b>conta do retorno</b> com o dentista, deixando ele falar o valor do tratamento\n• Nunca prometa números que você não controla'}
 ]}
]},
{u:'Unidade 2',t:'A abordagem',l:[
 {n:'A primeira mensagem',i:'📩',obj:['Montar uma primeira mensagem em 4 partes','Evitar o que faz ser ignorado','Terminar com uma pergunta fácil'],ex:[
  {t:'info',q:'O trabalho da primeira mensagem',b:'A primeira mensagem <b>não precisa vender o site</b>. Ela só tem um trabalho: <b>fazer a pessoa responder</b>.\n\nIsso tira um peso enorme. Você não precisa explicar tudo, mostrar preço nem convencer ninguém. Só abrir a conversa.'},
  {t:'mc',q:'Qual é o trabalho da primeira mensagem?',o:['Fechar a venda','Explicar tudo sobre o site','Fazer a pessoa responder','Mostrar o preço'],a:2,w:'Só isso. O resto vem na conversa.'},
  {t:'info',q:'As 4 partes de uma boa primeira mensagem',b:'1. <b>Quem é você</b>, em uma linha\n2. <b>Algo específico da clínica</b> (prova que não é spam)\n3. <b>A oportunidade</b> que você viu\n4. <b>Uma pergunta fácil</b>, de sim ou não\n\nVeja um exemplo com as partes separadas:',msg:[['eu','1. Quem é você','Oi, Dra. Ana! Sou o Fabiano, da Criate Solutions, aqui de SC.'],['eu','2. Algo específico','Vi que a clínica tem ótimas avaliações no Google,'],['eu','3. A oportunidade','mas não achei um site pra conhecer vocês. Faço sites pra clínicas, com botão direto pro WhatsApp.'],['eu','4. Pergunta fácil','Posso te mandar uma prévia de como ficaria o de vocês? É sem compromisso.']],tip:'No WhatsApp de verdade, mande tudo numa mensagem só. Aqui separamos só pra você ver as partes.'},
  {t:'mc',q:'Na mensagem de exemplo, qual parte prova que NÃO é spam?',o:['"Sou o Fabiano"','"Vi que a clínica tem ótimas avaliações no Google"','"É sem compromisso"','"Oi"'],a:1,w:'É algo específico daquela clínica. Spam não sabe disso.'},
  {t:'info',q:'Por que terminar com pergunta de sim ou não',b:'Compare o esforço que cada final exige do cliente:\n\n• "Vamos marcar uma reunião?" → ele precisa pensar em data, horário, se tem tempo... <b>muito esforço</b>\n• "Segue meu portfólio, qualquer coisa estou à disposição." → não tem pergunta nenhuma, então <b>não precisa responder</b>\n• "Posso te mandar uma prévia, sem compromisso?" → é só responder "pode". <b>Quase nenhum esforço</b>\n\nQuanto mais fácil responder, mais gente responde.'},
  {t:'mc',q:'Qual final de mensagem é MAIS fácil de responder?',o:['"Aguardo retorno para agendarmos uma reunião."','"Posso te mandar uma prévia, sem compromisso?"','"Segue meu portfólio, estou à disposição."','"Me liga quando puder."'],a:1,w:'É só responder "pode". Esforço quase zero.'},
  {t:'info',q:'O que faz a mensagem ser ignorada',b:'• <b>Texto enorme</b>: ninguém lê 3 parágrafos de um desconhecido\n• <b>"Prezado(a) senhor(a)"</b>: parece e-mail de banco\n• <b>Link logo de cara</b>: muita gente tem medo de golpe\n• <b>Áudio longo</b>: a secretária não pode ouvir no meio do atendimento\n• <b>Falar só de você</b>: "eu faço, eu sou, minha empresa..."',erro:'Mandar o link do portfólio na primeira mensagem. Número desconhecido + link = cara de golpe. Mande o link só depois que a pessoa responder.'},
  {t:'mc',q:'Qual primeira mensagem tem mais chance de resposta?',o:['Um áudio de 2 minutos explicando tudo','Um texto curto, com o nome da dentista e uma pergunta simples no fim','Só o link do portfólio','"Bom dia, vocês querem um site?"'],a:1,w:'Curta, pessoal e com uma pergunta fácil.'},
  {t:'build',q:'Monte a primeira mensagem colocando as 4 partes na ordem:',o:['Oi, Dr. Marcos! Sou o Fabiano, da Criate Solutions.','Vi que a Odonto Vida é referência em implantes,','mas não achei um site pra conhecer a clínica.','Posso te mandar uma prévia, sem compromisso?'],a:['Oi, Dr. Marcos! Sou o Fabiano, da Criate Solutions.','Vi que a Odonto Vida é referência em implantes,','mas não achei um site pra conhecer a clínica.','Posso te mandar uma prévia, sem compromisso?'],w:'Quem é você, algo específico, a oportunidade, pergunta fácil.'},
  {t:'escreva',q:'Sua vez: escreva a primeira mensagem pra esta clínica. Clínica Sorriso Leve, Dra. Bianca, faz muita lente de contato, 4,8 estrelas no Google, sem site.',guia:'1. Oi + nome da dentista + quem é você (1 linha)\n2. Algo específico: lentes de contato ou as avaliações\n3. A oportunidade: não achou site\n4. Pergunta de sim ou não: "posso te mandar uma prévia?"',mod:'Oi, Dra. Bianca! Sou o Fabiano, da Criate Solutions, aqui de SC. Vi que a Sorriso Leve tem ótimas avaliações e faz muito trabalho com lentes, mas não achei um site pra conhecer a clínica. Faço sites pra clínicas com botão direto pro WhatsApp. Posso te mandar uma prévia de como ficaria o de vocês? É sem compromisso.',chk:['Usou o nome da dentista e da clínica','Citou algo específico (lentes ou avaliações)','É curta (dá pra ler em 15 segundos)','Terminou com uma pergunta de sim ou não']},
  {t:'info',q:'Resumo da lição',b:'• O único trabalho da primeira mensagem é <b>fazer a pessoa responder</b>\n• As 4 partes: <b>quem é você, algo específico, a oportunidade, pergunta fácil</b>\n• Termine com pergunta de <b>sim ou não</b>\n• Nada de texto enorme, áudio longo ou link na primeira mensagem'}
 ]},
 {n:'Perguntas que abrem conversa',i:'❓',obj:['Diferenciar pergunta aberta de fechada','Fazer o cliente contar o que precisa','Usar a resposta dele na sua fala'],ex:[
  {t:'info',q:'Quem pergunta, conduz',ana:'O médico não chega receitando remédio. Ele pergunta: "onde dói? desde quando? piora quando?". Só depois de ouvir ele sabe o que receitar. E o paciente confia mais justamente porque foi ouvido.',b:'Depois que o cliente responde a primeira mensagem, o erro mais comum é <b>sair falando tudo sobre o site</b>.\n\nO certo é o contrário: <b>fazer perguntas</b>. Por dois motivos:\n1. Você descobre o que ele realmente precisa\n2. Quando <b>ele mesmo</b> fala do problema, ele se convence sozinho'},
  {t:'info',q:'Pergunta fechada x pergunta aberta',b:'<b>Pergunta fechada</b> se responde com "sim" ou "não". A conversa morre ali.\n• "Vocês têm site?" → "Não."\n\n<b>Pergunta aberta</b> faz a pessoa explicar. Começa com <b>como</b>, <b>o que</b>, <b>qual</b> ou <b>quanto</b>.\n• "Como os pacientes novos chegam até vocês hoje?" → "Ah, a maioria vem por indicação, alguns pelo Instagram..."\n\nViu? Na segunda você aprende um monte.',tip:'Na primeira mensagem você usa pergunta FECHADA (fácil de responder). Depois que a conversa começou, use perguntas ABERTAS (pra aprender sobre o cliente).'},
  {t:'mc',q:'Qual destas é uma pergunta ABERTA?',o:['"Vocês têm site?"','"Como os pacientes novos encontram vocês hoje?"','"Quer comprar?"','"Posso mandar?"'],a:1,w:'Começa com "como" e faz o cliente explicar.'},
  {t:'mc',q:'Qual palavra costuma começar uma pergunta aberta?',o:['"Você"','"Como"','"Pode"','"Tem"'],a:1,w:'"Como", "o que", "qual" e "quanto" pedem uma explicação, não só sim ou não.'},
  {t:'info',q:'Perguntas prontas pra usar',b:'Guarde estas três, funcionam com quase toda clínica:',msg:[['eu','Pra entender de onde vêm os pacientes','Hoje, como os pacientes novos costumam chegar até vocês?'],['eu','Pra achar um problema','O que mais toma tempo da secretária no WhatsApp?'],['eu','Pra saber o que vender','Quais tratamentos vocês mais querem atrair?']]},
  {t:'info',q:'O passo que quase todo mundo esquece: usar a resposta',b:'Fazer a pergunta é metade. A outra metade é <b>usar a resposta</b> na sua fala.\n\nVeja:',msg:[['eu','Você','Hoje, como os pacientes novos chegam até vocês?'],['cli','Dentista','A maioria vem por indicação.'],['eu','Você','Que ótimo, indicação é o melhor paciente! E quando alguém indica, a pessoa normalmente procura a clínica no Google antes de ligar. Um site ajuda a confirmar que vocês são sérios.']],erro:'Fazer a pergunta e ignorar a resposta, seguindo seu roteiro decorado. O cliente percebe na hora que você não está ouvindo.'},
  {t:'mc',q:'Na conversa acima, o que você fez com a resposta "vem por indicação"?',o:['Ignorou e falou do preço','Elogiou e ligou a indicação com o site','Discordou dele','Mudou de assunto'],a:1,w:'Você usou o que ele falou pra mostrar como o site ajuda justamente nisso.'},
  {t:'mc',q:'O dentista disse: "Meus pacientes vêm quase todos pelo Instagram". Qual a melhor resposta?',o:['"Instagram não serve pra nada"','"Que bom! Quando a pessoa quer agendar, o site pode ser o link da bio, com tratamentos, endereço e WhatsApp num lugar só"','"Então você não precisa de site"','Mandar o preço'],a:1,w:'Você aproveita o que ele falou e mostra como o site completa o Instagram.'},
  {t:'escreva',q:'O dentista respondeu sua primeira mensagem assim. Responda e termine com uma pergunta ABERTA.',quem:'Dr. Rafael',cli:'Oi, tudo bem? Então, a gente já pensou em fazer um site, mas nunca deu tempo.',guia:'1. Mostre que entendeu (a rotina é corrida)\n2. Tire o peso dele: você cuida de tudo, ele só aprova\n3. Faça uma pergunta que comece com "como" ou "o que"',mod:'Tudo ótimo, Dr. Rafael! Super entendo, a rotina de clínica é corrida. Por isso eu cuido de tudo, o senhor só aprova. Me conta: hoje, como os pacientes novos costumam chegar até vocês?',chk:['Mostrou que entendeu a falta de tempo','Tirou o peso dele (você faz o trabalho)','Terminou com uma pergunta aberta']},
  {t:'info',q:'Resumo da lição',b:'• Depois que a conversa começa, <b>pergunte mais do que fala</b>\n• Pergunta <b>aberta</b> começa com como, o que, qual, quanto\n• Sempre <b>use a resposta</b> do cliente na sua próxima fala\n• Guarde as 3 perguntas prontas: de onde vêm os pacientes, o que toma tempo, quais tratamentos atrair'}
 ]},
 {n:'Follow-up sem ser chato',i:'🔁',obj:['Entender por que o silêncio não é um "não"','Saber quando e quantas vezes cobrar','Escrever lembretes leves'],ex:[
  {t:'info',q:'O que é follow-up',b:'<b>Follow-up</b> (fala-se "fálou-áp") é voltar a falar com quem não respondeu. Um lembrete educado.\n\nParece chato, mas é onde muita venda acontece: a maioria dos fechamentos vem <b>depois do 2º ou 3º contato</b>, e não da primeira mensagem.'},
  {t:'info',q:'Por que o cliente não respondeu',ana:'Sabe quando alguém te manda mensagem, você lê no meio de alguma coisa, pensa "depois eu respondo"... e esquece? Com o dentista acontece o tempo todo.',b:'Na grande maioria das vezes, o silêncio quer dizer:\n• leu e esqueceu no meio do atendimento\n• achou interessante, mas deixou pra depois\n• a secretária não repassou ainda\n\nÉ bem raro ser um "não quero" escondido. Por isso vale lembrar, com educação.'},
  {t:'mc',q:'O cliente leu e não respondeu. Na maioria das vezes, isso significa:',o:['Que ele odiou','Que ele esqueceu ou não teve tempo','Que você deve desistir','Que ele vai te bloquear'],a:1,w:'Na correria, é muito comum ler e esquecer.'},
  {t:'info',q:'O ritmo certo',b:'Um ritmo que funciona e não incomoda:\n\n• <b>1º lembrete:</b> 2 dias depois da primeira mensagem\n• <b>2º lembrete:</b> 5 dias depois\n• <b>3º e último:</b> uns 10 dias depois, encerrando com educação\n\nDepois disso, pare. Se quiser, tente de novo daqui a 1 ou 2 meses.',tip:'Anote no painel de clientes o dia de cada lembrete. Assim você não esquece e não exagera.'},
  {t:'mc',q:'Quantos lembretes, no máximo, antes de parar?',o:['1','3','10','Até ele responder'],a:1,w:'Três lembretes espaçados. Depois disso, pare e tente de novo em 1 ou 2 meses.'},
  {t:'info',q:'Lembrete bom traz algo novo',b:'"E aí, viu minha mensagem?" não dá motivo nenhum pra responder. Um bom lembrete traz <b>uma novidade</b>:\n• uma prévia pronta\n• uma pergunta nova\n• um exemplo de outro site\n\nE sempre deixa a pessoa à vontade pra dizer não.',msg:[['eu','Lembrete ruim','???'],['eu','Lembrete ruim','Oi, você não vai me responder?'],['eu','Lembrete bom','Oi, Dra. Ana! Montei uma prévia rápida com as cores da clínica, pra você ter uma ideia. Se não for o momento, sem problemas, é só me falar 🙂']],erro:'Mandar "???" ou "Oi??". Soa como cobrança e irrita.'},
  {t:'mc',q:'Qual lembrete é melhor?',o:['"???"','"Você não vai me responder?"','"Oi! Montei uma prévia com as cores da clínica pra você ver. Se não for o momento, tudo bem!"','Mandar a mesma mensagem de novo'],a:2,w:'Traz algo novo e não pressiona.'},
  {t:'info',q:'O último lembrete: o truque da despedida',b:'No 3º lembrete, você avisa que vai parar. Parece estranho, mas é um dos que mais recebe resposta.\n\nQuando a pessoa percebe que a conversa vai acabar, ela costuma responder, nem que seja pra dizer "agora não, mas me chama mês que vem". E isso já é uma informação valiosa.'},
  {t:'escreva',q:'Escreva o último lembrete (o 3º) pra uma clínica que nunca respondeu. Ele deve encerrar a conversa com educação.',guia:'1. Cumprimente pelo nome\n2. Avise, de forma leve, que vai parar de mandar mensagem\n3. Deixe a porta aberta: "se um dia quiser, é só me chamar"',mod:'Oi, Dr. Marcos! Vou parar de te mandar mensagem pra não atrapalhar sua rotina 🙂 Se em algum momento quiser ver como ficaria o site da clínica, é só me chamar aqui. Sucesso!',chk:['É educado e curto','Avisou que vai parar','Deixou a porta aberta pro futuro']},
  {t:'info',q:'Resumo da lição',b:'• Silêncio quase nunca é "não". Geralmente é <b>esquecimento</b>\n• Ritmo: <b>2 dias, 5 dias, 10 dias</b>, depois pare\n• Todo lembrete traz <b>algo novo</b> e deixa a pessoa à vontade\n• O último lembrete <b>se despede</b>, e isso costuma gerar resposta'}
 ]}
]},
{u:'Unidade 3',t:'Respondendo objeções',l:[
 {n:'"Não tenho interesse"',i:'🙅',obj:['Entender o que é uma objeção','Não levar o "não" pro lado pessoal','Fazer UMA pergunta leve e sair com elegância'],ex:[
  {t:'info',q:'O que é uma objeção',b:'<b>Objeção</b> é quando o cliente dá um motivo pra não comprar: "não tenho interesse", "tá caro", "já tenho Instagram", "vou pensar".\n\nA notícia boa: <b>são sempre as mesmas</b>. Nesta unidade você vai aprender a responder as 4 mais comuns. Depois disso, quase nada vai te pegar de surpresa.'},
  {t:'info',q:'O "não" quase nunca é sobre você',ana:'Quando alguém recusa um panfleto na rua, não é porque odeia quem está entregando. É só que naquele momento não interessa.',b:'"Não tenho interesse" pode querer dizer coisas bem diferentes:\n• "agora não é a hora"\n• "não entendi o que eu ganho com isso"\n• "já tive uma experiência ruim"\n• "não quero mesmo"\n\nOs três primeiros ainda têm conversa. Só o último é um não de verdade.'},
  {t:'mc',q:'"Não tenho interesse" SEMPRE quer dizer que a pessoa nunca vai comprar?',o:['Sim, sempre','Não, pode ser "agora não" ou "não entendi o que ganho"','Sim, e ela está brava com você','Quer dizer que o preço é alto'],a:1,w:'Pode ser várias coisas. Por isso vale uma pergunta leve pra entender.'},
  {t:'info',q:'Uma pergunta, no máximo',b:'Quando ouvir "não tenho interesse", faça <b>uma única</b> pergunta, leve, pra entender o motivo. Por exemplo:',msg:[['cli','Secretária','A doutora disse que não tem interesse no momento.'],['eu','Você','Imagina, obrigado por avisar! Só pra eu entender e não incomodar à toa: é mais pelo momento, ou vocês já têm algo parecido em vista?']],tip:'Se depois dessa pergunta continuar o "não", agradeça e saia. Insistir mais que isso vira chatice.'},
  {t:'mc',q:'O cliente disse "não tenho interesse". A melhor reação é:',o:['Insistir várias vezes','Ficar chateado e sumir','Agradecer e fazer UMA pergunta leve pra entender o motivo','Baixar o preço na hora'],a:2,w:'Uma pergunta sem pressão pode revelar um motivo que tem solução.'},
  {t:'info',q:'Sair bem também é vender',b:'Se o não for de verdade, saia deixando uma ótima impressão. Muita gente volta meses depois, ou indica você pra alguém.\n\nEm cidade pequena, todo mundo se conhece. Educação vira reputação.',msg:[['eu','Você','Sem problemas, obrigado por responder! Se um dia pensar em ter um site, é só me chamar. Sucesso pra clínica 🙂']],erro:'Responder com ironia, criticar ("vocês vão se arrepender") ou sumir sem agradecer.'},
  {t:'mc',q:'Qual destas respostas NÃO deve ser usada?',o:['"Sem problemas, obrigado por responder!"','"Entendo. É pelo momento ou porque já têm algo parecido?"','"Vocês vão se arrepender, todo mundo tem site"','"Se um dia precisar, é só me chamar"'],a:2,w:'Ameaçar ou criticar só fecha portas.'},
  {t:'escreva',q:'Responda este "não" com educação e UMA pergunta leve.',quem:'Secretária',cli:'Oi, a doutora disse que não tem interesse no momento, obrigada.',guia:'1. Agradeça por ela ter avisado\n2. Faça uma pergunta só: "é pelo momento ou já têm algo parecido?"\n3. Deixe a porta aberta',mod:'Imagina, obrigado por avisar! Só pra eu entender e não incomodar à toa: é mais pelo momento, ou vocês já têm algo parecido em vista? Se um dia fizer sentido, é só me chamar 🙂',chk:['Agradeceu','Fez no máximo uma pergunta, sem pressão','Deixou a porta aberta']},
  {t:'info',q:'Resumo da lição',b:'• <b>Objeção</b> é um motivo pra não comprar, e elas se repetem sempre\n• "Não tenho interesse" muitas vezes é <b>"agora não"</b> ou <b>"não entendi"</b>\n• Faça <b>uma</b> pergunta leve, no máximo\n• Se o não continuar, <b>agradeça e saia bem</b>'}
 ]},
 {n:'"Tá caro"',i:'💸',obj:['Entender o que o "tá caro" quer dizer','Responder sem brigar e sem dar desconto','Oferecer uma opção menor em vez de baixar o preço'],ex:[
  {t:'info',q:'Lembra da lição de valor?',b:'Lá você aprendeu: a pessoa acha caro quando o <b>preço</b> é maior que o <b>valor</b> que ela enxerga.\n\nEntão, quando o cliente diz "tá caro", quase sempre ele está dizendo:\n\n<b>"Ainda não enxerguei valor suficiente pra esse preço."</b>\n\nIsso muda tudo. O problema não é o número. É o valor que ainda não ficou claro.'},
  {t:'mc',q:'Na maioria das vezes, "tá caro" quer dizer:',o:['"Você é um ladrão"','"Ainda não enxerguei valor suficiente pra esse preço"','"Nunca vou comprar"','"Me dá 50% de desconto"'],a:1,w:'O valor ainda não ficou claro pra ele. Esse é o seu trabalho agora.'},
  {t:'info',q:'Por que NÃO dar desconto na hora',ana:'Quando o paciente acha o implante caro, o bom dentista não dá 50% de desconto. Ele explica o material, quanto tempo dura e as formas de pagar.',b:'Se você baixa o preço assim que o cliente reclama, acontecem 3 coisas ruins:\n1. Ele pensa: "então o preço de antes era inventado"\n2. Você trabalha o mesmo tanto ganhando menos\n3. Ele vai pedir desconto de novo em tudo'},
  {t:'mc',q:'O cliente disse "tá caro". Qual é a PIOR resposta?',o:['"Entendo. Posso te mostrar o que está incluso?"','"Comparado com o quê?"','"Tá bom, faço pela metade"','"Dá pra parcelar, se ajudar"'],a:2,w:'Cortar pela metade mostra que o preço não tinha base.'},
  {t:'info',q:'O que fazer, em 3 passos',b:'1. <b>Concorde com o sentimento</b>, sem brigar: "Entendo, é um investimento."\n2. <b>Lembre o valor</b>: o que está incluso e o que ele ganha\n3. <b>Ofereça uma opção</b>, em vez de desconto: uma versão menor, ou parcelar\n\nAssim o cliente escolhe, e o seu preço continua firme.'},
  {t:'info',q:'Opções em vez de desconto',b:'Se o orçamento do cliente for menor de verdade, você muda <b>o que entrega</b>, não <b>o valor do seu trabalho</b>.',msg:[['cli','Cliente','Achei caro.'],['eu','Você','Entendo, é um investimento! Se ficar pesado agora, tenho uma versão mais simples, de uma página, com o essencial: tratamentos, endereço e WhatsApp. Depois dá pra ampliar. E qualquer uma das duas dá pra fazer em 2x.']],tip:'Ter sempre duas opções prontas (completa e simples) facilita muito. O cliente para de pensar em "comprar ou não" e passa a pensar em "qual das duas".'},
  {t:'mc',q:'O orçamento do cliente é menor. Qual a melhor saída?',o:['Fazer o site completo pelo preço que ele quer','Oferecer uma versão menor por um preço menor','Desistir do cliente','Dizer que é promoção'],a:1,w:'Você ajusta o que entrega, não o valor do seu trabalho.'},
