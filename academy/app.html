  {t:'info',q:'E quando aparece o "sobrinho que faz de graça"?',b:'Vai acontecer. A regra é: <b>nunca fale mal</b> do sobrinho. Diga que, se ele fizer, ótimo, e mostre a diferença do seu serviço:\n• você cuida de tudo, sem o dentista ter que correr atrás\n• tem manutenção quando precisar mudar algo\n• você entrega no prazo, com as cores da clínica'},
  {t:'escreva',q:'Responda ao "tá caro" sem dar desconto: concorde, lembre o valor e ofereça uma opção.',quem:'Dr. Paulo',cli:'Achei meio caro, viu. Meu sobrinho falou que faz de graça.',guia:'1. Concorde sem brigar (e sem falar mal do sobrinho)\n2. Lembre o que está incluso no seu serviço\n3. Ofereça a versão mais simples ou o parcelamento\n4. Termine com uma pergunta: "quer que eu te mostre as duas?"',mod:'Entendo, Dr. Paulo! Se o seu sobrinho fizer, ótimo. A diferença é que eu cuido de tudo: site com as cores da clínica, botão de WhatsApp, aparecer no Google e manutenção quando precisar mudar algo, sem o senhor ter que correr atrás. Se o valor estiver pesado agora, tenho uma versão mais simples, só com o essencial, e dá pra ampliar depois. Quer que eu te mostre as duas?',chk:['Não brigou nem falou mal do sobrinho','Lembrou o que está incluso (valor)','Ofereceu uma opção sem baixar o preço da completa']},
  {t:'info',q:'Resumo da lição',b:'• "Tá caro" = <b>"ainda não vi valor suficiente"</b>\n• Não dê desconto na hora\n• 3 passos: <b>concorde, lembre o valor, ofereça uma opção</b>\n• Tenha sempre <b>duas versões</b> prontas: completa e simples'}
 ]},
 {n:'"Já tenho Instagram"',i:'📱',obj:['Entender a diferença entre Instagram e site','Elogiar em vez de criticar','Mostrar que o site completa o Instagram'],ex:[
  {t:'info',q:'Por que o dentista fala isso',b:'Pra muita clínica, o Instagram parece suficiente: tem fotos, tem os tratamentos, tem o WhatsApp na bio.\n\nE o Instagram é ótimo mesmo! Por isso a regra número 1 desta lição é: <b>nunca fale mal do Instagram</b>. Você vai mostrar que o site <b>completa</b>, não que substitui.'},
  {t:'info',q:'O que o site faz que o Instagram não faz',b:'• <b>Aparece no Google</b>: quem pesquisa "dentista em Tangará" encontra sites, não perfis do Instagram\n• <b>Tudo num lugar só</b>: no Instagram a informação se perde entre centenas de posts\n• <b>É da clínica</b>: não depende de algoritmo, nem de a conta ser bloqueada\n• <b>Passa mais seriedade</b>: muita gente confere o site antes de marcar algo caro, como um implante'},
  {t:'mc',q:'Qual é uma vantagem REAL do site sobre o Instagram?',o:['Tem mais curtidas','Aparece quando alguém pesquisa no Google','Não precisa de internet','É obrigatório por lei'],a:1,w:'A busca no Google é onde o site faz a maior diferença.'},
  {t:'info',q:'A frase mágica: "link da bio"',b:'O jeito mais fácil de mostrar que site e Instagram trabalham juntos:\n\n"O site pode ser o <b>link da bio</b> de vocês. Quem gostar dos posts clica e encontra tudo: tratamentos, endereço, horários e o botão do WhatsApp."\n\nAssim você transforma o Instagram num <b>aliado</b> do site.'},
  {t:'mc',q:'O dentista disse "já tenho Instagram". Qual a melhor resposta?',o:['"Instagram não adianta nada"','"Ótimo! O site pode ser o link da bio, com tudo num lugar só, e ainda aparece no Google"','"Então tá, tchau"','"Instagram é coisa de criança"'],a:1,w:'Valoriza o que ele já faz e mostra como o site soma.'},
  {t:'escreva',q:'Responda: "Ah, mas já tenho Instagram, acho que não precisa."',quem:'Dra. Carla',cli:'Ah, mas a gente já tem Instagram, acho que não precisa de site.',guia:'1. Elogie o Instagram dela\n2. Diga que o site completa (link da bio, tudo num lugar)\n3. Fale do Google\n4. Termine oferecendo uma prévia',mod:'Faz sentido, Dra. Carla, e o Instagram de vocês está bem bonito! O site não substitui, ele completa: vira o link da bio com tratamentos, endereço e botão de WhatsApp num lugar só, e aparece quando alguém pesquisa dentista no Google, que é onde muita gente procura antes de agendar. Quer ver uma prévia de como ficaria junto com o Instagram de vocês?',chk:['Elogiou o Instagram dela','Explicou que o site completa (não substitui)','Falou do Google','Terminou com um próximo passo']},
  {t:'info',q:'Resumo da lição',b:'• <b>Nunca</b> fale mal do Instagram\n• O site <b>completa</b>: aparece no Google, junta tudo e é da clínica\n• Use a ideia do <b>link da bio</b>\n• Termine oferecendo uma prévia'}
 ]},
 {n:'"Vou pensar"',i:'🤔',obj:['Entender o que o "vou pensar" esconde','Descobrir a dúvida sem pressionar','Sempre combinar o próximo passo'],ex:[
  {t:'info',q:'O "vou pensar" mais comum do mundo',b:'Você mostrou a prévia, o cliente gostou... e diz: "vou pensar".\n\nQuase sempre existe uma <b>dúvida que ele não falou</b>. As mais comuns:\n• o <b>preço</b> ("será que vale?")\n• se vai <b>dar certo</b> ("será que traz paciente?")\n• o <b>tempo</b> ("vou ter que fazer muita coisa?")\n\nSeu trabalho é descobrir qual é, com jeito.'},
  {t:'mc',q:'O que geralmente existe por trás do "vou pensar"?',o:['Nada, ele só gosta de pensar','Uma dúvida que ele ainda não falou','Uma decisão de nunca comprar','Raiva de você'],a:1,w:'Quase sempre tem uma dúvida escondida: preço, resultado ou tempo.'},
  {t:'info',q:'Como descobrir a dúvida',b:'Use uma pergunta que dá opções. Fica fácil pro cliente apontar qual é:',msg:[['cli','Dr. Felipe','Gostei! Vou pensar e te falo.'],['eu','Você','Claro, pense com calma! Pra eu te ajudar: ficou alguma dúvida sobre o valor, o prazo ou como funciona depois que o site vai pro ar?']],tip:'Dar as opções ("valor, prazo ou como funciona") ajuda muito. É mais fácil apontar do que explicar.'},
  {t:'info',q:'O passo que salva a venda: combinar a volta',b:'Antes de encerrar, <b>combine um dia</b> pra falar de novo:\n\n"Posso te chamar na sexta pra ver o que achou?"\n\nQuem combina o próximo passo <b>controla o ritmo</b> da venda. Sem isso, o "vou pensar" vira "nunca mais".',erro:'Responder só "ok, fico no aguardo" e sumir. Sem dia combinado, o cliente esquece e a venda morre.'},
  {t:'mc',q:'O cliente disse "vou pensar". O que fazer?',o:['Responder "ok" e esperar ele voltar','Perguntar com jeito se ficou dúvida e combinar um dia pra falar de novo','Pressionar: "a promoção acaba hoje"','Mandar mensagem a cada hora'],a:1,w:'Descubra a dúvida e combine o próximo contato.'},
  {t:'build',q:'Monte a resposta ao "vou pensar" na ordem certa:',o:['Que bom que gostou! Pense com calma.','Ficou alguma dúvida sobre o valor, o prazo ou como funciona?','Posso te chamar na sexta pra ver o que achou?'],a:['Que bom que gostou! Pense com calma.','Ficou alguma dúvida sobre o valor, o prazo ou como funciona?','Posso te chamar na sexta pra ver o que achou?'],w:'Acolher, descobrir a dúvida, combinar a volta.'},
  {t:'escreva',q:'Responda o "vou pensar" descobrindo a dúvida e combinando o próximo contato.',quem:'Dr. Felipe',cli:'Gostei da prévia! Vou pensar e te falo.',guia:'1. Mostre que ficou feliz por ele ter gostado\n2. Pergunte se a dúvida é valor, prazo ou como funciona\n3. Combine um dia pra falar de novo',mod:'Que bom que gostou, Dr. Felipe! Pense com calma. Pra eu te ajudar: ficou alguma dúvida sobre o valor, o prazo ou como funciona depois que o site vai pro ar? Posso te chamar na sexta pra ver o que achou?',chk:['Mostrou que ficou feliz com o retorno','Perguntou qual é a dúvida','Combinou um dia pra falar de novo']},
  {t:'info',q:'Resumo da lição',b:'• Atrás do "vou pensar" existe uma <b>dúvida escondida</b>\n• Pergunte dando opções: <b>valor, prazo ou como funciona</b>\n• <b>Sempre combine um dia</b> pra falar de novo\n• Anote esse dia no painel de clientes'}
 ]}
]},
{u:'Unidade 4',t:'Fechando a venda',l:[
 {n:'Apresentando o preço',i:'🏷️',obj:['Falar o preço com segurança','Usar uma estrutura de 4 partes','Montar uma proposta clara'],ex:[
  {t:'info',q:'Por que dá medo falar o preço',b:'É normal sentir um frio na barriga na hora de falar o valor. Você pensa: "e se ele achar caro? e se sumir?".\n\nO problema é que <b>a insegurança passa pro cliente</b>. Se você fala o preço gaguejando, ele pensa: "nem ele acredita que vale isso".\n\nA solução não é ter coragem do nada. É ter uma <b>estrutura pronta</b>, que você só segue.'},
  {t:'info',q:'A estrutura em 4 partes',b:'1. <b>Resumo</b> do que o cliente ganha\n2. <b>O valor</b>, dito com naturalidade\n3. <b>A forma de pagamento</b>\n4. <b>O próximo passo</b>\n\nVeja juntando tudo:',msg:[['eu','Você','O site fica com as cores da clínica, botão de WhatsApp e aparecendo no Google. O valor é R$ 600, e dá pra fazer em 2x. Assim que você aprovar, começo, e em uma semana está no ar.']],erro:'Falar o preço com "é que... sabe... não é muito caro, viu?". Isso faz o cliente duvidar.'},
  {t:'mc',q:'Qual jeito de falar o preço passa mais segurança?',o:['"É que... fica uns 600, mas posso ver"','"O valor é R$ 600, em até 2x. Começo assim que você aprovar."','"Quanto você pode pagar?"','"Não sei, quanto você acha justo?"'],a:1,w:'Claro, direto e já com o próximo passo.'},
  {t:'build',q:'Coloque as 4 partes da apresentação do preço na ordem:',o:['O site fica com as cores da clínica e aparece no Google.','O valor é R$ 600,','e dá pra fazer em 2x.','Assim que aprovar, em uma semana está no ar.'],a:['O site fica com as cores da clínica e aparece no Google.','O valor é R$ 600,','e dá pra fazer em 2x.','Assim que aprovar, em uma semana está no ar.'],w:'Resumo, valor, pagamento, próximo passo.'},
  {t:'info',q:'A proposta escrita',b:'Quando o cliente pedir "me manda tudo certinho", envie uma proposta curta com:\n• <b>O que está incluso</b> (páginas, WhatsApp, Google, ajustes)\n• <b>O valor</b>\n• <b>A forma de pagamento</b>\n• <b>O prazo</b> de entrega\n\nNão precisa de PDF de 5 páginas. Uma mensagem organizada já resolve. Clareza evita dúvida e evita problema depois.'},
  {t:'mc',q:'O que uma proposta deve ter?',o:['Só o preço','O que está incluso, o valor, a forma de pagamento e o prazo','Um texto de 5 páginas','Só o link do portfólio'],a:1,w:'Essas 4 coisas evitam dúvida e mal-entendido.'},
  {t:'escreva',q:'Escreva como você apresentaria o preço do seu site (use os valores que você cobra).',guia:'1. Resuma o que o cliente ganha (1 frase)\n2. Fale o valor sem pedir desculpa\n3. Diga a forma de pagamento\n4. Diga o próximo passo e o prazo',mod:'O site da clínica fica com as cores de vocês, página de tratamentos, endereço com mapa e botão direto pro WhatsApp. O valor é R$ 600, que dá pra fazer em 2x. Assim que você aprovar, começo, e em uma semana está no ar.',chk:['Resumiu o que está incluso','Falou o valor sem pedir desculpa','Disse a forma de pagamento','Terminou com o próximo passo']},
  {t:'info',q:'Resumo da lição',b:'• A insegurança passa pro cliente: use uma <b>estrutura pronta</b>\n• 4 partes: <b>resumo, valor, pagamento, próximo passo</b>\n• Proposta escrita: <b>incluso, valor, pagamento, prazo</b>'}
 ]},
 {n:'Pedindo o sim',i:'✅',obj:['Perceber os sinais de que o cliente quer comprar','Pedir o fechamento sem medo','Conduzir pro próximo passo concreto'],ex:[
  {t:'info',q:'A venda que se perde por não pedir',b:'Isso acontece muito: o cliente gostou, está pronto pra fechar... e o vendedor fica esperando ele dizer "quero comprar". Ele não diz. A conversa esfria. A venda some.\n\nA maioria dos clientes <b>espera você conduzir</b>. Pedir o "sim" não é ser chato, é fazer o seu trabalho.'},
  {t:'info',q:'Sinais de que o cliente quer comprar',b:'Preste atenção quando o cliente:\n• pergunta o <b>prazo</b>: "quanto tempo demora?"\n• pergunta o <b>pagamento</b>: "aceita pix?"\n• pede pra <b>mudar algo</b> na prévia: "dá pra trocar essa cor?"\n• fala <b>"nosso site"</b> em vez de "o site"\n\nQuem faz essas perguntas já está se imaginando com o site pronto.'},
  {t:'mc',q:'Qual pergunta do cliente é um SINAL DE COMPRA?',o:['"Quem é você?"','"Em quanto tempo fica pronto?"','"Não tenho interesse"','"Depois eu vejo"'],a:1,w:'Quem pergunta prazo já está se imaginando com o site.'},
  {t:'mc',q:'A dentista disse: "dá pra colocar a foto da nossa recepção no topo?". Isso é:',o:['Uma reclamação','Um sinal de compra','Uma desistência','Uma objeção de preço'],a:1,w:'Ela está personalizando o "nosso" site. Hora de conduzir pro fechamento.'},
  {t:'info',q:'Como pedir o sim',b:'Responda a dúvida e, <b>na mesma mensagem</b>, faça uma pergunta que leva ao próximo passo:',msg:[['cli','Cliente','Aceita pix?'],['eu','Você','Aceito sim! Posso começar então? Me manda o logo e as fotos que vocês tiverem.']],tip:'Outras perguntas de fechamento: "Prefere pagar no pix ou em 2x?" e "Posso reservar pra entregar até sexta?"',erro:'Responder só "aceito sim" e parar. Você respondeu, mas não conduziu.'},
  {t:'mc',q:'O cliente perguntou "aceita pix?". O que você faz?',o:['Responde "sim" e espera','Responde "aceito sim! Posso começar então? Me manda o logo da clínica"','Muda de assunto','Manda o portfólio de novo'],a:1,w:'Responda e já conduza pro fechamento.'},
  {t:'escreva',q:'O cliente mandou isso. Responda e peça o fechamento.',quem:'Dra. Juliana',cli:'Adorei a prévia! Em quanto tempo fica pronto?',guia:'1. Mostre que ficou feliz\n2. Responda o prazo\n3. Pergunte: "posso começar então?"\n4. Diga o que você precisa dela (logo, fotos) e como pagar',mod:'Que bom que gostou, Dra. Juliana! Fica pronto em até 7 dias depois que você aprovar. Posso começar então? Pra isso, me manda o logo da clínica e as fotos que vocês tiverem, e o pagamento pode ser no pix ou em 2x.',chk:['Respondeu a dúvida (prazo)','Pediu o fechamento ("posso começar?")','Disse o próximo passo concreto']},
  {t:'info',q:'Resumo da lição',b:'• O cliente <b>espera você conduzir</b>. Peça o sim\n• Sinais de compra: <b>prazo, pagamento, pedir mudança, "nosso"</b>\n• Responda a dúvida <b>e</b> faça a pergunta de fechamento na mesma mensagem'}
 ]},
 {n:'Depois do sim: indicações',i:'🌱',obj:['Entregar bem pra vender de novo','Saber a hora certa de pedir indicação','Pedir de um jeito específico'],ex:[
  {t:'info',q:'A venda não acaba no pagamento',b:'Depois que o site vai pro ar, começa uma fase muito importante: transformar esse cliente em alguém que <b>fala bem de você</b>.\n\nDentista conhece muito dentista. Um cliente feliz pode te trazer vários outros, sem você mandar nenhuma mensagem fria.'},
  {t:'info',q:'Entregue melhor do que prometeu',b:'Algumas atitudes simples que deixam o cliente encantado:\n• entregar <b>no prazo</b> (ou antes)\n• mandar uma mensagem quando o site for pro ar, com o link\n• responder rápido quando ele pedir um ajuste\n\nIsso cria a hora perfeita pra pedir indicação.'},
  {t:'info',q:'A hora certa de pedir',ana:'É como o paciente que sai feliz do consultório: é nessa hora que ele mais fala bem da clínica pros amigos.',b:'A melhor hora pra pedir indicação é <b>logo depois que o cliente elogiou</b> o trabalho. Ele está feliz, lembrando de você, e com vontade de ajudar.'},
  {t:'mc',q:'Qual é a melhor hora de pedir indicação?',o:['Antes de começar o site','Logo depois que o cliente elogiou o site pronto','Um ano depois','Nunca, é chato'],a:1,w:'Quando o cliente está feliz com o resultado.'},
  {t:'info',q:'Como pedir: seja específico',b:'"Se souber de alguém, me avisa" é fácil de esquecer. Pergunte de um jeito que dá pra responder na hora:',msg:[['cli','Cliente','Ficou show o site!'],['eu','Você','Que bom que gostou! Uma pergunta: você conhece outro dentista ou clínica que também esteja sem site? Se puder me indicar, agradeço muito 🙏']],tip:'Quando alguém te indicar, agradeça e conte como foi. Isso faz a pessoa querer indicar de novo.'},
  {t:'mc',q:'Qual pedido de indicação é mais eficaz?',o:['"Se souber de alguém, me avisa"','"Você conhece outro dentista que esteja sem site? Se puder me indicar, agradeço muito"','"Me indica pra todo mundo"','Não pedir e esperar acontecer'],a:1,w:'Pergunta específica, fácil de responder na hora.'},
  {t:'escreva',q:'O cliente acabou de elogiar o site pronto. Agradeça e peça uma indicação.',quem:'Dr. Marcos',cli:'Ficou show o site, Fabiano! Os pacientes já estão comentando.',guia:'1. Agradeça de verdade\n2. Pergunte se ele conhece outro dentista ou clínica sem site\n3. Agradeça por qualquer indicação',mod:'Que demais, Dr. Marcos! Fico muito feliz, obrigado pela confiança. Uma pergunta: o senhor conhece outro dentista ou clínica que também esteja sem site? Se puder me indicar, agradeço muito 🙏',chk:['Agradeceu de verdade','Pediu indicação de forma específica','Foi curto e leve']},
  {t:'info',q:'Resumo do curso',b:'Você chegou ao fim de Vendas na prática! O caminho inteiro:\n\n1. Vender é <b>ajudar</b>: fale do <b>resultado</b>\n2. <b>Pesquise</b> 2 minutos e personalize\n3. <b>Valor antes do preço</b>, na mesma mensagem\n4. Primeira mensagem curta, com <b>pergunta de sim ou não</b>\n5. Depois, <b>perguntas abertas</b> e escuta\n6. <b>Lembretes</b> leves: 2, 5 e 10 dias\n7. Objeções: <b>entenda o motivo antes de responder</b>\n8. Preço com <b>estrutura</b> e segurança\n9. <b>Peça o sim</b> quando aparecer um sinal\n10. Cliente feliz: <b>peça indicação</b>'}
 ]}
]}]},
{id:'ciber',cat:'sec',nome:'Segurança digital',icone:'🛡️',cor:'#0E7C86',sub:'Proteger você, seus clientes e seus sites',nivel:'Iniciante',meta:'Criar senhas fortes, ligar a verificação em duas etapas, reconhecer golpes, proteger o celular e o computador, e entregar sites seguros pros clientes.',units:[
{u:'Unidade 1',t:'O básico que protege 90%',l:[
 {n:'O que é cibersegurança',i:'🛡️',obj:['Entender o que é cibersegurança','Conhecer os 3 pilares: sigilo, integridade e disponibilidade','Saber por que qualquer pessoa é alvo'],ex:[
  {t:'info',q:'Segurança digital é trancar a porta da sua vida online',ana:'Pense na sua casa. Você tranca a porta, não deixa a chave embaixo do tapete e não abre pra qualquer um que bate dizendo que é "da companhia de luz". Na internet é igual: suas contas são a casa, a senha é a chave e os golpistas batem na porta o tempo todo.',b:'<b>Cibersegurança</b> é o conjunto de cuidados que protege pessoas, aparelhos e informações contra roubo, golpe e estrago.\n\nNão é coisa só de empresa grande ou de hacker de filme. Seu WhatsApp, seu e-mail, seu Instagram, sua conta do banco e os sites dos seus clientes: tudo isso precisa de proteção.'},
  {t:'info',q:'Os 3 pilares',b:'Todo cuidado de segurança protege pelo menos uma destas 3 coisas:\n• <b>Sigilo</b> (confidencialidade): só quem pode vê a informação. Ex.: só você lê suas mensagens.\n• <b>Integridade</b>: ninguém altera a informação escondido. Ex.: ninguém troca o número do Pix na sua cobrança.\n• <b>Disponibilidade</b>: a informação está lá quando você precisa. Ex.: o site do cliente não sai do ar.',tip:'Quando aprender qualquer cuidado novo, pergunte: isso protege o sigilo, a integridade ou a disponibilidade? Ajuda muito a entender o porquê.'},
  {t:'mc',q:'Um golpista trocou a chave Pix de um boleto antes de ele chegar no cliente. Qual pilar foi atacado?',o:['Sigilo','Integridade','Disponibilidade','Nenhum'],a:1,w:'A informação foi ALTERADA sem ninguém saber. Isso é um ataque à integridade.'},
  {t:'mc',q:'O site de uma clínica ficou fora do ar o dia todo. Qual pilar falhou?',o:['Sigilo','Integridade','Disponibilidade','Todos'],a:2,w:'O site não estava disponível quando os pacientes precisaram. É a disponibilidade.'},
  {t:'info',q:'"Mas quem vai querer me atacar?"',ana:'Um ladrão de rua não escolhe a casa mais rica da cidade. Ele passa testando portas e entra na que estiver aberta.',b:'A maioria dos ataques <b>não é pessoal</b>. São robôs e golpistas testando milhões de contas e números ao mesmo tempo, procurando quem está desprotegido.\n\nPor isso, pequenos cuidados já tiram você da lista de alvos fáceis. É o que este curso vai te ensinar.',erro:'Achar que "não tenho nada de valor". Seu WhatsApp vale muito pra um golpista: ele usa pra pedir dinheiro pros seus contatos.'},
  {t:'mc',q:'Por que pessoas comuns são atacadas?',o:['Porque os hackers escolhem cada vítima a dedo','Porque robôs testam milhões de contas atrás de quem está desprotegido','Só famosos são atacados','Porque é ilegal ter senha fraca'],a:1,w:'Os ataques são em massa. Quem está desprotegido vira alvo fácil, não importa quem seja.'}
 ]},
 {n:'Senhas fortes',i:'🔑',obj:['Entender o que deixa uma senha forte','Criar uma frase-senha fácil de lembrar','Saber por que não repetir senha'],ex:[
  {t:'info',q:'Tamanho vale mais que símbolos',ana:'Imagine um cadeado de bicicleta. Com 3 números, alguém testa todas as combinações em minutos. Com 12 números, levaria anos. Cada caractere a mais multiplica o trabalho do ladrão.',b:'Programas de quebra de senha testam bilhões de combinações por segundo. O que mais atrapalha eles é o <b>tamanho</b> da senha.\n\n• <code>Ab@1</code>: curta, quebra em segundos\n• <code>Fabiano2026</code>: nome + ano, é das primeiras que eles testam\n• <code>cafe-azul-bicicleta-chuva</code>: longa, aleatória e fácil de lembrar',tip:'Use pelo menos 12 caracteres. Uma frase com 4 palavras sem relação entre si é forte e você consegue decorar.'},
  {t:'mc',q:'Qual destas senhas é a MAIS forte?',o:['Senha@123','Fabiano2026!','girafa-tijolo-lua-pipoca','12345678'],a:2,w:'Quatro palavras aleatórias formam uma senha longa e difícil de adivinhar, mesmo sem símbolos.'},
  {t:'info',q:'O perigo de repetir senha',b:'Quando um site é invadido, a lista de e-mails e senhas vaza e é vendida.\n\nOs golpistas pegam essa lista e testam o mesmo e-mail e senha no Instagram, no banco, no Gmail... Isso se chama <b>ataque de reuso de senha</b>.\n\nSe você usa a mesma senha em tudo, um vazamento numa loja pequena abre <b>todas</b> as suas contas.',erro:'Usar a mesma senha "forte" em tudo. Ela pode ser ótima, mas basta um site vazar pra todas caírem juntas.'},
  {t:'mc',q:'Uma loja online onde você comprou foi invadida e as senhas vazaram. Quem corre mais risco?',o:['Quem usa uma senha diferente em cada site','Quem usa a mesma senha da loja no e-mail e no Instagram','Ninguém, a senha é criptografada','Só quem comprou muito'],a:1,w:'Os golpistas testam a senha vazada em outros sites. Quem repete senha perde várias contas de uma vez.'},
  {t:'info',q:'O gerenciador de senhas',ana:'É um cofre: você decora só a senha do cofre, e ele guarda todas as outras chaves pra você.',b:'Ninguém decora 50 senhas diferentes. Por isso existe o <b>gerenciador de senhas</b>: um app que cria senhas fortes, guarda tudo com segurança e preenche sozinho.\n\nExemplos: o gerenciador do Google (já vem no Chrome e no Android), o do iPhone, o Bitwarden (gratuito).\n\nVocê só precisa decorar <b>uma</b> senha bem forte: a do gerenciador.'},
  {t:'mc',q:'Qual é o jeito mais seguro e prático de ter senhas diferentes em tudo?',o:['Anotar num papel na carteira','Usar um gerenciador de senhas','Mandar as senhas pra você mesmo no WhatsApp','Usar a mesma senha com um número no final'],a:1,w:'O gerenciador cria e guarda senhas fortes e diferentes, e você só decora uma.'},
  {t:'build',q:'Monte uma frase-senha forte com 4 palavras:',o:['trator','-','nuvem','-','violão','-','pastel','123'],a:['trator','-','nuvem','-','violão','-','pastel'],w:'Quatro palavras sem relação, separadas por hífen. O 123 no final não ajuda em nada.'}
 ]},
 {n:'Verificação em duas etapas',i:'📲',obj:['Entender o que é a verificação em duas etapas','Saber qual tipo é mais seguro','Ligar no WhatsApp, Instagram e Google'],ex:[
  {t:'info',q:'Duas trancas na mesma porta',ana:'É como o cofre do banco que precisa de duas chaves: mesmo que alguém roube uma, não abre sem a outra.',b:'A <b>verificação em duas etapas</b> (também chamada de 2FA) pede duas provas de que é você:\n• algo que você <b>sabe</b>: a senha\n• algo que você <b>tem</b>: um código no seu celular\n\nAssim, mesmo que roubem sua senha, o golpista não entra sem o código do seu aparelho.'},
  {t:'mc',q:'Sua senha do Instagram vazou, mas você tem a verificação em duas etapas ligada. O que acontece?',o:['O golpista entra normalmente','O golpista precisa também do código do seu celular, então não entra','A conta é apagada','O Instagram manda a senha pra ele'],a:1,w:'Sem o segundo fator (o código do seu aparelho), a senha sozinha não abre a conta.'},
  {t:'info',q:'Nem todo código é igual',b:'Do mais fraco pro mais forte:\n• <b>Código por SMS</b>: melhor que nada, mas dá pra roubar clonando o chip\n• <b>App autenticador</b> (Google Authenticator, Microsoft Authenticator): gera o código no seu celular, sem depender do chip. Bem mais seguro\n• <b>Chave de acesso (passkey)</b>: usa sua digital ou rosto. A mais segura e a mais fácil',tip:'No WhatsApp, a verificação em duas etapas é um PIN de 6 números: Configurações → Conta → Confirmação em duas etapas. Ligue hoje.'},
  {t:'mc',q:'Qual opção de segundo fator é mais segura que o SMS?',o:['Mandar o código por e-mail pra outra pessoa','Um app autenticador ou uma chave de acesso','Usar a data de nascimento','Desligar a verificação'],a:1,w:'O app autenticador e a chave de acesso não dependem do chip, que pode ser clonado.'},
  {t:'info',q:'O código é só seu',b:'Nenhuma empresa séria pede o seu código de verificação por mensagem ou ligação. Nem o WhatsApp, nem o banco, nem o "suporte".\n\nSe alguém pede o código que chegou no seu celular, é <b>golpe</b>, sempre.',erro:'Passar o código de 6 dígitos do WhatsApp pra alguém que disse ser "da pesquisa" ou "do suporte". É assim que mais roubam WhatsApp no Brasil.'},
  {t:'mc',q:'Alguém liga dizendo ser do banco e pede o código que acabou de chegar por SMS. O que fazer?',o:['Passar, porque é do banco','Passar só os 3 primeiros números','Não passar e desligar. É golpe','Mandar por WhatsApp em vez de falar'],a:2,w:'Código de verificação nunca se passa pra ninguém. Desligue e, se quiser, ligue você mesmo pro número oficial do banco.'}
 ]},
 {n:'Golpes e phishing',i:'🎣',obj:['Entender o que é phishing','Reconhecer os sinais de um golpe','Saber o que fazer quando desconfiar'],ex:[
  {t:'info',q:'Phishing: a pescaria de dados',ana:'O golpista joga uma isca (uma mensagem bonita ou assustadora) e espera alguém morder. Por isso o nome vem de "fishing", pescar.',b:'<b>Phishing</b> é quando alguém se passa por uma empresa ou pessoa de confiança pra te fazer:\n• clicar num link falso\n• digitar sua senha numa página falsa\n• fazer um Pix\n• instalar um programa\n\nChega por e-mail, SMS, WhatsApp, Instagram e até ligação.'},
  {t:'info',q:'Os 4 sinais de golpe',b:'Desconfie quando a mensagem tem:\n• <b>Pressa</b>: "sua conta será bloqueada em 1 hora"\n• <b>Medo ou prêmio</b>: "você tem uma dívida" ou "você ganhou"\n• <b>Pedido incomum</b>: senha, código, Pix, dados do cartão\n• <b>Link ou remetente estranho</b>: <code>bradesco-seguro-atualiza.com</code> em vez do site oficial',tip:'A pressa é a arma principal do golpista. Quando sentir que precisa agir AGORA, pare e respire. Golpe odeia calma.'},
  {t:'mc',q:'Chega um SMS: "Seu CPF será bloqueado hoje. Regularize em: receita-cpf-regulariza.net". Qual é o sinal mais forte de golpe?',o:['É SMS','Pressa + link com endereço estranho','Fala em CPF','Chegou de manhã'],a:1,w:'Ameaça com prazo curto e um endereço que não é o oficial (gov.br). Golpe clássico.'},
  {t:'info',q:'O golpe do "novo número"',b:'Um dos golpes mais comuns no Brasil:\n\n1. Alguém manda mensagem com a foto de um parente: "Oi, troquei de número, salva esse"\n2. Logo depois: "Preciso pagar uma conta urgente, me faz um Pix que te devolvo amanhã?"\n\n<b>Como se proteger:</b> ligue pro número antigo da pessoa, ou faça uma pergunta que só ela saberia responder.',erro:'Confiar porque a foto é do parente. Qualquer um copia uma foto do Instagram em 2 segundos.'},
  {t:'mc',q:'Sua "prima" manda mensagem de um número novo pedindo um Pix urgente. O que você faz primeiro?',o:['Faz o Pix, é família','Liga pro número antigo dela pra confirmar','Pede o CPF dela','Manda o Pix pela metade'],a:1,w:'Confirme por outro caminho, que você já sabia antes. Se for ela mesmo, não custa nada esperar 1 minuto.'},
  {t:'info',q:'Olhe o endereço antes de clicar',b:'O que vale é o <b>domínio</b>: o nome que vem logo antes do <code>.com</code>, <code>.com.br</code> ou <code>.gov.br</code>.\n\n• <code>https://www.<b>nubank.com.br</b>/app</code>: oficial\n• <code>https://nubank.com.br.<b>seguro-login.top</b></code>: falso! O domínio real é seguro-login.top\n\nNo celular, segure o dedo no link (sem soltar) pra ver o endereço completo antes de abrir.'},
  {t:'mc',q:'Qual destes links é o verdadeiro do Instagram?',o:['instagram.com.verificar-conta.co','https://www.instagram.com/accounts','instagram-suporte.net','instagran.com'],a:1,w:'O domínio é instagram.com. Os outros só usam o nome pra enganar, ou trocam uma letra (instagran).'},
  {t:'build',q:'Coloque na ordem o que fazer ao receber uma mensagem suspeita:',o:['Não clicar no link','Confirmar por um canal oficial','Bloquear e denunciar'],a:['Não clicar no link','Confirmar por um canal oficial','Bloquear e denunciar'],w:'Primeiro não clica, depois confirma pelo app ou telefone oficial, e por fim bloqueia e denuncia.'}
 ]}
]},
{u:'Unidade 2',t:'Celular, computador e internet',l:[
 {n:'Atualizações e vírus',i:'🔄',obj:['Entender por que atualizar é proteção','Saber o que é malware','Instalar apps com segurança'],ex:[
  {t:'info',q:'Atualizar é tapar buracos',ana:'Pense num muro com uma rachadura que todo ladrão do bairro já conhece. A atualização é o pedreiro tapando a rachadura.',b:'Quando uma falha de segurança é descoberta num app ou sistema, a empresa corrige e manda uma <b>atualização</b>.\n\nO problema: depois que a correção sai, a falha fica famosa. Quem não atualiza fica com o "buraco" aberto que todo golpista já sabe usar.',tip:'Deixe as atualizações automáticas ligadas no celular, no computador e no navegador. É o cuidado que dá menos trabalho e mais protege.'},
  {t:'mc',q:'Por que é perigoso adiar as atualizações por meses?',o:['O celular fica mais lento','As falhas corrigidas ficam conhecidas e continuam abertas no seu aparelho','As atualizações vencem','Não é perigoso'],a:1,w:'Depois que a correção sai, os golpistas sabem exatamente qual falha atacar em quem não atualizou.'},
  {t:'info',q:'Malware: programa do mal',b:'<b>Malware</b> é qualquer programa feito pra prejudicar. Alguns tipos:\n• <b>Vírus e trojans</b>: se escondem em arquivos e apps que parecem normais\n• <b>Ransomware</b>: tranca seus arquivos e pede resgate pra devolver\n• <b>Spyware</b>: espiona o que você digita e vê\n\nA maioria entra porque <b>a própria pessoa instala</b>, achando que é outra coisa.',erro:'Baixar app "pirata", "versão premium grátis" ou APK de site desconhecido. É o jeito número 1 de colocar malware no celular.'},
  {t:'mc',q:'Qual destas é a forma mais segura de instalar um app no celular?',o:['Baixar o APK que um amigo mandou no WhatsApp','Pela loja oficial (Play Store ou App Store)','Por um site que oferece a versão premium grátis','Por um link que chegou por SMS'],a:1,w:'As lojas oficiais verificam os apps. Fora delas, o risco de malware é muito maior.'},
  {t:'info',q:'Cuidado com as permissões',b:'Ao instalar um app, ele pede permissões: câmera, contatos, localização, SMS...\n\nPergunte sempre: <b>faz sentido?</b>\n• Um app de lanterna pedindo seus contatos e SMS: não faz sentido, desconfie\n• Um app de mapa pedindo localização: faz sentido\n\nVocê pode revisar e tirar permissões em Configurações → Apps.'},
  {t:'mc',q:'Um app de calculadora pede acesso aos seus SMS. O que isso indica?',o:['Normal, toda calculadora precisa','Pedido suspeito: ele não precisa disso pra funcionar','Que ele é premium','Que o celular está atualizado'],a:1,w:'Acesso a SMS permite ler códigos de verificação. Uma calculadora não precisa disso.'}
 ]},
 {n:'Wi-Fi público e o cadeado',i:'📶',obj:['Saber os riscos do Wi-Fi público','Entender o que o cadeado (HTTPS) garante','Saber o que o cadeado NÃO garante'],ex:[
  {t:'info',q:'O cadeado do navegador',ana:'É como mandar uma carta num envelope lacrado em vez de um cartão-postal. No postal, o carteiro lê tudo. No envelope lacrado, só quem recebe abre.',b:'Quando o endereço começa com <code>https://</code> e aparece o cadeado, a conexão entre você e o site é <b>criptografada</b>: quem estiver no meio do caminho (no Wi-Fi, por exemplo) não consegue ler o que você envia.\n\nO <b>s</b> do https vem de "secure", seguro.'},
  {t:'info',q:'O cadeado NÃO quer dizer que o site é confiável',b:'Esse é o ponto mais importante:\n\nO cadeado garante que a conversa com o site é <b>privada</b>. Ele <b>não</b> garante que o site é <b>honesto</b>.\n\nSites de golpe também têm cadeado, porque o certificado é grátis. Um site falso do banco pode ter cadeado e mesmo assim roubar sua senha.',erro:'Pensar "tem cadeado, então é seguro". O cadeado protege o caminho, não diz quem está do outro lado. Sempre confira o domínio.'},
  {t:'mc',q:'O que o cadeado (https) garante?',o:['Que o site é da empresa oficial','Que a conexão é criptografada e ninguém no caminho lê seus dados','Que o site não tem vírus','Que o site é do governo'],a:1,w:'Ele protege o caminho. Quem é o dono do site você confere pelo domínio.'},
  {t:'info',q:'Wi-Fi público: aeroporto, café, rodoviária',b:'Em redes abertas, qualquer pessoa pode estar conectada junto com você, e existem até redes falsas com nomes como "Wifi_Gratis_Shopping".\n\nCuidados:\n• Prefira o <b>4G/5G</b> do seu celular pra entrar no banco ou digitar senhas\n• Confira o nome certo da rede com o estabelecimento\n• Desligue a conexão automática em redes abertas',tip:'Se precisar muito usar um Wi-Fi público, só acesse sites com https e evite o banco. Fica pro 4G.'},
  {t:'mc',q:'Você está no aeroporto e precisa fazer um Pix. Qual é a opção mais segura?',o:['Usar o Wi-Fi grátis do aeroporto','Usar os dados móveis (4G/5G) do seu celular','Usar a rede "Aeroporto_Free_VIP"','Pedir o celular de alguém emprestado'],a:1,w:'Os dados móveis não são compartilhados com estranhos. É bem mais seguro que uma rede aberta.'},
  {t:'mc',q:'Um site de golpe pode ter o cadeado?',o:['Não, nunca','Sim, o cadeado não prova que o site é honesto','Só se for do exterior','Só no computador'],a:1,w:'Qualquer site consegue um certificado grátis. Por isso o domínio importa mais que o cadeado.'}
 ]},
 {n:'Backup: a cópia que salva',i:'💾',obj:['Entender o que é backup','Aplicar a regra 3-2-1','Saber o que fazer backup no seu trabalho'],ex:[
  {t:'info',q:'Backup é a cópia de segurança',ana:'É como ter a chave reserva da casa guardada com alguém de confiança. Se perder a sua, você não fica na rua.',b:'<b>Backup</b> é uma cópia dos seus arquivos guardada em outro lugar.\n\nCelular roubado, computador queimado, ransomware, arquivo apagado sem querer: com backup, você perde <b>uma tarde</b>. Sem backup, você perde <b>tudo</b>.'},
  {t:'info',q:'A regra 3-2-1',b:'A regra que os profissionais usam:\n• <b>3</b> cópias dos arquivos importantes\n• em <b>2</b> lugares diferentes (ex.: computador e HD externo)\n• e <b>1</b> fora de casa (ex.: na nuvem, como Google Drive ou GitHub)\n\nAssim, nem um incêndio, nem um roubo, nem um vírus acabam com tudo de uma vez.',tip:'O código dos sites dos seus clientes no GitHub já conta como uma cópia fora de casa. Mantenha sempre atualizado.'},
  {t:'mc',q:'Na regra 3-2-1, o que significa o "1"?',o:['1 senha forte','1 cópia fora de casa, como na nuvem','1 computador só','Fazer backup 1 vez por ano'],a:1,w:'Uma cópia longe do lugar original protege contra roubo, incêndio e problemas no local.'},
  {t:'mc',q:'Um ransomware trancou todos os arquivos do seu computador. O que te salva sem pagar o resgate?',o:['Desligar o Wi-Fi','Um backup feito antes, guardado em outro lugar','Trocar a senha do e-mail','Formatar e torcer'],a:1,w:'Com um backup separado, você apaga tudo, restaura a cópia e segue a vida sem pagar nada.'},
  {t:'info',q:'Backup que não foi testado é só esperança',b:'De tempos em tempos, tente <b>restaurar</b> um arquivo do backup pra ver se funciona mesmo.\n\nMuita gente descobre que o backup estava desligado ou vazio justamente no dia em que precisa.',erro:'Guardar o backup no mesmo HD do computador. Se o HD queimar, vai original e cópia juntos.'},
  {t:'mc',q:'Qual destes NÃO é um bom backup?',o:['Cópia no Google Drive','Cópia num HD externo','Uma pasta "backup" dentro do mesmo computador','Código salvo no GitHub'],a:2,w:'Se o computador quebrar ou for infectado, a pasta de backup vai junto com ele.'}
 ]},
 {n:'Engenharia social e privacidade',i:'🕵️',obj:['Entender o que é engenharia social','Saber o que não expor nas redes','Conhecer o básico da LGPD'],ex:[
  {t:'info',q:'Hackear pessoas em vez de máquinas',ana:'Em vez de arrombar a porta, o ladrão se veste de entregador e pede pra você abrir. Você mesmo abre.',b:'<b>Engenharia social</b> é enganar pessoas pra que elas entreguem informações ou acessos por vontade própria.\n\nO golpista usa:\n• <b>confiança</b>: "sou do suporte", "sou seu gerente"\n• <b>ajuda</b>: "só preciso que você confirme um dado"\n• <b>autoridade</b>: "aqui é da polícia, do banco, da Receita"\n\nNa maioria dos ataques, a parte mais fácil de invadir é a pessoa, não o sistema.'},
  {t:'mc',q:'Alguém liga se dizendo "do suporte do VitrineAI" e pede sua senha pra "corrigir um erro". Isso é:',o:['Atendimento normal','Engenharia social','Uma atualização','Verificação em duas etapas'],a:1,w:'Suporte de verdade nunca precisa da sua senha. Ele está usando autoridade e ajuda pra te enganar.'},
  {t:'info',q:'O que você posta vira munição',b:'Golpistas montam o golpe com o que você mostra:\n• nome do pet, da mãe, data de nascimento: viram resposta de "pergunta secreta" e palpite de senha\n• foto do cartão, boleto, documento ou passagem: têm dados pra fraude\n• "viajando 15 dias!": avisa que a casa está vazia\n\nAntes de postar, pergunte: <b>um golpista poderia usar isso?</b>'},
  {t:'mc',q:'Qual destes posts é o mais arriscado?',o:['Foto do pôr do sol','Foto do cartão de crédito novo com o número aparecendo','Foto do almoço','Foto do treino'],a:1,w:'Número do cartão aparecendo é convite pra fraude. Nunca poste documentos, cartões ou boletos.'},
  {t:'info',q:'LGPD: a lei dos dados pessoais',b:'A <b>LGPD</b> (Lei Geral de Proteção de Dados) é a lei brasileira que diz como empresas podem usar dados pessoais: nome, telefone, CPF, endereço...\n\nNo seu trabalho isso importa porque:\n• o formulário de agendamento de um site <b>coleta dados</b> de pacientes\n• a clínica precisa avisar pra que usa esses dados (a página de <b>política de privacidade</b>)\n• você só deve pedir os dados que realmente precisa',tip:'No formulário de um site, peça só o essencial: nome e WhatsApp. Quanto menos dado você guarda, menos dado pode vazar.'},
  {t:'mc',q:'Num formulário de agendamento de clínica, o que é mais adequado pedir?',o:['Nome, WhatsApp, CPF, RG, renda e endereço completo','Só o necessário: nome e WhatsApp','A senha do e-mail do paciente','Nada, nem o nome'],a:1,w:'Pedir só o essencial respeita a LGPD e diminui o estrago se algo vazar.'}
 ]}
]},
{u:'Unidade 3',t:'Sites seguros pros seus clientes',l:[
 {n:'HTTPS e domínio do cliente',i:'🔒',obj:['Garantir HTTPS nos sites que você entrega','Entender quem deve ser dono do domínio','Proteger as contas de hospedagem'],ex:[
  {t:'info',q:'Todo site entregue precisa de HTTPS',b:'Hoje o HTTPS não é luxo, é o mínimo:\n• o Chrome mostra <b>"Não seguro"</b> em sites sem ele, e o paciente desiste\n• o Google coloca sites sem HTTPS mais pra baixo na busca\n• formulários sem HTTPS mandam os dados "em cartão-postal"\n\nBoa notícia: o <b>Vercel</b> e quase toda hospedagem moderna já colocam HTTPS sozinhos e de graça.',tip:'Depois de ligar o domínio do cliente no Vercel, abra o site e confira se o endereço começa com https:// e se tem o cadeado.'},
  {t:'mc',q:'Um site de clínica sem HTTPS. O que o paciente vê no Chrome?',o:['Nada de diferente','Um aviso de "Não seguro" perto do endereço','Uma estrela dourada','O site mais rápido'],a:1,w:'O navegador avisa "Não seguro", e isso derruba a confiança na clínica.'},
  {t:'info',q:'O domínio deve ser do cliente',b:'O <b>domínio</b> (ex.: <code>clinicasorriso.com.br</code>) é o endereço do negócio. Ele deve ficar registrado <b>no nome do cliente</b> (CPF ou CNPJ dele), no Registro.br.\n\nVocê pode ajudar a registrar e configurar, mas o dono é ele. Isso evita brigas e mostra profissionalismo.',erro:'Registrar o domínio do cliente no seu nome "pra facilitar". Se um dia vocês se desentenderem, o cliente fica preso e a sua reputação fica manchada.'},
  {t:'mc',q:'No nome de quem deve ficar o domínio do site da clínica?',o:['No seu nome, já que você fez o site','No nome do cliente (CPF ou CNPJ dele)','No nome do Vercel','De ninguém'],a:1,w:'O domínio é do negócio do cliente. Você ajuda a configurar, mas o titular é ele.'},
  {t:'info',q:'Proteja as contas que publicam os sites',b:'Quem entra na sua conta do <b>Vercel</b>, do <b>GitHub</b> ou do <b>Registro.br</b> pode tirar do ar ou trocar o site de <b>todos</b> os seus clientes.\n\nPor isso, nessas contas:\n• senha longa e única\n• verificação em duas etapas ligada\n• e-mail de recuperação também protegido',tip:'Comece por aqui: ligue a verificação em duas etapas no GitHub, no Vercel e no seu e-mail principal.'},
  {t:'mc',q:'Qual conta, se invadida, pode tirar do ar o site de TODOS os seus clientes?',o:['Sua conta da Netflix','Sua conta do Vercel ou do GitHub','Seu perfil no Pinterest','Sua conta do jogo'],a:1,w:'É de lá que os sites são publicados. Essas contas precisam da proteção mais forte.'}
 ]},
 {n:'Segredos fora do código',i:'🗝️',obj:['Saber o que é uma chave secreta','Entender por que o código do site é público','Diferenciar chave pública de chave secreta'],ex:[
  {t:'info',q:'Todo código do site é público',ana:'O HTML, o CSS e o JavaScript de um site são como a vitrine de uma loja: qualquer um que passa na rua consegue ver tudo que está ali.',b:'Qualquer pessoa pode ver o código de um site: no computador, é só apertar <code>Ctrl + U</code>.\n\nPor isso, <b>nunca</b> coloque no HTML ou no JavaScript do site:\n• senhas\n• chaves secretas de APIs (pagamento, IA, banco de dados)\n• tokens de acesso\n\nTudo que vai pro navegador, o visitante consegue ler.'},
  {t:'mc',q:'Você colocou a chave secreta de uma API de pagamento dentro do script do site. Quem consegue ver?',o:['Só você','Só o Vercel','Qualquer pessoa que abrir o código do site','Ninguém, porque está no JavaScript'],a:2,w:'O código do site vai inteiro pro navegador do visitante. Qualquer um consegue ler.'},
  {t:'info',q:'Chave pública x chave secreta',b:'Muitos serviços dão <b>duas</b> chaves:\n• <b>Pública</b> (publishable, anon): feita pra ficar no site. Sozinha ela não faz estrago, porque o servidor tem regras que limitam o que ela pode fazer\n• <b>Secreta</b> (secret, service_role): dá acesso total. Fica só no servidor, em <b>variáveis de ambiente</b>, nunca no código do site\n\nO Criate Academy usa a chave <b>pública</b> do Supabase no site, e as regras do banco garantem que cada pessoa só mexe no próprio progresso.',erro:'Colar a chave "service_role" ou "secret" no site pra "fazer funcionar mais rápido". Com ela, qualquer visitante pode ler e apagar o banco inteiro.'},
  {t:'mc',q:'Qual chave pode ficar no código de um site?',o:['A chave secreta (service_role)','A chave pública (publishable/anon), com regras de segurança no banco','A senha do banco de dados','Nenhuma chave pode, nunca'],a:1,w:'A chave pública foi feita pra isso, desde que o banco tenha regras protegendo os dados.'},
  {t:'info',q:'Vazou? Troque na hora',b:'Se uma chave secreta foi parar no código, no GitHub ou num print:\n1. <b>Gere uma chave nova</b> no painel do serviço e desative a antiga\n2. Coloque a nova numa variável de ambiente\n3. Apagar o arquivo não basta: o histórico do GitHub e os robôs já podem ter copiado',tip:'Existem robôs que vasculham o GitHub o tempo todo atrás de chaves esquecidas. Uma chave vazada pode ser usada em minutos.'},
  {t:'build',q:'Coloque na ordem o que fazer quando uma chave secreta vaza:',o:['Gerar uma chave nova e desativar a antiga','Guardar a nova numa variável de ambiente','Conferir se o serviço foi usado por alguém estranho'],a:['Gerar uma chave nova e desativar a antiga','Guardar a nova numa variável de ambiente','Conferir se o serviço foi usado por alguém estranho'],w:'Primeiro corta o acesso do invasor, depois guarda a nova chave do jeito certo e então investiga o estrago.'}
 ]},
 {n:'Formulários e textos de visitantes',i:'📝',obj:['Entender por que não confiar no que o visitante digita','Conhecer o ataque XSS de forma simples','Usar textContent em vez de innerHTML'],ex:[
  {t:'info',q:'Tudo que vem do visitante pode ser perigoso',ana:'É como receber um pacote de um desconhecido: você não sai abrindo dentro de casa sem olhar o que tem.',b:'Formulários, comentários, campos de busca: tudo que o visitante digita pode conter <b>código</b> em vez de texto normal.\n\nSe o site pega esse texto e coloca na página como HTML, o código do visitante <b>roda no site</b>. Esse ataque se chama <b>XSS</b> (cross-site scripting).'},
  {t:'info',q:'innerHTML x textContent',b:'No JavaScript, existem dois jeitos de colocar texto na página:\n• <code>innerHTML</code>: entende o texto como <b>HTML</b>. Se vier <code>&lt;img onerror=...&gt;</code>, ele executa\n• <code>textContent</code>: mostra o texto <b>exatamente como veio</b>, sem executar nada\n\nRegra prática: texto que veio do visitante sempre com <code>textContent</code>.',code:'const nome = campo.value;\n\n// perigoso: executa HTML\nsaudacao.innerHTML = "Oi, " + nome;\n\n// seguro: só mostra o texto\nsaudacao.textContent = "Oi, " + nome;'},
  {t:'mc',q:'Um visitante digitou código HTML no campo de nome. Qual linha mostra o nome sem executar nada?',o:['el.innerHTML = nome','el.textContent = nome','document.write(nome)','eval(nome)'],a:1,w:'textContent trata tudo como texto puro. O código aparece escrito, mas não roda.'},
  {t:'fill',q:'Complete para mostrar o comentário com segurança:',code:'caixa.___ = comentario;',o:['textContent','innerHTML','outerHTML','eval'],a:['textContent'],w:'textContent mostra o texto do visitante sem executar.'},
  {t:'info',q:'Validar no navegador ajuda, mas não basta',b:'O <code>required</code> e o <code>type="email"</code> do HTML ajudam o visitante a preencher certo. Mas eles rodam no navegador, e qualquer um consegue desligar.\n\nPor isso, quando um formulário manda dados pra um servidor ou banco, a verificação de verdade acontece <b>lá no servidor</b> também.',erro:'Achar que o required protege o banco de dados. Ele só ajuda quem está preenchendo de boa-fé.'},
  {t:'mc',q:'Onde fica a verificação que realmente protege os dados de um formulário?',o:['Só no required do HTML','No servidor ou banco, além do navegador','No CSS','Na cor do botão'],a:1,w:'O navegador pode ser burlado. A regra que vale de verdade fica no servidor.'}
 ]},
 {n:'Plano de segurança do freelancer',i:'✅',obj:['Juntar tudo num checklist','Saber o que fazer se uma conta for invadida','Passar segurança pro cliente'],ex:[
  {t:'info',q:'Seu checklist de segurança',b:'O que todo freelancer de sites deveria ter:\n• Gerenciador de senhas, com senha diferente em cada conta\n• Verificação em duas etapas no e-mail, GitHub, Vercel, WhatsApp e banco\n• Celular e computador atualizados\n• Backup dos projetos no GitHub e em outro lugar\n• Nenhuma chave secreta no código dos sites\n• Domínios no nome dos clientes',tip:'Não precisa fazer tudo hoje. Faça um item por dia esta semana e você vai estar mais protegido que a maioria das empresas.'},
  {t:'info',q:'Invadiram uma conta. E agora?',b:'Se perceber que entraram numa conta sua:\n1. <b>Troque a senha</b> na hora (de um aparelho que você confia)\n2. <b>Encerre as outras sessões</b>: quase todo app tem "sair de todos os aparelhos"\n3. <b>Ligue a verificação em duas etapas</b>, se ainda não estava\n4. <b>Avise seus contatos</b>, se o golpista pode ter mandado mensagens\n5. Se usava a mesma senha em outro lugar, troque lá também',erro:'Ficar com vergonha e não avisar ninguém. Avisar rápido impede que seus contatos caiam no golpe em seu nome.'},
  {t:'mc',q:'Seu Instagram foi invadido e você conseguiu entrar de novo. Qual é o primeiro passo?',o:['Postar uma foto','Trocar a senha e encerrar as sessões em outros aparelhos','Apagar o app','Esperar pra ver se acontece de novo'],a:1,w:'Trocar a senha e derrubar as sessões tira o invasor da conta. Depois vem a verificação em duas etapas.'},
  {t:'info',q:'Segurança também vende',b:'Clientes confiam mais em quem cuida dos dados deles. Você pode mencionar na proposta:\n• "site com HTTPS (cadeado de segurança)"\n• "domínio registrado no seu nome"\n• "formulário que pede só o necessário"\n• "backup do site guardado"\n\nIsso diferencia você de quem só entrega "um site bonito".'},
  {t:'mc',q:'Qual frase passa mais confiança pra uma clínica numa proposta?',o:['"Faço o site rapidinho, sem burocracia"','"O site vem com HTTPS, o domínio fica no nome da clínica e eu guardo um backup"','"Uso a mesma senha pra todos os clientes, fica mais fácil"','"Segurança é coisa de banco"'],a:1,w:'Mostra cuidado com o que é do cliente. Isso é profissionalismo e ajuda a fechar.'},
  {t:'build',q:'Monte a ordem de prioridade pra começar hoje:',o:['Verificação em duas etapas no e-mail','Gerenciador de senhas','Atualizar celular e computador'],a:['Verificação em duas etapas no e-mail','Gerenciador de senhas','Atualizar celular e computador'],w:'O e-mail recupera todas as outras contas, então ele vem primeiro. Depois senhas únicas e, por fim, os aparelhos em dia.'}
 ]}
]}]},
{id:'cibermed',cat:'sec',nome:'Segurança intermediária',icone:'🛡️',cor:'#0B5F67',req:'ciber',sub:'Contas, redes, aparelhos e golpes avançados',nivel:'Intermediário',meta:'Organizar todas as suas senhas num gerenciador, usar chaves de acesso, proteger o e-mail e o roteador, entender como a internet funciona por baixo e se defender de golpes como clonagem de chip, boleto falso e voz falsa.',units:[
{u:'Unidade 1',t:'Contas blindadas',l:[
 {n:'Gerenciador de senhas na prática',i:'🔐',obj:['Escolher e configurar um gerenciador','Migrar suas senhas aos poucos','Entender por que ele é seguro'],ex:[
  {t:'info',q:'Do básico pro prático',b:'No básico você aprendeu <b>por que</b> usar um gerenciador de senhas. Agora vamos ao <b>como</b>.\n\nUm gerenciador faz 3 coisas:\n1. <b>Guarda</b> todas as senhas num cofre criptografado\n2. <b>Cria</b> senhas longas e aleatórias pra você\n3. <b>Preenche</b> sozinho nos sites e apps certos'},
  {t:'info',q:'Por que ele é seguro, se guarda tudo junto?',ana:'É como um cofre de banco: tudo valioso fica num lugar só, mas esse lugar tem a melhor tranca da cidade, e só você tem a combinação.',b:'O cofre é <b>criptografado</b> com a sua senha mestra, no seu aparelho. A empresa do gerenciador guarda só o cofre trancado: nem ela consegue abrir.\n\nPor isso a <b>senha mestra</b> precisa ser forte (uma frase de 4 a 5 palavras) e você <b>não pode esquecer</b>.',erro:'Usar como senha mestra uma senha que você já usa em outro lugar. Se ela vazar lá, seu cofre inteiro fica em risco.'},
  {t:'mc',q:'Se a empresa do gerenciador for invadida, por que suas senhas continuam protegidas?',o:['Porque ela apaga tudo','Porque o cofre está criptografado com a sua senha mestra, que só você sabe','Porque ninguém invade gerenciador','Porque as senhas são curtas'],a:1,w:'O invasor leva um cofre trancado. Sem a sua senha mestra, ele não abre.'},
  {t:'info',q:'Migrando sem sofrimento',b:'Não precisa trocar tudo num dia. Faça assim:\n1. <b>Hoje:</b> instale o gerenciador e crie a senha mestra\n2. <b>Esta semana:</b> troque as senhas das contas mais importantes: e-mail, banco, GitHub, Vercel, WhatsApp Web\n3. <b>Depois:</b> sempre que entrar num site, deixe o gerenciador salvar ou trocar a senha\n\nEm um mês, quase tudo estará organizado sem esforço.',tip:'O Google Gerenciador de Senhas já vem no Chrome e no Android. O Bitwarden é gratuito e funciona em tudo. Escolha um só e use sempre.'},
  {t:'build',q:'Coloque na ordem a migração pro gerenciador:',o:['Instalar e criar a senha mestra','Trocar as senhas das contas mais importantes','Ir salvando as outras conforme usar'],a:['Instalar e criar a senha mestra','Trocar as senhas das contas mais importantes','Ir salvando as outras conforme usar'],w:'Do mais importante pro menos, sem tentar fazer tudo de uma vez.'},
  {t:'mc',q:'Quais contas você deve migrar PRIMEIRO?',o:['Jogos e redes que você quase não usa','E-mail, banco e as contas que publicam os sites dos clientes','Sites de receita','Tanto faz'],a:1,w:'São as contas que, se invadidas, causam mais estrago.'},
  {t:'info',q:'Resumo da lição',b:'• O gerenciador <b>guarda, cria e preenche</b> senhas\n• O cofre é <b>criptografado</b> com a senha mestra, que só você sabe\n• Migre aos poucos, começando por <b>e-mail, banco e contas de trabalho</b>'}
 ]},
 {n:'Chaves de acesso (passkeys)',i:'🗝️',obj:['Entender o que é uma chave de acesso','Saber por que ela resiste a phishing','Ativar onde estiver disponível'],ex:[
  {t:'info',q:'O fim da senha?',b:'A <b>chave de acesso</b> (em inglês, <i>passkey</i>) é um jeito novo de entrar nas contas <b>sem senha</b>. Você confirma com a digital, o rosto ou o PIN do celular.\n\nGoogle, Apple, Microsoft, GitHub, WhatsApp e muitos bancos já aceitam.'},
  {t:'info',q:'Como funciona, sem complicação',ana:'É como uma fechadura que só abre com uma chave que nunca sai do seu bolso. Você não entrega a chave pra ninguém: você só mostra que ela está com você.',b:'Quando você cria uma chave de acesso, o celular gera um <b>par de chaves</b>:\n• uma <b>privada</b>, que fica guardada no seu aparelho e nunca sai dele\n• uma <b>pública</b>, que fica com o site\n\nNa hora de entrar, o site faz um "desafio" e só o seu aparelho consegue responder. Nada de segredo trafega pela internet.'},
  {t:'info',q:'Por que ela vence o phishing',b:'Com senha, um site falso consegue te enganar: você digita a senha nele e pronto, ela foi roubada.\n\nCom chave de acesso, isso <b>não funciona</b>: a chave é ligada ao endereço do site verdadeiro. Num site falso, o celular simplesmente não oferece a chave.',tip:'Sempre que um site oferecer "criar chave de acesso", aceite. É mais seguro e mais rápido que senha.'},
  {t:'mc',q:'Por que a chave de acesso protege contra site falso?',o:['Porque é mais longa','Porque é ligada ao endereço do site verdadeiro e não funciona no falso','Porque muda todo dia','Porque é enviada por SMS'],a:1,w:'O celular só usa a chave no site certo. O golpista não tem o que roubar.'},
  {t:'mc',q:'Onde fica guardada a chave PRIVADA?',o:['No site','No seu aparelho (e no gerenciador, se você sincronizar)','Num e-mail','No SMS'],a:1,w:'Ela nunca é enviada pro site. É por isso que vazamento de site não expõe sua chave.'},
  {t:'info',q:'Resumo da lição',b:'• Chave de acesso = entrar com <b>digital, rosto ou PIN</b>, sem senha\n• A chave privada <b>nunca sai</b> do seu aparelho\n• Ela <b>não funciona em site falso</b>, por isso vence o phishing\n• Ative sempre que o site oferecer'}
 ]},
 {n:'Recuperação de conta',i:'🧯',obj:['Configurar e-mail e telefone de recuperação','Guardar os códigos de backup','Saber o que fazer se perder o celular'],ex:[
  {t:'info',q:'O dia em que você perde o celular',b:'Com verificação em duas etapas, o celular vira a sua "segunda chave". Mas e se ele for roubado ou quebrar?\n\nSe você não se preparou antes, pode ficar <b>trancado pra fora</b> das próprias contas. Esta lição evita isso.'},
  {t:'info',q:'Os códigos de backup',b:'Quando você liga a verificação em duas etapas, a maioria dos serviços oferece <b>códigos de backup</b>: uma lista de 8 a 10 códigos de uso único.\n\nCada código substitui o celular <b>uma vez</b>. Guarde num lugar seguro e fora do celular:\n• impresso, numa gaveta em casa\n• ou no gerenciador de senhas',erro:'Salvar os códigos de backup numa foto na galeria do celular. Se perder o celular, perde os códigos junto.'},
  {t:'mc',q:'Pra que servem os códigos de backup?',o:['Pra deixar a senha mais curta','Pra entrar na conta se você perder o celular da verificação','Pra desligar o antivírus','Pra pagar boletos'],a:1,w:'Eles substituem o celular uma vez cada, em emergências.'},
  {t:'info',q:'E-mail e telefone de recuperação',b:'Confira hoje, nas contas principais:\n• o <b>e-mail de recuperação</b> é um e-mail que você ainda usa\n• o <b>telefone</b> está certo\n\nNo Google: myaccount.google.com → Segurança. Lá também aparece a lista de aparelhos conectados, pra você remover os que não reconhece.'},
  {t:'info',q:'O e-mail é a chave mestra',b:'Quase todo serviço tem "esqueci minha senha", que manda um link pro seu <b>e-mail</b>. Ou seja: quem controla seu e-mail consegue entrar em quase tudo.\n\nPor isso o e-mail principal merece a proteção mais forte: senha única, chave de acesso ou app autenticador, e códigos de backup guardados.'},
  {t:'mc',q:'Por que o e-mail é a conta mais importante de proteger?',o:['Porque recebe propaganda','Porque o "esqueci minha senha" de quase tudo manda o link pra ele','Porque é grátis','Porque tem fotos'],a:1,w:'Quem controla o e-mail consegue redefinir a senha de quase todas as outras contas.'},
  {t:'info',q:'Resumo da lição',b:'• Guarde os <b>códigos de backup</b> fora do celular\n• Confira <b>e-mail e telefone de recuperação</b>\n• Revise os <b>aparelhos conectados</b> e remova os desconhecidos\n• O <b>e-mail</b> é a chave mestra: proteja ele primeiro'}
 ]},
 {n:'Vazamentos de dados',i:'💧',obj:['Entender o que é um vazamento','Descobrir se seu e-mail já vazou','Saber o que fazer depois'],ex:[
  {t:'info',q:'O que é um vazamento',b:'Um <b>vazamento</b> acontece quando um site ou empresa é invadido e os dados dos clientes são copiados: e-mails, senhas, telefones, CPFs.\n\nEsses dados vão parar em listas vendidas ou compartilhadas entre golpistas. O Brasil já teve vazamentos gigantes, com dados de quase toda a população.'},
  {t:'info',q:'Seu e-mail já vazou?',b:'O site <b>haveibeenpwned.com</b> (se lê "révi-bin-pónd") é mantido por um especialista em segurança e é usado no mundo todo. Você digita seu e-mail e ele mostra em quais vazamentos públicos ele apareceu.\n\nO próprio Google também avisa no <b>Gerenciador de Senhas</b> → Verificação de senhas, quando alguma senha salva aparece em vazamentos.',tip:'Aparecer na lista é muito comum e não quer dizer que sua conta foi invadida. Quer dizer que é hora de trocar a senha daquele serviço e de qualquer outro onde você repetiu ela.'},
  {t:'mc',q:'Seu e-mail apareceu num vazamento de uma loja online. O que fazer?',o:['Apagar o e-mail','Trocar a senha daquela loja e de qualquer lugar onde usou a mesma senha','Nada, é normal','Mudar de celular'],a:1,w:'O risco é o reuso: troque a senha vazada em todos os lugares onde ela foi usada.'},
  {t:'info',q:'Vazamento também alimenta golpes',b:'Com seu nome, CPF e telefone vazados, o golpista monta um golpe que parece real: "Olá, Fabiano, seu CPF terminado em 123 tem uma pendência".\n\nPor isso: <b>saber seus dados não prova que a pessoa é do banco</b>. Desconfie de quem liga ou escreve com seus dados certinhos pedindo ação urgente.',erro:'Confiar numa ligação "do banco" só porque a pessoa sabia seu nome completo e CPF. Esses dados circulam em vazamentos.'},
  {t:'mc',q:'Alguém liga dizendo seu nome completo e CPF e pede um código. Isso prova que é o banco?',o:['Sim, só o banco sabe isso','Não, esses dados podem ter vindo de vazamentos','Sim, se a pessoa for educada','Sim, se for de manhã'],a:1,w:'Dados vazados circulam. Desligue e ligue você mesmo no número oficial.'},
  {t:'info',q:'Resumo da lição',b:'• Vazamentos são <b>comuns</b>: seus dados provavelmente já estão em algum\n• Confira em <b>haveibeenpwned.com</b> e na verificação de senhas do Google\n• Troque senhas vazadas <b>em todo lugar onde foram repetidas</b>\n• Saber seus dados <b>não prova</b> que é o banco'}
 ]}
]},
{u:'Unidade 2',t:'Redes e aparelhos',l:[
 {n:'Como a internet funciona por baixo',i:'🌐',obj:['Entender IP, DNS e HTTP de forma simples','Saber onde cada ataque acontece','Ler um endereço de site com atenção'],ex:[
  {t:'info',q:'O caminho de um clique',ana:'Mandar uma carta: você escreve o nome da pessoa, o correio descobre o endereço, e a carta viaja por vários lugares até chegar.',b:'Quando você abre <code>criate.com.br</code>, acontecem 3 coisas:\n1. <b>DNS</b>: o "catálogo telefônico" da internet troca o nome pelo endereço numérico (o <b>IP</b>, tipo <code>76.76.21.21</code>)\n2. Seu aparelho se conecta a esse IP, passando por vários roteadores no caminho\n3. <b>HTTP(S)</b>: seu navegador pede a página e o servidor responde'},
  {t:'mc',q:'O que o DNS faz?',o:['Deixa a internet mais rápida','Troca o nome do site pelo endereço numérico (IP)','Guarda suas senhas','Bloqueia vírus'],a:1,w:'É o catálogo telefônico: nome → número.'},
  {t:'info',q:'Onde os ataques acontecem',b:'• <b>No DNS</b>: um roteador invadido pode mandar você pra um IP falso mesmo digitando o endereço certo\n• <b>No caminho</b>: numa rede aberta, alguém pode tentar ler o que passa. O HTTPS resolve isso\n• <b>No site</b>: o servidor pode ter falhas (isso é o curso avançado)\n• <b>Em você</b>: phishing e engenharia social'},
  {t:'mc',q:'O HTTPS protege principalmente qual parte?',o:['O DNS','O caminho entre você e o site','A sua memória','O preço do site'],a:1,w:'Ele criptografa o caminho, então quem está no meio não consegue ler.'},
  {t:'info',q:'Lendo um endereço como profissional',b:'Um endereço tem partes. Vamos desmontar este:\n<code>https://painel.criate.com.br/login</code>\n\n• <code>https://</code> → conexão criptografada\n• <code>painel.</code> → subdomínio (uma "sala" do site)\n• <code>criate.com.br</code> → <b>domínio</b>: quem é o dono\n• <code>/login</code> → a página\n\nO que define o dono é <b>o que vem logo antes do .com.br</b> (ou .com). Tudo à esquerda disso pode ser inventado por qualquer um.'},
  {t:'mc',q:'Quem é o dono de <code>nubank.com.br.conta-segura.net/entrar</code>?',o:['nubank.com.br','conta-segura.net','entrar','Ninguém'],a:1,w:'O domínio é o que vem antes da última terminação: conta-segura.net. O "nubank.com.br" ali é só enfeite pra enganar.'},
  {t:'info',q:'Resumo da lição',b:'• <b>DNS</b> troca nome por IP · <b>HTTPS</b> protege o caminho\n• Ataques podem estar no DNS, no caminho, no site ou em você\n• O dono do site é o <b>domínio</b>: o que vem logo antes do .com / .com.br'}
 ]},
 {n:'O roteador de casa',i:'📡',obj:['Trocar a senha de fábrica do roteador','Usar a proteção WPA2 ou WPA3','Criar uma rede de visitantes'],ex:[
  {t:'info',q:'A porta de entrada da casa',b:'Todo celular, computador e TV da sua casa passa pelo <b>roteador</b>. Se ele estiver mal configurado, tudo fica exposto.\n\nO problema mais comum: o roteador ainda com a <b>senha de fábrica</b> (tipo <code>admin/admin</code>). Essas senhas estão na internet, na página do fabricante.'},
  {t:'info',q:'Duas senhas diferentes',b:'O roteador tem <b>duas</b> senhas, e as pessoas confundem:\n• a senha do <b>Wi-Fi</b>: pra se conectar à rede\n• a senha do <b>painel do roteador</b>: pra mudar as configurações (fica num endereço tipo <code>192.168.0.1</code>)\n\nAs duas precisam ser trocadas e fortes.',erro:'Trocar só a senha do Wi-Fi e deixar o painel com admin/admin. Qualquer pessoa conectada pode entrar e mudar o DNS do roteador.'},
  {t:'mc',q:'Por que é perigoso deixar o painel do roteador com a senha de fábrica?',o:['A internet fica lenta','Qualquer um na rede pode mudar as configurações, até o DNS','O Wi-Fi some','Não é perigoso'],a:1,w:'Com o DNS trocado, você pode ser levado a sites falsos mesmo digitando o endereço certo.'},
  {t:'info',q:'Configurações que importam',b:'No painel do roteador, confira:\n• <b>Segurança do Wi-Fi:</b> WPA2 ou, melhor, <b>WPA3</b>. Nunca "aberta" nem WEP\n• <b>WPS</b>: o botão de conectar sem senha. Se não usa, desligue\n• <b>Atualização</b> (firmware): procure a opção de atualizar\n• <b>Rede de visitantes</b>: uma rede separada pra visitas, sem acesso aos seus aparelhos',tip:'Se o roteador é da operadora, ligue pra eles e peça pra atualizar e trocar a senha do painel. É um direito seu.'},
  {t:'mc',q:'Qual proteção de Wi-Fi é a mais segura?',o:['Aberta','WEP','WPA3','Sem senha com nome escondido'],a:2,w:'WPA3 é a mais atual. WPA2 ainda é aceitável. WEP é quebrada há anos.'},
  {t:'info',q:'Resumo da lição',b:'• Troque a senha do <b>Wi-Fi</b> e a do <b>painel</b>\n• Use <b>WPA2 ou WPA3</b>, desligue o WPS se não usa\n• Atualize o roteador\n• Crie uma <b>rede de visitantes</b>'}
 ]},
 {n:'VPN: o que é e o que não é',i:'🧭',obj:['Entender o que uma VPN faz','Saber quando ela ajuda','Não cair em propaganda exagerada'],ex:[
  {t:'info',q:'Um túnel pra sua conexão',ana:'É como andar por um túnel fechado no meio de uma rua movimentada: quem está na rua não vê o que você carrega.',b:'A <b>VPN</b> cria um túnel criptografado entre seu aparelho e um servidor da empresa da VPN. Daí em diante, seus dados saem pra internet a partir desse servidor.\n\nQuem está na mesma rede que você (no Wi-Fi do aeroporto, por exemplo) só vê que você está usando VPN, e não o que você acessa.'},
  {t:'info',q:'O que a VPN NÃO faz',b:'Muita propaganda exagera. A VPN <b>não</b>:\n• te protege de <b>phishing</b> (site falso continua falso)\n• te protege de <b>vírus</b> que você instalar\n• te deixa <b>anônimo</b> pros sites onde você está logado\n• substitui o <b>HTTPS</b>\n\nE atenção: a empresa da VPN passa a ver o seu tráfego. Por isso, VPN grátis e desconhecida é um risco: o produto pode ser você.',erro:'Achar que, com VPN, pode clicar em qualquer link. O golpe do link falso funciona igual com ou sem VPN.'},
  {t:'mc',q:'Com VPN ligada, você clicou num link de banco falso. O que acontece?',o:['A VPN bloqueia o golpe','O golpe funciona igual: VPN não protege contra site falso','O banco te avisa','O link não abre'],a:1,w:'A VPN protege o caminho, não decide se o site é honesto.'},
  {t:'mc',q:'Quando a VPN ajuda de verdade?',o:['Em Wi-Fi público, protegendo o caminho dos seus dados','Pra baixar app pirata com segurança','Pra evitar phishing','Pra deixar a senha mais forte'],a:0,w:'Rede pública desconhecida é o uso mais claro de uma VPN confiável.'},
  {t:'info',q:'Resumo da lição',b:'• VPN = <b>túnel criptografado</b> até o servidor da VPN\n• Ajuda em <b>redes públicas</b>\n• <b>Não</b> protege contra phishing, vírus, nem te deixa anônimo\n• Evite VPN grátis desconhecida'}
 ]},
 {n:'Celular blindado',i:'📱',obj:['Configurar bloqueio de tela forte','Ativar localizar e apagar à distância','Revisar apps e permissões'],ex:[
  {t:'info',q:'Seu celular é sua identidade',b:'No celular estão: WhatsApp, e-mail, banco, códigos de verificação, fotos de documentos e as contas dos clientes. Ele é a <b>chave de quase tudo</b>.\n\nSe for roubado desbloqueado, o estrago é enorme. Por isso o bloqueio de tela é a primeira linha de defesa.'},
  {t:'info',q:'Bloqueio de tela',b:'Do mais fraco pro mais forte:\n• <b>Sem bloqueio</b> ou deslizar: nenhuma proteção\n• <b>Desenho (padrão)</b>: dá pra adivinhar pelas marcas de dedo na tela\n• <b>PIN de 4 números</b>: fraco\n• <b>PIN de 6 números ou senha</b> + digital/rosto: bom\n\nA digital ou o rosto são a parte prática. O PIN forte é a proteção por trás.',tip:'Celular Android e iPhone com bloqueio já ficam criptografados. Sem o PIN, os dados ficam ilegíveis mesmo se tirarem o chip de memória.'},
  {t:'mc',q:'Qual bloqueio é o mais seguro?',o:['Deslizar','Desenho simples','PIN de 6 dígitos com digital','PIN 1234'],a:2,w:'PIN longo protege e a digital deixa prático no dia a dia.'},
  {t:'info',q:'Se for roubado',b:'Ative <b>antes</b> que aconteça:\n• Android: <b>Encontre Meu Dispositivo</b> (google.com/android/find)\n• iPhone: <b>Buscar</b>\n\nCom isso dá pra localizar, bloquear e até <b>apagar tudo à distância</b>. Nos celulares mais novos existe também a proteção contra roubo, que bloqueia a tela quando detecta um puxão.\n\nE no WhatsApp: ative a confirmação em duas etapas, pra ninguém reinstalar sua conta em outro aparelho.'},
  {t:'build',q:'Celular roubado. Coloque na ordem o que fazer:',o:['Bloquear ou apagar pelo Encontre Meu Dispositivo','Pedir ao banco pra bloquear os apps e cartões','Pedir à operadora pra bloquear o chip'],a:['Bloquear ou apagar pelo Encontre Meu Dispositivo','Pedir ao banco pra bloquear os apps e cartões','Pedir à operadora pra bloquear o chip'],w:'Primeiro tranca o aparelho, depois protege o dinheiro, depois o número.'},
  {t:'info',q:'Resumo da lição',b:'• <b>PIN de 6 dígitos</b> + digital/rosto\n• Ative <b>Encontre Meu Dispositivo</b> / <b>Buscar</b> hoje\n• Confirmação em duas etapas no <b>WhatsApp</b>\n• Revise apps e permissões de tempos em tempos'}
 ]}
]},
{u:'Unidade 3',t:'Golpes avançados',l:[
 {n:'Clonagem de chip (SIM swap)',i:'📶',obj:['Entender como clonam um número','Perceber os sinais','Se proteger sem depender de SMS'],ex:[
  {t:'info',q:'Roubar o número sem tocar no celular',b:'No <b>SIM swap</b>, o golpista convence a operadora (às vezes com ajuda de um funcionário, ou com documentos falsos) a passar o seu número pra um chip dele.\n\nA partir daí, <b>ele recebe seus SMS</b>, inclusive códigos de verificação de banco e redes sociais.'},
  {t:'info',q:'Os sinais',b:'• Seu celular fica <b>sem sinal</b> de repente, mostrando "sem serviço" ou "só emergência", num lugar onde sempre funciona\n• Chegam e-mails de "senha alterada" ou "novo login" que você não fez\n\nSe acontecer, aja rápido: ligue pra operadora de outro telefone e avise o banco.'},
  {t:'mc',q:'Seu celular perdeu o sinal do nada e chegou um e-mail "sua senha foi alterada". O que pode ser?',o:['Só chuva','Possível clonagem do chip (SIM swap)','Atualização normal','Bateria fraca'],a:1,w:'Essa combinação é o sinal clássico. Ligue pra operadora de outro telefone na hora.'},
  {t:'info',q:'A proteção de verdade',b:'O SIM swap só funciona contra quem depende de <b>SMS</b>. Então:\n• use <b>app autenticador ou chave de acesso</b> no lugar de SMS sempre que der\n• na operadora, peça pra cadastrar uma <b>senha ou PIN de atendimento</b>\n• não exponha seu número e CPF juntos em lugares públicos',tip:'Ligue a confirmação em duas etapas do WhatsApp: mesmo com o chip clonado, o golpista não consegue ativar sua conta sem o PIN.'},
  {t:'mc',q:'Qual é a melhor proteção contra SIM swap?',o:['Trocar de celular','Usar app autenticador ou chave de acesso em vez de código por SMS','Desligar o Wi-Fi','Usar só chamadas'],a:1,w:'Se nenhum código importante chega por SMS, roubar o número perde a graça.'},
  {t:'info',q:'Resumo da lição',b:'• SIM swap = passarem <b>seu número</b> pra outro chip\n• Sinais: <b>sem sinal do nada</b> + e-mails de login estranhos\n• Proteção: <b>sair do SMS</b>, PIN na operadora, duas etapas no WhatsApp'}
 ]},
 {n:'Boleto e Pix falsos',i:'🧾',obj:['Reconhecer boleto adulterado','Conferir o destinatário antes de pagar','Proteger os pagamentos dos seus clientes'],ex:[
  {t:'info',q:'O golpe que mexe na integridade',b:'Lembra do pilar <b>integridade</b>? Estes golpes atacam ele: a cobrança parece verdadeira, mas o código de barras ou a chave Pix foram <b>trocados</b> pra conta do golpista.\n\nAcontece por e-mail falso, PDF alterado, vírus no computador ou até por alguém se passando pela empresa no WhatsApp.'},
  {t:'info',q:'A regra de ouro: confira quem recebe',b:'Antes de confirmar qualquer pagamento, o app do banco mostra <b>quem vai receber</b>: nome e CPF/CNPJ (parcial).\n\n<b>Pare e leia.</b> Se você está pagando a conta de luz e aparece "Maria da Silva", é golpe.',erro:'Confirmar o Pix no automático, sem ler o nome do recebedor. Esse segundo de atenção salva a maioria dos casos.'},
  {t:'mc',q:'Você vai pagar o boleto da internet e o banco mostra o recebedor "J. Santos Comércio ME". O que fazer?',o:['Pagar, deve ser o nome oficial','Parar e conferir com a empresa pelo canal oficial, porque o nome não bate','Pagar metade','Pagar duas vezes'],a:1,w:'Se o recebedor não é a empresa que você conhece, não pague até confirmar.'},
  {t:'info',q:'No seu trabalho',b:'Quando você cobrar clientes:\n• envie a chave Pix <b>sempre do mesmo jeito</b> e avise: "minha chave é sempre esta, desconfie de qualquer outra"\n• prefira chave com seu nome ou CNPJ, que aparece no app do cliente\n• se trocar de conta, avise por ligação, não só por mensagem\n\nIsso protege o seu cliente e o seu dinheiro.'},
  {t:'mc',q:'Como você protege seus clientes de um golpista que se passe por você pra cobrar?',o:['Mandando chaves Pix diferentes a cada cobrança','Usando sempre a mesma chave, no seu nome, e avisando que ela não muda','Pedindo pra pagarem em dinheiro na rua','Não cobrando'],a:1,w:'Padrão fixo e nome conferível tornam qualquer cobrança falsa fácil de perceber.'},
  {t:'info',q:'Resumo da lição',b:'• Boleto e Pix falsos <b>trocam o destino</b> do dinheiro\n• <b>Leia o nome do recebedor</b> antes de confirmar\n• Nas suas cobranças: <b>chave fixa, no seu nome</b>, e avise os clientes'}
 ]},
 {n:'Voz e vídeo falsos',i:'🎭',obj:['Saber que IA consegue imitar voz e rosto','Criar uma palavra-código com a família','Confirmar pedidos de dinheiro por outro canal'],ex:[
  {t:'info',q:'A voz no áudio pode não ser de quem parece',b:'Hoje, com poucos segundos de áudio de uma pessoa (tirados de um vídeo no Instagram, por exemplo), programas de IA conseguem <b>imitar a voz</b> dela. O mesmo vale pra vídeos com rosto trocado (<i>deepfake</i>).\n\nGolpistas usam isso pra mandar áudios "do filho", "da mãe" ou "do chefe" pedindo dinheiro com urgência.'},
  {t:'mc',q:'Recebeu um áudio com a voz idêntica a de um parente pedindo um Pix urgente. Isso prova que é ele?',o:['Sim, a voz é igual','Não, a voz pode ser imitada por IA','Sim, se o áudio for curto','Sim, se tiver foto'],a:1,w:'Voz parecida já não é prova. Confirme por outro canal.'},
  {t:'info',q:'Duas defesas simples',b:'1. <b>Palavra-código da família:</b> combinem pessoalmente uma palavra secreta. Pedido de dinheiro urgente? Pergunte a palavra.\n2. <b>Confirme por outro canal:</b> desligue e ligue você mesmo pro número que já conhece, ou faça uma pergunta que só a pessoa saberia.',tip:'Combine a palavra-código ao vivo, nunca por mensagem. E não poste ela em lugar nenhum.'},
  {t:'mc',q:'Qual é a melhor forma de confirmar um pedido de dinheiro suspeito?',o:['Pedir mais um áudio','Ligar você mesmo pro número que já conhece ou perguntar a palavra-código','Mandar metade do valor','Pedir uma selfie'],a:1,w:'Outro canal e um segredo combinado vencem qualquer imitação.'},
  {t:'info',q:'Resumo da lição',b:'• IA consegue <b>imitar voz e rosto</b>\n• Voz parecida <b>não é prova</b>\n• Use <b>palavra-código</b> com a família\n• Confirme <b>por outro canal</b> antes de qualquer Pix urgente'}
 ]},
 {n:'Plano de segurança pessoal',i:'🗂️',obj:['Juntar tudo do nível intermediário','Montar sua rotina de manutenção','Saber reagir a um incidente'],ex:[
  {t:'info',q:'Seu plano em uma tela',b:'<b>Uma vez (e pronto):</b>\n• gerenciador de senhas + senha mestra forte\n• chaves de acesso onde der, app autenticador no resto\n• códigos de backup guardados fora do celular\n• Encontre Meu Dispositivo ativo, PIN de 6 dígitos\n• roteador com senhas trocadas e WPA2/WPA3\n• palavra-código com a família\n\n<b>Todo mês (10 minutos):</b>\n• atualizar celular, computador e roteador\n• revisar aparelhos conectados no Google\n• conferir a verificação de senhas do gerenciador'},
  {t:'mc',q:'Qual destas tarefas é MENSAL, e não de uma vez só?',o:['Criar a senha mestra','Combinar a palavra-código','Revisar atualizações e aparelhos conectados','Instalar o gerenciador'],a:2,w:'Atualizações e aparelhos conectados mudam com o tempo. Vale revisar sempre.'},
  {t:'info',q:'Quando algo der errado',b:'1. <b>Isole</b>: troque a senha da conta afetada de um aparelho confiável\n2. <b>Corte o acesso</b>: "sair de todos os aparelhos"\n3. <b>Proteja o dinheiro</b>: avise o banco se houver risco financeiro\n4. <b>Avise</b> contatos e clientes que podem receber mensagens falsas\n5. <b>Aprenda</b>: descubra como aconteceu pra não repetir'},
  {t:'build',q:'Coloque o plano de reação na ordem:',o:['Trocar a senha da conta afetada','Sair de todos os aparelhos','Avisar o banco, se tiver risco de dinheiro','Avisar contatos e clientes'],a:['Trocar a senha da conta afetada','Sair de todos os aparelhos','Avisar o banco, se tiver risco de dinheiro','Avisar contatos e clientes'],w:'Primeiro tira o invasor, depois protege o dinheiro e as pessoas.'},
  {t:'info',q:'Parabéns: nível intermediário concluído',b:'Você agora está mais protegido que a grande maioria das pessoas e de pequenas empresas.\n\nNo <b>nível avançado</b>, o foco muda: em vez de proteger só você, você vai aprender como os <b>sites</b> são atacados e como construir os sites dos seus clientes de forma segura.'}
 ]}
]}]},
{id:'ciberpro',cat:'sec',nome:'Segurança avançada',icone:'🛡️',cor:'#073F45',req:'cibermed',sub:'Como sites são atacados e como proteger os seus',nivel:'Avançado',meta:'Entender os ataques mais comuns contra sites (XSS, injeção, CSRF), configurar cabeçalhos de segurança, proteger banco de dados e logins, cuidar de scripts de terceiros e saber responder a um incidente, inclusive o que a LGPD exige.',units:[
{u:'Unidade 1',t:'Como sites são atacados',l:[
 {n:'O mapa dos ataques',i:'🗺️',obj:['Conhecer a lista OWASP Top 10','Entender a ideia de superfície de ataque','Pensar como quem defende'],ex:[
  {t:'info',q:'Agora o alvo é o site',b:'Até aqui você protegeu <b>pessoas e aparelhos</b>. No nível avançado, o foco é o que você entrega pros clientes: <b>sites e sistemas</b>.\n\nO objetivo não é virar hacker. É entender os ataques o suficiente pra <b>não deixar as portas abertas</b> no seu próprio código.'},
  {t:'info',q:'A lista que o mundo todo usa',b:'A <b>OWASP</b> é uma organização sem fins lucrativos que publica o <b>Top 10</b>: os riscos mais comuns em aplicações web. Alguns que você vai ver neste curso:\n• <b>Controle de acesso quebrado</b>: alguém vê ou altera o que não devia\n• <b>Injeção</b>: dados do visitante viram comandos (inclui o XSS)\n• <b>Configuração insegura</b>: cabeçalhos faltando, senhas padrão\n• <b>Componentes vulneráveis</b>: bibliotecas desatualizadas\n• <b>Falhas de autenticação</b>: login fraco, sem limite de tentativas'},
  {t:'mc',q:'O que é o OWASP Top 10?',o:['Um antivírus','Uma lista dos riscos de segurança mais comuns em aplicações web','Um ranking de sites bonitos','Uma linguagem de programação'],a:1,w:'É a referência mais usada pra saber por onde começar a proteger um site.'},
  {t:'info',q:'Superfície de ataque',ana:'Uma casa com 10 janelas e 3 portas tem mais lugares por onde entrar do que uma casa com 1 porta. Cada abertura precisa de tranca.',b:'<b>Superfície de ataque</b> é tudo que um invasor pode tentar usar: formulários, login, painel, APIs, scripts de terceiros, contas de hospedagem.\n\nRegra prática: <b>quanto menos coisa exposta, melhor</b>. Um site só com HTML e CSS tem uma superfície minúscula. Um sistema com login, banco e painel tem muito mais pra proteger.'},
  {t:'mc',q:'Qual destes sites tem a MAIOR superfície de ataque?',o:['Uma página com texto e fotos','Um site com formulário, login, painel e banco de dados','Um cartão de visita digital','Uma página de "em breve"'],a:1,w:'Cada formulário, login e banco é uma porta a mais pra proteger.'},
  {t:'info',q:'Resumo da lição',b:'• O <b>OWASP Top 10</b> é o mapa dos riscos mais comuns\n• <b>Superfície de ataque</b> = tudo que pode ser usado pra invadir\n• Menos coisa exposta = menos risco'}
 ]},
 {n:'XSS a fundo',i:'💉',obj:['Entender como o XSS acontece','Conhecer os tipos refletido e armazenado','Prevenir com escape e textContent'],ex:[
